<title>Incentives & MPO Hub | Kohler Distributing</title>
<!-- Home-screen install (iPad / iPhone "Add to Home Screen", Android/Chrome "Install"): the
     app opens full-screen at /rep/ with the Kohler icon. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dist Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Every Kohler Distributing incentive and MPO program in one place: pick your name, see which programs apply to you, where you stand, what you still need and when each one ends.">
<!-- The MPO dashboards' own stylesheet. Program View renders their objective
     cards verbatim (.g-prog / .g-sum / .g-tag / .g-bar), so the two pages
     share one copy rather than the hub keeping a look-alike that drifts.
     Every rule in guided.css is .g-* scoped and it only consumes variables
     hub.css already defines, so it cannot touch anything else here. -->
<link rel="stylesheet" href="../MPOs/shared/guided.css?v=20261006a">
<link rel="stylesheet" href="hub.css?v=20261007m">
<script>try{var t=localStorage.getItem('kdh_theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="kdh-page" content="Incentive Hub">
<!-- Site design system: maps this page's variables + fonts onto shared/kdh.css. Keep it LAST in <head>. -->
<link rel="stylesheet" href="../shared/carbliss-tiles.css?v=20261007m">
<link rel="stylesheet" href="../shared/kdh-skin.css?v=20261008a">
</head>
<body>
<!--
  Incentives & MPO Hub -- one link for every incentive and MPO program.

  This page renders nothing of its own: it loads the three trackers' own
  program libraries (the same files those pages run) and arranges their
  results in one design. No number here is computed in this folder.

    ../incentive-tracking/data/program_data.js  the incentive data blobs (generate.py writes it)
    ../incentive-tracking/programs.js           incentive registries, summaries, cards, rules
    ../MPOs/on-prem/programs.js                 on-premise MPO registry + builders  (window.OnPremMPO)
    ../MPOs/off-prem/programs.js                off-premise MPO registry + builders (window.OffPremMPO)
    data/accounts.js                            each rep's customer base + brand territory (generate.py writes it)
    accounts.js                                 eligible / buying / high-potential / can't-sell logic
    hub.js                                      this page: adapters, sorting, screens

  Refreshing data is unchanged: run the tracker generators as usual and
  this page picks the new numbers up. See README.txt.

  The ?v= tags are cache-busters: GitHub Pages serves these files with a
  10-minute cache and phones hold them longer, so a shipped change to
  hub.css / hub.js that a rep "cannot see" is usually the OLD copy. Bump
  the tag (any new string) whenever hub.js, hub.css or accounts.js
  changes; the data files ride the same tag for the same reason.
-->
<div id="app"><main class="wrap"><div class="loading">Loading your programs…</div></main></div>

<script src="../incentive-tracking/data/program_data.js?v=20261007zz"></script>
<script src="../incentive-tracking/programs.js?v=20261007zz"></script>
<script src="../MPOs/on-prem/programs.js?v=20261008b"></script>
<script src="../MPOs/off-prem/programs.js?v=20261007x"></script>

<script src="accounts.js?v=20261008a"></script>
<script src="../shared/kdh-user.js?v=20261008d"></script>
<script src="../shared/carbliss-tiles.js?v=20261007b"></script>
<script src="../shared/program-titles.js?v=20261005e"></script>
<script src="../shared/eligibility.js?v=20261008b"></script>
<script src="../shared/fit-tables.js?v=20261006a"></script>
<!-- Served by the Vercel middleware (Supabase URL + publishable key) so the
     hub can save a rep's Done / Follow up / Not now marks. 404 on github.io,
     where the buttons simply do not render. -->
<script src="../shared/auth-config.js"></script>
<script src="../shared/kdh-data.js?v=20261008a"></script>
<script src="../shared/custom-programs.js?v=20261008c"></script>
<script src="hub.js?v=20261008b"></script>
</body>
</html>
