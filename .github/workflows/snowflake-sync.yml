name: Sync Snowflake Data

on:
  schedule:
    # Runs every 2 hours, 8am-4pm Eastern (12:00-20:00 UTC during EDT/summer).
    # GitHub Actions cron is always UTC and does not adjust for DST — if this
    # workflow is still running past early November, shift these hours back
    # by 1 (11:00-19:00 UTC) to stay on 8am-4pm EST.
    - cron: '0 12,14,16,18,20 * * *'
  workflow_dispatch:
    # Lets you trigger this manually from the Actions tab, no waiting for the schedule

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Run Snowflake sync script
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: python sync_snowflake_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add summer26/data/*.json MPOs/on-prem/data/*.json MPOs/off-prem/data/*.json
          git diff --quiet --cached || git commit -m "Auto-sync Snowflake data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
