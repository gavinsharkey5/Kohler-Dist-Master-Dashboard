<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in — Kohler Dist Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#0B1120;--card:#131B30;--ink:#F3F5FA;--ink-soft:#A3ADC4;--line:#22304F;--accent:#F2C14E;--good:#5fdc8c;--bad:#ff7b7b}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);min-height:100vh;font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;
    display:flex;align-items:center;justify-content:center;padding:24px 16px env(safe-area-inset-bottom);
    background-image:radial-gradient(90% 50% at 50% -10%,rgba(59,111,211,.28),transparent 70%);background-repeat:no-repeat}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 24px 24px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.45)}
  .banner{display:block;width:calc(100% + 48px);margin:0 -24px 18px;height:auto;aspect-ratio:1445/544;object-fit:cover;object-position:60% center;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;margin:0 0 18px}
  .brand img{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:contain}
  .eyebrow{font-family:"Oswald";letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:600;color:var(--ink-soft);margin:0}
  h1{font-family:"Oswald";font-weight:700;letter-spacing:-.02em;font-size:24px;line-height:1.1;margin:2px 0 0}
  p{margin:0 0 14px;color:var(--ink-soft);font-size:14.5px}
  label{display:block;font-family:"Oswald";font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
  input[type=email]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none}
  input[type=email]:focus{border-color:var(--accent)}
  button{width:100%;margin-top:12px;font-family:"Oswald";font-weight:700;font-size:15px;letter-spacing:.02em;color:#141414;background:var(--accent);border:0;border-radius:10px;padding:13px 16px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin:14px 0 0;padding:12px 14px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--canvas);display:none}
  .msg.show{display:block}
  .msg.good{border-color:#245834;color:var(--good)}
  .msg.bad{border-color:#5a2a2a;color:var(--bad)}
  .msg.info{color:var(--ink)}
  .foot{margin:18px 0 0;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px}
  .foot a{color:var(--ink-soft)}
  .hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <img class="banner" src="/assets/nj-banner.webp" alt="">
  <div class="brand">
    <img src="/assets/kohler-logo-badge.png" alt="">
    <div>
      <p class="eyebrow">Kohler Distributing</p>
      <h1>Kohler Dist Hub</h1>
    </div>
  </div>

  <div id="working">
    <p>Checking your sign-in&hellip;</p>
  </div>

  <form id="form" class="hidden" autocomplete="on">
    <p>Enter your email and we&rsquo;ll send you a link that signs you in. No password needed.</p>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
    <button id="send" type="submit">Email me a sign-in link</button>
  </form>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <p class="foot">Not on the list? Ask Gavin to add your email. <a id="signout" class="hidden" href="/login/?signout=1">Sign out</a></p>
</main>

<script src="/shared/auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var COOKIE = 'kdh_at';
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var next = safeNext(params.get('next'));

  function safeNext(v) {
    if (!v || v.charAt(0) !== '/' || v.charAt(1) === '/' || v.indexOf('/login') === 0) return '/';
    return v;
  }
  function say(kind, html) {
    var m = $('msg'); m.className = 'msg show ' + kind; m.innerHTML = html;
  }
  function showForm() { $('working').classList.add('hidden'); $('form').classList.remove('hidden'); }
  function setCookie(token) {
    document.cookie = COOKIE + '=' + encodeURIComponent(token) + '; Path=/; Max-Age=2592000; Secure; SameSite=Lax';
  }
  function clearCookie() {
    document.cookie = COOKIE + '=; Path=/; Max-Age=0; Secure; SameSite=Lax';
    document.cookie = 'kdh_user=; Path=/; Max-Age=0; Secure; SameSite=Lax';
    document.cookie = 'kdh_preview=; Path=/; Max-Age=0; Secure; SameSite=Lax';
  }

  var cfg = window.KDH_AUTH || {};
  if (!cfg.url || !cfg.key || !window.supabase) {
    showForm(); $('send').disabled = true;
    say('bad', 'Sign-in isn&rsquo;t configured on this deployment yet (SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY missing in Vercel).');
    return;
  }

  // A link that already expired comes back with the error in the hash.
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('error_description')) {
    history.replaceState(null, '', location.pathname + location.search);
    showForm();
    say('bad', 'That link didn&rsquo;t work: ' + escapeHtml(hash.get('error_description')) + '. Request a new one below.');
  }

  var sb = window.supabase.createClient(cfg.url, cfg.key, {
    auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
  });

  if (params.get('signout')) {
    sb.auth.signOut().then(function () {
      clearCookie();
      history.replaceState(null, '', '/login/');
      showForm();
      say('info', 'You&rsquo;re signed out.');
    });
    wireForm();
    return;
  }

  var why = params.get('why');
  var whyText = {
    expired: 'Your session expired. Sign in again to continue.',
    invalid: 'Please sign in again to continue.',
    notlisted: 'That account isn&rsquo;t on the access list. Ask Gavin to add your email.',
    unavailable: 'The sign-in service didn&rsquo;t respond. Try again in a moment.'
  }[why];

  var entered = false;
  sb.auth.onAuthStateChange(function (event, session) {
    if (session && !entered) { entered = true; enter(session); return; }
    if (!session && event === 'INITIAL_SESSION') {
      showForm();
      if (whyText) say('info', whyText);
    }
    if (event === 'SIGNED_OUT') clearCookie();
  });

  function enter(session) {
    setCookie(session.access_token);
    sb.from('allowed_users').select('email,name,role,title,reports_to').limit(1).then(function (res) {
      if (res.error) {
        entered = false; showForm();
        say('bad', 'Couldn&rsquo;t check the access list: ' + escapeHtml(res.error.message));
        return;
      }
      if (!res.data || !res.data.length) {
        sb.auth.signOut().then(function () {
          clearCookie(); entered = false; showForm();
          say('bad', 'Signed in as <b>' + escapeHtml(session.user.email) + '</b>, but that email isn&rsquo;t on the access list. Ask Gavin to add it.');
        });
        return;
      }
      var me = res.data[0];
      // Who is signed in, for the pages (the hub locks a rep to their own
      // name; the landing pages greet by name). Not used for access
      // decisions -- the middleware asks Supabase for the role itself.
      document.cookie = 'kdh_user=' + encodeURIComponent(JSON.stringify({ name: me.name || '', role: me.role || 'rep', email: me.email, title: me.title || '', dm: me.reports_to || '' })) +
        '; Path=/; Max-Age=2592000; Secure; SameSite=Lax';
      $('signout').classList.remove('hidden');
      say('good', 'Signed in as <b>' + escapeHtml(me.name || session.user.email) + '</b>. Opening&hellip;');
      location.replace(next === '/' && me.role !== 'manager' ? '/rep/' : next);
    });
  }

  function wireForm() {
    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = $('email').value.trim().toLowerCase();
      if (!email) return;
      $('send').disabled = true;
      say('info', 'Checking&hellip;');
      sb.rpc('is_allowed', { p_email: email }).then(function (res) {
        if (res.error) {
          $('send').disabled = false;
          say('bad', 'Couldn&rsquo;t check the access list: ' + escapeHtml(res.error.message));
          return;
        }
        if (!res.data) {
          $('send').disabled = false;
          say('bad', '<b>' + escapeHtml(email) + '</b> isn&rsquo;t on the access list. Ask Gavin to add it.');
          return;
        }
        var back = location.origin + '/login/' + (next !== '/' ? '?next=' + encodeURIComponent(next) : '');
        return sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: back } }).then(function (r) {
          $('send').disabled = false;
          if (r.error) { say('bad', 'Couldn&rsquo;t send the link: ' + escapeHtml(r.error.message)); return; }
          say('good', 'Check <b>' + escapeHtml(email) + '</b> for a message from Kohler Dist Hub and tap the link in it. It works on this phone or any other device.');
        });
      });
    });
  }
  wireForm();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
