<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory</title>
<style>
  /* Rep inventory list (2026-10-14). One question: what can I sell right now?
     Layout after the Shopify inventory list (title, search + Sort / Filter on
     one row, chips, plain rows with a quantity pill), Resy's sticky section
     headers for the supplier groups, and Copilot's dismissible filter chip.
     Colours are the shared kdh tokens only -- both themes come from them. */
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{--bar-h:0px;--tools-h:0px}
  body{margin:0;background:var(--kdh-bg);color:var(--kdh-text);font-family:var(--kdh-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
  button{font:inherit;color:inherit}

  /* header */
  .ph{text-align:center;margin:4px 0 12px}
  .ph h1{font-size:26px;font-weight:600;margin:0;letter-spacing:0}
  .snap{margin:4px 0 0;font-size:14px;color:var(--kdh-text-3);display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
  .snap b{font-weight:600;color:var(--kdh-text-2)}

  /* KPI tiles -- three counts the report supports; each one is a filter */
  .ik{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 14px}
  .ik button{display:block;width:100%;min-height:76px;padding:12px 8px;border:1px solid var(--kdh-border);border-radius:12px;background:var(--kdh-surface);text-align:center;cursor:pointer}
  .ik button:hover{border-color:var(--kdh-border-2)}
  .ik button[aria-pressed="true"]{border-color:var(--kdh-brand);box-shadow:0 0 0 1px var(--kdh-brand) inset}
  .ik .n{display:block;font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .ik .l{display:block;font-size:14px;color:var(--kdh-text-3);margin-top:4px;line-height:1.3}
  .ik .k-in .n{color:var(--kdh-ok)} .ik .k-out .n{color:var(--kdh-bad)} .ik .k-low .n{color:var(--kdh-warn)}
  @media (max-width:430px){ .ik{gap:8px} .ik .n{font-size:26px} .ik .l{font-size:13.5px} .ik button{padding:12px 6px} }

  /* search + sort + filter (sticky under the site bar) */
  .tools{position:sticky;top:var(--bar-h);z-index:5;background:var(--kdh-bg);padding:4px 0 8px;margin:0 -2px}
  .srow{display:flex;gap:8px;align-items:center;padding:0 2px}
  .sbox{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--kdh-border);border-radius:12px;background:var(--kdh-surface)}
  .sbox:focus-within{border-color:var(--kdh-brand);box-shadow:0 0 0 3px var(--kdh-ring)}
  .sbox svg{width:18px;height:18px;flex:none;color:var(--kdh-text-3)}
  .sbox input{flex:1 1 auto;min-width:0;height:100%;border:0;background:none;font:inherit;font-size:16px;color:var(--kdh-text);outline:none;padding:0}
  .sbox input::-webkit-search-cancel-button{display:none}
  .sclr{flex:none;width:32px;height:32px;margin-right:-6px;border:0;border-radius:50%;background:var(--kdh-surface-3);color:var(--kdh-text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .sclr svg{width:14px;height:14px}
  .ib{position:relative;flex:none;width:44px;height:44px;border:1px solid var(--kdh-border);border-radius:12px;background:var(--kdh-surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .ib:hover{border-color:var(--kdh-border-2)}
  .ib svg{width:20px;height:20px;color:var(--kdh-text-2)}
  .ib[aria-expanded="true"],.ib.on{border-color:var(--kdh-brand);background:var(--kdh-brand-soft)}
  .ib.on svg{color:var(--kdh-brand)}
  .ib .bdg{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--kdh-brand);color:var(--kdh-brand-ink);font-size:12px;font-weight:600;line-height:20px;text-align:center}
  .chips{display:flex;gap:8px;margin:10px 0 0;padding:0 2px 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--kdh-border);border-radius:999px;background:var(--kdh-surface);color:var(--kdh-text-2);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--kdh-surface-3);border-color:var(--kdh-surface-3);color:var(--kdh-text);font-weight:600}
  .chip.sel{background:var(--kdh-brand-soft);border-color:transparent;color:var(--kdh-brand);font-weight:600;padding-right:8px}
  .chip.sel svg{width:14px;height:14px;flex:none}
  .chip .c{color:var(--kdh-text-3);font-weight:500}
  .chip[aria-pressed="true"] .c{color:var(--kdh-text-2)}
  /* phones: the tiles carry the counts and the Starred chip is its star + count, so every chip fits a 375px screen */
  @media (max-width:479px){ .chip{padding:0 12px} .chip .c{display:none} .chip[data-status="star"] .sl{display:none} .chip[data-status="star"] .c{display:inline} }

  /* count line */
  .cnt{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 4px;font-size:14px;color:var(--kdh-text-3);min-height:24px}
  .cnt button{border:0;background:none;color:var(--kdh-brand);font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px}

  /* list */
  .list{background:var(--kdh-surface);border:1px solid var(--kdh-border);border-radius:12px;overflow:visible}
  .gh{position:sticky;top:calc(var(--bar-h) + var(--tools-h));z-index:4;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 16px 6px;background:var(--kdh-surface);border-bottom:1px solid var(--kdh-border);font-size:14px;font-weight:600;color:var(--kdh-text-2)}
  .gh .c{font-weight:500;color:var(--kdh-text-3);white-space:nowrap}
  .list .gh:first-child{border-top-left-radius:12px;border-top-right-radius:12px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;min-height:56px;padding:10px 16px;border-bottom:1px solid var(--kdh-border);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--kdh-surface-2)}
  .row:focus-visible{outline:2px solid var(--kdh-brand);outline-offset:-2px}
  .rname{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .rsub{font-size:14px;color:var(--kdh-text-3);margin-top:2px;overflow-wrap:anywhere}
  .pill{justify-self:end;min-width:64px;height:36px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid transparent;white-space:nowrap}
  .pill.ok{background:var(--kdh-ok-soft);color:var(--kdh-ok)}
  .pill.low{background:var(--kdh-warn-soft);color:var(--kdh-warn)}
  .pill.out{background:var(--kdh-bad-soft);color:var(--kdh-bad)}
  .det{display:none;grid-column:1 / -1;grid-template-columns:1fr 1fr;gap:8px 16px;padding:8px 0 4px;border-top:1px dashed var(--kdh-border);margin-top:6px}
  .row.open .det{display:grid}
  .dk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
  .dk .dl{color:var(--kdh-text-3)}
  .dk .dv{font-weight:600;font-variant-numeric:tabular-nums;color:var(--kdh-text)}
  .dk.a .dv{font-weight:700}
  @media (min-width:768px){
    /* iPad and up: the four figures sit inline, no accordion */
    .row{grid-template-columns:minmax(0,1fr) auto auto;cursor:default}
    .row:hover{background:var(--kdh-surface)}
    .det{display:grid;grid-column:auto;grid-template-columns:repeat(3,minmax(84px,auto));gap:16px;padding:0;border:0;margin:0;order:1}
    .pill{order:2}
    .dk{flex-direction:column;align-items:flex-end;gap:0;line-height:1.2}
    .dk .dl{font-size:12.5px}
    .dk.a{display:none}
  }
  @media (min-width:960px){ .det{gap:28px} }

  /* skeleton while the first chunk renders */
  .sk{padding:12px 16px;border-bottom:1px solid var(--kdh-border);display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:12px;align-items:center;min-height:56px}
  .sk span{display:block;height:12px;border-radius:6px;background:var(--kdh-surface-3);animation:sh 1.2s ease-in-out infinite}
  .sk .a{width:60%;margin-bottom:8px} .sk .b{width:35%;height:10px} .sk .p{height:32px;border-radius:999px}
  @keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){ .sk span{animation:none} }

  .more{display:flex;justify-content:center;padding:14px 0 0}
  .more button{min-height:44px;padding:0 20px;border:1px solid var(--kdh-border);border-radius:10px;background:var(--kdh-surface);cursor:pointer;font-weight:600}
  .empty{text-align:center;padding:36px 16px;background:var(--kdh-surface);border:1px solid var(--kdh-border);border-radius:12px}
  .empty h2{font-size:17px;font-weight:600;margin:0 0 6px}
  .empty p{margin:0 0 14px;color:var(--kdh-text-3);font-size:14px}
  .empty button{min-height:44px;padding:0 18px;border:1px solid var(--kdh-border);border-radius:10px;background:var(--kdh-surface);cursor:pointer;font-weight:600}

  footer{margin-top:28px;font-size:14px;color:var(--kdh-text-3)}
  footer ul{padding-left:18px;margin:8px 0 0} footer li{margin:6px 0}
  footer a{color:var(--kdh-brand)}
  html.kdh-rep .mgr-only{display:none}

  /* bottom sheet (phones) / centred dialog (tablet, desktop) */
  .sh{position:fixed;inset:0;z-index:1200;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,12,32,.45)}
  .shp{width:100%;max-height:min(86vh,720px);display:flex;flex-direction:column;background:var(--kdh-surface);color:var(--kdh-text);border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
  .shh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--kdh-border)}
  .shh h2{font-size:17px;font-weight:600;margin:0}
  .shh button{min-height:40px;padding:0 12px;border:0;background:none;color:var(--kdh-brand);font-weight:600;cursor:pointer;border-radius:8px}
  .shb{overflow:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
  .shf{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--kdh-border)}
  .shf button{flex:1 1 auto;min-height:44px;border-radius:10px;border:1px solid var(--kdh-border);background:var(--kdh-surface);font-weight:600;cursor:pointer}
  .shf button.pri{background:var(--kdh-brand);border-color:var(--kdh-brand);color:var(--kdh-brand-ink)}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:0 4px;border:0;border-bottom:1px solid var(--kdh-border);background:none;text-align:left;cursor:pointer;font-size:16px}
  .opt:last-child{border-bottom:0}
  .opt svg{width:20px;height:20px;color:var(--kdh-brand);flex:none;visibility:hidden}
  .opt[aria-checked="true"]{font-weight:600} .opt[aria-checked="true"] svg{visibility:visible}
  .fs{margin:8px 0 14px}
  .fs h3{font-size:15px;font-weight:600;margin:8px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  .fs h3 span{font-weight:500;font-size:14px;color:var(--kdh-text-3)}
  .fs .sbox{height:40px;margin-bottom:6px}
  .fl{max-height:216px;overflow:auto;border:1px solid var(--kdh-border);border-radius:10px;-webkit-overflow-scrolling:touch}
  .fl label{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px;border-bottom:1px solid var(--kdh-border);cursor:pointer;font-size:15px}
  .fl label:last-child{border-bottom:0}
  .fl input{width:20px;height:20px;margin:0;accent-color:var(--kdh-brand);flex:none}
  .fl .t{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .fl .c{color:var(--kdh-text-3);font-size:14px;font-variant-numeric:tabular-nums}
  .fl .none{padding:12px;color:var(--kdh-text-3);font-size:14px}
  @media (min-width:760px){
    .sh{align-items:center;padding:24px}
    .shp{width:min(520px,100%);max-height:min(80vh,720px);border-radius:16px;padding-bottom:0}
  }
  html.sh-open{overflow:hidden}

  /* star (2026-10-14): the rep's own shortlist; the leading slot of every row */
  .row{grid-template-columns:auto minmax(0,1fr) auto}
  .star{width:44px;height:44px;margin:-4px 0 -4px -10px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--kdh-text-4);border-radius:10px;padding:0;flex:none}
  .star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
  .star[aria-pressed="true"]{color:var(--kdh-gold,#B7791F)} .star[aria-pressed="true"] svg{fill:currentColor}
  .star:hover{background:var(--kdh-surface-3)} .star:focus-visible{outline:2px solid var(--kdh-brand);outline-offset:-2px}
  html.no-star .star{display:none} html.no-star .row{grid-template-columns:minmax(0,1fr) auto}
  .gh.gstar{color:var(--kdh-text)} .gh .gsub{font-weight:500;color:var(--kdh-text-3);white-space:nowrap}
  .chip .sv{width:14px;height:14px;fill:currentColor;flex:none}
  @media (min-width:768px){
    .row{grid-template-columns:auto minmax(0,1fr) auto auto}
    html.no-star .row{grid-template-columns:minmax(0,1fr) auto auto}
  }
  /* brand scope line (managers who cover suppliers) */
  .scope{margin:6px 0 0;font-size:14px;color:var(--kdh-text-2);text-align:center}
  .scope b{font-weight:600}
</style>
<script src="../shared/kdh-user.js?v=20261014b"></script>
<script src="../shared/auth-config.js"></script>
<script src="../shared/dm-groups.js"></script>
<script>try{var t=localStorage.getItem('kdh_theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="kdh-page" content="Inventory">
<!-- Site design system: maps this page's variables + fonts onto shared/kdh.css. Keep it LAST in <head>. -->
<link rel="stylesheet" href="../shared/kdh-skin.css?v=20261008a">
</head>
<body>
<div class="wrap">
  <header class="ph">
    <h1>Inventory</h1>
    <p class="snap"><span id="asOf"></span><span id="stale"></span></p>
    <p class="scope" id="scopeLine" hidden></p>
  </header>

  <div class="ik" id="kpis" aria-label="Stock summary"></div>

  <div class="tools" id="tools">
    <div class="srow">
      <label class="sbox" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search Product or Number" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search products by number or name" enterkeyhint="search">
        <button type="button" class="sclr" id="qClr" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label>
      <button type="button" class="ib" id="sortBtn" aria-label="Sort" aria-haspopup="dialog" aria-expanded="false" title="Sort">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
      </button>
      <button type="button" class="ib" id="filtBtn" aria-label="Filter" aria-haspopup="dialog" aria-expanded="false" title="Filter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        <span class="bdg" id="fbadge" hidden></span>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filters"></div>
  </div>

  <p class="cnt"><span id="count"></span><button type="button" id="clearAll" hidden>Clear</button></p>

  <div class="list" id="list" aria-live="polite" aria-busy="true">
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
    <div class="sk"><div><span class="a"></span><span class="b"></span></div><span class="p"></span></div>
  </div>
  <div class="empty" id="empty" hidden>
    <h2>No Products Match</h2>
    <p id="emptySub">Try a product number or a word from the name.</p>
    <button type="button" id="emptyClear">Clear Search &amp; Filters</button>
  </div>
  <div class="more" id="more" hidden><button type="button" id="moreBtn">Show More</button></div>

  <footer>
    <details class="kdh-details"><summary>About This Data</summary><ul id="notes"></ul></details>
    <p class="mgr-only" style="margin-top:14px">Inventory value, cost and write-off exposure are on the
      <a href="../inventory-overview/">Inventory Overview</a> (managers).</p>
  </footer>
</div>

<!-- Sort sheet -->
<div class="sh" id="sortSheet" hidden>
  <div class="shp" role="dialog" aria-modal="true" aria-labelledby="sortTitle">
    <div class="shh"><h2 id="sortTitle">Sort</h2><button type="button" data-close>Done</button></div>
    <div class="shb" id="sortOpts"></div>
  </div>
</div>

<!-- Filter sheet -->
<div class="sh" id="filtSheet" hidden>
  <div class="shp" role="dialog" aria-modal="true" aria-labelledby="filtTitle">
    <div class="shh"><h2 id="filtTitle">Filter</h2><button type="button" data-close>Done</button></div>
    <div class="shb">
      <div class="fs">
        <h3>Supplier <span id="supSel"></span></h3>
        <label class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="supQ" placeholder="Find a Supplier" autocomplete="off" aria-label="Find a supplier"></label>
        <div class="fl" id="supList"></div>
      </div>
      <div class="fs">
        <h3>Brand Family <span id="famSel"></span></h3>
        <label class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="famQ" placeholder="Find a Brand Family" autocomplete="off" aria-label="Find a brand family"></label>
        <div class="fl" id="famList"></div>
      </div>
    </div>
    <div class="shf"><button type="button" id="filtClear">Clear All</button><button type="button" class="pri" id="filtDone" data-close>Show Products</button></div>

<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('rep-data').textContent || '{}');
const S = DATA.summary || {};
const ALL = DATA.products || [];
let P = ALL;                      // the rows this person may see (a brand manager: their suppliers)
const LOW_MAX = DATA.lowMax || 24;
const n0 = v => Math.round(Number(v)||0).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr = s => s ? new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const $ = id => document.getElementById(id);
const U = (function(){ try{ return window.kdhUser ? window.kdhUser() : null; }catch(e){ return null; } })();
const cookie = n => { const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; };

// one lowercase haystack per product: the full "Product Num Name" string
ALL.forEach((p,i)=>{ p.i=i; p.s=((p.num||'')+' '+(p.name||'')).toLowerCase(); });

/* ---------- freshness ---------- */
$('asOf').innerHTML = `<b>Inventory as of ${esc(dstr(DATA.asOf))}</b>`;
(function(){
  const age = DATA.asOf ? Math.floor((Date.now() - new Date(DATA.asOf+'T00:00:00').getTime())/86400000) : null;
  if(age!=null && age > (DATA.staleDays||7))
    $('stale').innerHTML = `<span class="kdh-tag stale" title="These numbers are ${age} days old; check Encompass before promising stock">Snapshot is ${age} days old</span>`;
})();

/* ---------- state (sort + filters persist; search does not) ---------- */
const LS = 'kdh_inv:v2';
const SORTS = {avail:'Available, High to Low', az:'Name, A to Z', pre:'Pre Sales, High to Low'};
const STATUS = {star:'Starred', in:'In Stock', low:'Low', out:'Out'};
const F = {sort:'avail', status:'', sup:[], fam:[]};
try{ const s=JSON.parse(localStorage.getItem(LS)||'{}');
  if(SORTS[s.sort]) F.sort=s.sort; if(STATUS[s.status]||s.status==='') F.status=s.status||'';
  if(Array.isArray(s.sup)) F.sup=s.sup.filter(x=>typeof x==='string'); if(Array.isArray(s.fam)) F.fam=s.fam.filter(x=>typeof x==='string');
}catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(F)); }catch(e){} }
let q = '';
let openId = null;

/* ---------- STARRED PRODUCTS (2026-10-14): the person's own shortlist ----------
   Kept on this device (localStorage, keyed by the signed-in email) and synced to
   public.product_stars with the signed-in token when the migration is in; a 404
   there just means device-only. A manager previewing a rep cannot star (their
   stars would be their own, not the rep's), so the control is hidden. */
const fnv = str => { let h = 0x811c9dc5; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
const Stars = (function(){
  const email = U && U.email ? String(U.email).toLowerCase() : '';
  const enabled = !!email && !(U && U.preview);
  const key = 'kdh_inv_star:v1:' + fnv(email || 'anon');
  let on = new Set(), off = new Set(), remote = null;   // off = removals the server has not confirmed
  try{ const j = JSON.parse(localStorage.getItem(key) || '{}'); (j.on||[]).forEach(n=>on.add(String(n))); (j.off||[]).forEach(n=>off.add(String(n))); }catch(e){}
  function persist(){ try{ localStorage.setItem(key, JSON.stringify({on:[...on], off:[...off]})); }catch(e){} }
  const cfg = window.KDH_AUTH || null;
  const api = () => cfg && cfg.url && cfg.key && cookie('kdh_at') ? String(cfg.url).replace(/\/$/,'') + '/rest/v1/product_stars' : null;
  const hdr = extra => Object.assign({apikey: cfg.key, authorization: 'Bearer ' + cookie('kdh_at'), accept: 'application/json'}, extra||{});
  async function push(nums){
    const u = api(); if(!u || remote===false || !nums.length) return false;
    const byNum = {}; ALL.forEach(p=>{ byNum[p.num]=p.name; });
    const r = await fetch(u + '?on_conflict=email,product_num', {method:'POST', headers: hdr({'content-type':'application/json', prefer:'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify(nums.map(n=>({email:'', product_num:n, product_name: byNum[n] || null})))}).catch(()=>null);
    return !!(r && r.ok);
  }
  async function drop(num){
    const u = api(); if(!u || remote===false) return false;
    const r = await fetch(u + '?product_num=eq.' + encodeURIComponent(num), {method:'DELETE', headers: hdr()}).catch(()=>null);
    return !!(r && r.ok);
  }
  async function load(){
    const u = api(); if(!enabled || !u) return false;
    const r = await fetch(u + '?select=product_num', {headers: hdr()}).catch(()=>null);
    if(!r){ return false; }
    if(r.status===404){ remote = false; return false; }          // migration not run yet: device-only
    if(!r.ok) return false;
    let rows = []; try{ rows = await r.json(); }catch(e){ return false; }
    remote = true;
    const server = new Set((rows||[]).map(x=>String(x.product_num)));
    // removals made offline go up first; then the union comes down
    for(const n of [...off]){ if(!server.has(n) || await drop(n)) off.delete(n); }
    const before = [...on].sort().join(',');
    server.forEach(n=>{ if(!off.has(n)) on.add(n); });
    const mine = [...on].filter(n=>!server.has(n));
    if(mine.length) push(mine);
    persist();
    return [...on].sort().join(',') !== before;
  }
  function toggle(num, name){
    if(!enabled) return;
    num = String(num);
    if(on.has(num)){ on.delete(num); off.add(num); persist(); drop(num).then(ok=>{ if(ok){ off.delete(num); persist(); } }); }
    else { on.add(num); off.delete(num); persist(); push([num]); }
  }
  return { enabled, has: n => on.has(String(n)), size: () => on.size, toggle, load, list: () => [...on] };
})();
if(!Stars.enabled) document.documentElement.classList.add('no-star');

/* ---------- indexes (rebuilt after the brand scope cuts P) ---------- */
let supCount = {}, famCount = {}, famSup = {}, SUPS = [], FAMS = [], C = {ok:0, low:0, out:0};
function index(){
  supCount = {}; famCount = {}; famSup = {}; C = {ok:0, low:0, out:0};
  P.forEach(p=>{ supCount[p.supplier]=(supCount[p.supplier]||0)+1; famCount[p.family]=(famCount[p.family]||0)+1; (famSup[p.family]=famSup[p.family]||new Set()).add(p.supplier); C[p.status]=(C[p.status]||0)+1; });
  SUPS = Object.keys(supCount).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
  FAMS = Object.keys(famCount).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
  // drop persisted names this person's report no longer has
  F.sup = F.sup.filter(s=>supCount[s]); F.fam = F.fam.filter(f=>famCount[f]);
  if(F.status==='star' && !Stars.enabled) F.status = '';
}

const statusOk = p => !F.status || (F.status==='in' ? p.available>0 : F.status==='low' ? p.status==='low' : F.status==='out' ? p.status==='out' : F.status==='star' ? Stars.has(p.num) : true);
function matches(p){
  if(!statusOk(p)) return false;
  if(F.sup.length && F.sup.indexOf(p.supplier)<0) return false;
  if(F.fam.length && F.fam.indexOf(p.family)<0) return false;
  if(q && p.s.indexOf(q)<0) return false;
  return true;
}
function cmp(a,b){
  if(F.sort==='az') return a.name.localeCompare(b.name,undefined,{sensitivity:'base'}) || a.num.localeCompare(b.num);
  if(F.sort==='pre') return (b.preSales-a.preSales) || (b.available-a.available) || a.name.localeCompare(b.name);
  return (b.available-a.available) || a.name.localeCompare(b.name,undefined,{sensitivity:'base'});
}
const filtersOn = () => !!(F.status || F.sup.length || F.fam.length);
const grouped = () => !q && !filtersOn();

/* ---------- KPI tiles ---------- */
function kpis(){
  const t = [
    {k:'in',  cls:'k-in',  n:(C.ok||0)+(C.low||0), l:'Products Available'},
    {k:'out', cls:'k-out', n:C.out||0, l:'Out of Stock'},
    {k:'low', cls:'k-low', n:C.low||0, l:'Running Low'},
  ];
  $('kpis').innerHTML = t.map(x=>`<button type="button" class="${x.cls}" data-status="${x.k}" aria-pressed="${F.status===x.k}" title="${F.status===x.k?'Show all products':'Show only these products'}"><span class="n">${n0(x.n)}</span><span class="l">${x.l}</span></button>`).join('');
}
$('kpis').addEventListener('click', e=>{
  const b=e.target.closest('[data-status]'); if(!b) return;
  F.status = F.status===b.dataset.status ? '' : b.dataset.status; save(); render();
});

/* ---------- chips ---------- */
const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg>';
function chips(){
  const st = [['', 'All', P.length], ['in','In Stock',(C.ok||0)+(C.low||0)], ['low','Low',C.low||0], ['out','Out',C.out||0]];
  // the dismissible supplier / brand chips come first so they are never scrolled out of sight
  let h = F.sup.map(s=>`<button type="button" class="chip sel" data-rm="sup" data-v="${esc(s)}" aria-label="Remove supplier filter ${esc(s)}"><span>${esc(s)}</span>${X}</button>`).join('');
  h += F.fam.map(s=>`<button type="button" class="chip sel" data-rm="fam" data-v="${esc(s)}" aria-label="Remove brand family filter ${esc(s)}"><span>${esc(s)}</span>${X}</button>`).join('');
  if(Stars.enabled) h += `<button type="button" class="chip" data-status="star" aria-pressed="${F.status==='star'}"><svg class="sv" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg><span class="sl">Starred</span> <span class="c">${n0(starCount())}</span></button>`;
  h += st.map(([k,l,n])=>`<button type="button" class="chip" data-status="${k}" aria-pressed="${F.status===k}">${l}${k?` <span class="c">${n0(n)}</span>`:''}</button>`).join('');
  $('chips').innerHTML = h;
  const nf = F.sup.length + F.fam.length;
  $('fbadge').hidden = !nf; $('fbadge').textContent = nf;
  $('filtBtn').classList.toggle('on', nf>0);
  $('sortBtn').classList.toggle('on', F.sort!=='avail');
}
const starCount = () => P.reduce((n,p)=>n + (Stars.has(p.num)?1:0), 0);
$('chips').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.rm){ const a = F[b.dataset.rm]; const i=a.indexOf(b.dataset.v); if(i>=0) a.splice(i,1); save(); render(); return; }
  if(b.dataset.status!=null){ F.status = b.dataset.status; save(); render(); }
});

/* ---------- list (chunked: ~3,200 rows, first paint is the first chunk) ---------- */
const CHUNK0 = 60, CHUNK = 120;
let VIEW = [], shown = 0, rowsTotal = 0;
const wide = window.matchMedia('(min-width:768px)');
function build(){
  const rows = P.filter(matches).sort(cmp);
  rowsTotal = rows.length;
  VIEW = [];
  if(grouped()){
    // the person's starred products first (their day starts there), then every supplier A-Z
    if(Stars.enabled){
      const mine = rows.filter(p=>Stars.has(p.num));
      if(mine.length){
        const out = mine.filter(p=>p.status==='out').length, low = mine.filter(p=>p.status==='low').length;
        const sub = [out ? `${n0(out)} Out` : '', low ? `${n0(low)} Low` : ''].filter(Boolean).join(' · ') || 'All In Stock';
        VIEW.push({h:'Starred', n:mine.length, star:true, sub}); mine.forEach(p=>VIEW.push(p));
      }
    }
    const by = {};
    rows.forEach(p=>{ (by[p.supplier]=by[p.supplier]||[]).push(p); });
    Object.keys(by).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'})).forEach(s=>{
      VIEW.push({h:s, n:by[s].length}); by[s].forEach(p=>VIEW.push(p));
    });
  } else VIEW = rows;
}
function rowHtml(p){
  const w = wide.matches, on = Stars.has(p.num);
  return `<div class="row${openId===p.i?' open':''}" data-i="${p.i}"${w?'':` role="button" tabindex="0" aria-expanded="${openId===p.i}"`}>
    ${Stars.enabled ? `<button type="button" class="star" data-star="${esc(p.num)}" aria-pressed="${on}" aria-label="${on?'Unstar':'Star'} ${esc(p.name)}" title="${on?'Remove from Starred':'Star this product'}">${STAR}</button>` : ''}
    <div class="rmain"><div class="rname">${esc(p.name)}</div><div class="rsub">#${esc(p.num)} · ${esc(p.family)}</div></div>
    <span class="pill ${p.status}" aria-label="Available ${n0(p.available)}">${n0(p.available)}</span>
    <div class="det">
      <div class="dk"><span class="dl">On Floor</span><span class="dv">${n0(p.onFloor)}</span></div>
      <div class="dk"><span class="dl">Pre Sales</span><span class="dv">${n0(p.preSales)}</span></div>
      <div class="dk"><span class="dl">Allocated</span><span class="dv">${n0(p.allocated)}</span></div>
      <div class="dk a"><span class="dl">Available</span><span class="dv">${n0(p.available)}</span></div>
    </div></div>`;
}
const itemHtml = x => x.h!=null
  ? `<div class="gh${x.star?' gstar':''}"><span>${x.star ? STAR.replace('<svg ', '<svg class="sv" style="width:16px;height:16px;fill:var(--kdh-gold,#B7791F);vertical-align:-2px;margin-right:6px" ') : ''}${esc(x.h)}</span><span class="c">${x.sub ? `<span class="gsub">${esc(x.sub)} · </span>` : ''}${n0(x.n)} ${x.n===1?'Product':'Products'}</span></div>`
  : rowHtml(x);
function append(n){
  const end = Math.min(VIEW.length, shown+n);
  if(end>shown){ $('list').insertAdjacentHTML('beforeend', VIEW.slice(shown,end).map(itemHtml).join('')); shown = end; }
  $('more').hidden = shown>=VIEW.length;
}
function render(){
  kpis(); chips(); build();
  const L = $('list'); L.innerHTML=''; shown=0;
  const empty = rowsTotal===0;
  L.hidden = empty; $('empty').hidden = !empty; $('more').hidden = true;
  if(empty){
    if(!P.length){ $('empty').querySelector('h2').textContent = 'None of Your Suppliers Are on This Report'; $('emptySub').textContent = 'The inventory report has no products for the suppliers you cover.'; $('emptyClear').hidden = true; }
    else if(F.status==='star' && !q && !F.sup.length && !F.fam.length){ $('empty').querySelector('h2').textContent = 'No Starred Products'; $('emptySub').textContent = 'Tap the star on a product to keep it here, at the top of your list.'; $('emptyClear').hidden = false; }
    else { $('empty').querySelector('h2').textContent = 'No Products Match'; $('emptySub').textContent = q ? `Nothing matches “${q}”${filtersOn()?' with the current filters':''}. Try a product number or a word from the name.` : 'Nothing matches the current filters.'; $('emptyClear').hidden = false; }
  } else append(CHUNK0);
  L.setAttribute('aria-busy','false');
  const on = q || filtersOn();
  $('count').textContent = !P.length ? '' : on ? `${n0(rowsTotal)} ${rowsTotal===1?'Product Matches':'Products Match'}` : `${n0(P.length)} Products · ${n0(SUPS.length)} ${SUPS.length===1?'Supplier':'Suppliers'}`;
  $('clearAll').hidden = !on;
  if($('filtSheet').hidden===false) filtLists();
  $('filtDone').textContent = rowsTotal ? `Show ${n0(rowsTotal)} ${rowsTotal===1?'Product':'Products'}` : 'No Products Match';
  measure();
}
$('moreBtn').addEventListener('click', ()=>append(CHUNK));
if('IntersectionObserver' in window){
  // the first notification can carry the geometry of the frame before the list
  // filled, so the real position is re-checked before a chunk is appended
  const near = () => !$('more').hidden && $('more').getBoundingClientRect().top < window.innerHeight + 600;
  new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting) && near()) append(CHUNK); }, {rootMargin:'600px 0px'}).observe($('more'));
}
function toggleRow(row){
  if(wide.matches) return;
  const i = Number(row.dataset.i);
  const was = $('list').querySelector('.row.open');
  if(was && was!==row){ was.classList.remove('open'); was.setAttribute('aria-expanded','false'); }
  const open = !row.classList.contains('open');
  row.classList.toggle('open', open); row.setAttribute('aria-expanded', open?'true':'false');
  openId = open ? i : null;
}
function toggleStar(btn){
  const num = btn.dataset.star, p = ALL.find(x=>x.num===num);
  Stars.toggle(num, p ? p.name : '');
  // every copy of the row (Starred group + its supplier) follows; the Starred group itself is redrawn
  const on = Stars.has(num);
  $('list').querySelectorAll(`.star[data-star="${CSS.escape(num)}"]`).forEach(b=>{ b.setAttribute('aria-pressed', on?'true':'false'); b.setAttribute('aria-label', (on?'Unstar ':'Star ') + (p?p.name:'')); b.title = on ? 'Remove from Starred' : 'Star this product'; });
  if(grouped() || F.status==='star'){ const y = window.scrollY; render(); window.scrollTo(0, y); } else chips();
}
$('list').addEventListener('click', e=>{ const sb=e.target.closest('.star'); if(sb){ e.stopPropagation(); toggleStar(sb); return; } const r=e.target.closest('.row'); if(r) toggleRow(r); });
$('list').addEventListener('keydown', e=>{ if(e.key!=='Enter' && e.key!==' ') return; if(e.target.closest('.star')) return; const r=e.target.closest('.row'); if(r){ e.preventDefault(); toggleRow(r); } });
wide.addEventListener ? wide.addEventListener('change', render) : wide.addListener(render);

/* ---------- search (debounced, substring, case-insensitive) ---------- */
let qt = null;
$('q').addEventListener('input', ()=>{
  $('qClr').hidden = !$('q').value;
  clearTimeout(qt); qt = setTimeout(()=>{ const v=$('q').value.trim().toLowerCase(); if(v!==q){ q=v; render(); } }, 150);
});
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter') $('q').blur(); if(e.key==='Escape'){ $('q').value=''; $('q').dispatchEvent(new Event('input')); } });
$('qClr').addEventListener('click', ()=>{ $('q').value=''; $('q').dispatchEvent(new Event('input')); $('q').focus(); });
function clearAll(){ $('q').value=''; $('qClr').hidden=true; q=''; F.status=''; F.sup=[]; F.fam=[]; save(); render(); }
$('clearAll').addEventListener('click', clearAll);
$('emptyClear').addEventListener('click', clearAll);

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(id, btn){ lastFocus = btn||document.activeElement; $(id).hidden=false; document.documentElement.classList.add('sh-open'); if(btn) btn.setAttribute('aria-expanded','true'); const f=$(id).querySelector('.shb button, .shb input'); if(f && !window.matchMedia('(max-width:759px)').matches) f.focus(); }
function closeSheets(){ ['sortSheet','filtSheet'].forEach(id=>{ $(id).hidden=true; }); document.documentElement.classList.remove('sh-open'); $('sortBtn').setAttribute('aria-expanded','false'); $('filtBtn').setAttribute('aria-expanded','false'); if(lastFocus && lastFocus.focus) lastFocus.focus(); }
document.querySelectorAll('.sh').forEach(sh=>{
  sh.addEventListener('click', e=>{ if(e.target===sh || e.target.closest('[data-close]')) closeSheets(); });
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && (!$('sortSheet').hidden || !$('filtSheet').hidden)) closeSheets(); });

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>';
function sortOpts(){
  $('sortOpts').innerHTML = Object.entries(SORTS).map(([k,l])=>`<button type="button" class="opt" role="radio" data-sort="${k}" aria-checked="${F.sort===k}"><span>${l}</span>${CHECK}</button>`).join('');
}
$('sortOpts').addEventListener('click', e=>{ const b=e.target.closest('[data-sort]'); if(!b) return; F.sort=b.dataset.sort; save(); sortOpts(); render(); closeSheets(); });
$('sortBtn').addEventListener('click', ()=>{ sortOpts(); openSheet('sortSheet', $('sortBtn')); });

function listHtml(names, counts, sel, qv, key){
  const v = qv.trim().toLowerCase();
  const rows = names.filter(n=>!v || n.toLowerCase().indexOf(v)>=0);
  if(!rows.length) return `<div class="none">No matches</div>`;
  return rows.map(n=>`<label><input type="checkbox" data-k="${key}" value="${esc(n)}"${sel.indexOf(n)>=0?' checked':''}><span class="t">${esc(n)}</span><span class="c">${n0(counts[n])}</span></label>`).join('');
}
function filtLists(){
  // Brand families narrow to the chosen suppliers; a family already ticked stays listed
  const fams = F.sup.length ? FAMS.filter(f=>F.fam.indexOf(f)>=0 || [...famSup[f]].some(s=>F.sup.indexOf(s)>=0)) : FAMS;
  $('supList').innerHTML = listHtml(SUPS, supCount, F.sup, $('supQ').value, 'sup');
  $('famList').innerHTML = listHtml(fams, famCount, F.fam, $('famQ').value, 'fam');
  $('supSel').textContent = F.sup.length ? `${F.sup.length} Selected` : 'All';
  $('famSel').textContent = F.fam.length ? `${F.fam.length} Selected` : 'All';
}
['supQ','famQ'].forEach(id=>$(id).addEventListener('input', filtLists));
$('filtSheet').addEventListener('change', e=>{
  const cb=e.target; if(!cb.matches('input[type=checkbox]')) return;
  const a=F[cb.dataset.k]; const i=a.indexOf(cb.value);
  if(cb.checked && i<0) a.push(cb.value); else if(!cb.checked && i>=0) a.splice(i,1);
  save(); render();
});
$('filtClear').addEventListener('click', ()=>{ F.sup=[]; F.fam=[]; $('supQ').value=''; $('famQ').value=''; save(); render(); filtLists(); });
$('filtBtn').addEventListener('click', ()=>{ filtLists(); openSheet('filtSheet', $('filtBtn')); });

/* ---------- sticky offsets: the site bar, then the search row ---------- */
function measure(){
  const bar = document.getElementById('kdhBar');
  const bh = bar && getComputedStyle(bar).position==='sticky' ? bar.offsetHeight : 0;
  document.documentElement.style.setProperty('--bar-h', bh+'px');
  document.documentElement.style.setProperty('--tools-h', $('tools').offsetHeight+'px');
}
window.addEventListener('resize', measure);
window.addEventListener('load', ()=>{ measure(); setTimeout(measure, 400); });

/* ---------- BRAND SCOPE (2026-10-14): a manager who covers suppliers sees only them ----------
   kdhBrandScope() (shared/kdh-user.js) answers with the manager's suppliers + brand families
   (allowed_users.program_brands, the preview cookie, or brand-managers.json by name); null =
   every supplier. A district manager who also carries a brand (kdhTeam matches) keeps everything,
   the same hybrid rule as the hub and the MPO trackers. Reps and rep previews are never scoped. */
function scopePromise(){
  if(!U || U.role!=='manager' || !window.kdhBrandScope) return Promise.resolve(null);
  try{ if(window.kdhTeam && window.kdhTeam(window.KDH_DM_GROUPS || [])) return Promise.resolve(null); }catch(e){}
  return new Promise(resolve=>{
    let done=false; const settle = sc => { if(done) return; done=true; resolve(Array.isArray(sc) && sc.length ? sc : null); };
    try{ window.kdhBrandScope().then(settle, ()=>settle(null)); }catch(e){ settle(null); }
    setTimeout(()=>settle(null), 3000);
  });
}
function applyScope(sc){
  if(!sc){ P = ALL; $('scopeLine').hidden = true; return; }
  const match = window.kdhBrandMatch;
  P = ALL.filter(p=>match([p.supplier, p.family], sc));
  const sups = (sc.suppliers && sc.suppliers.length ? sc.suppliers : sc).slice();
  const shown = sups.slice(0,4).map(esc).join(', ') + (sups.length>4 ? ` and ${sups.length-4} more` : '');
  $('scopeLine').innerHTML = `<b>Your Suppliers:</b> ${shown}`; $('scopeLine').hidden = false;
}

/* ---------- notes ---------- */
$('notes').innerHTML = `
  <li><b>Available</b> is Encompass’s own sellable figure, shown exactly as the report carries it — never recomputed here.</li>
  <li><b>On Floor, Pre Sales and Allocated</b> are the report’s own columns, as Encompass reports them.</li>
  <li><b>Status</b>: Out = Available 0 or less · Low = 1 to ${LOW_MAX} units · In Stock = more than ${LOW_MAX}. Units, never dollars.</li>
  ${Stars.enabled ? `<li><b>Starred</b> products are your own shortlist: they sit at the top of the list and under the Starred chip, and follow you to your other devices when you are signed in. Starring never reserves stock or watches it live.</li>` : ''}
  <li><b>Snapshot</b>: the report file${DATA.source?` (${esc(DATA.source)})`:''} as saved on ${esc(dstr(DATA.asOf))}; a snapshot older than ${DATA.staleDays||7} days is flagged. Not live availability — check Encompass before promising a quantity.</li>
  <li>${n0(ALL.length)} products · ${n0(S.suppliers||0)} suppliers · ${n0(S.families||0)} brand families on the report. One warehouse in the data.</li>`;

// first paint: the skeleton is in the markup; the list fills once the scope is known
// (a manager's suppliers, 3 s cap) -- then the starred shortlist syncs in the background
scopePromise().then(sc=>{
  applyScope(sc); index();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    render();
    Stars.load().then(changed=>{ if(changed) render(); }).catch(()=>{});
  }));
});
})();
</script>
