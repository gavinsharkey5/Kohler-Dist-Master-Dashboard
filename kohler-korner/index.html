<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preload" href="../assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<!-- Theme before first paint: the saved choice, else the device setting (2026-09-30). -->
<script>try{var t=localStorage.getItem('kdh_theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../rep/rep.css?v=20261008d">

<meta name="kdh-page" content="Kohler Korner">

</head>
<body>
<main class="wrap home mh">
  <header class="hh">
    <div class="hh-id">
      <h1>Kohler Korner</h1>
      <p class="hh-meta">Create, manage, and publish Kohler's monthly company newsletter.</p>
    </div>
  </header>
  <section class="hs" aria-labelledby="newsletter-title">
    <div class="kt">
      <span class="kt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h4M7 16h10M14 12h3"/></svg></span>
      <div class="kt-main">
        <h2 class="kt-t" id="newsletter-title" style="margin:0">Newsletter Builder — Coming Soon.</h2>
        <p class="kt-s" style="margin:0">This section will allow authorized managers to collaborate on monthly editions of Kohler Korner.</p>
      </div>
    </div>
  </section>
</main>

</html>
