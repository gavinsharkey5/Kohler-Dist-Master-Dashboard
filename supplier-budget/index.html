<!--
  SUPPLIER BUDGETS (2026-10-14): the "Supplier Budgets Tracker" workbook as a
  page. Budget rows (one per GL account: supplier, brand manager, budget
  amount) and the expense ledger (one row per invoice line) live in Supabase
  -- public.budget_accounts / supplier_expenses / supplier_expense_events /
  budget_vendors, migration supabase/migrations/20261014210000_supplier_budget.sql
  -- and come through PostgREST with the signed-in token. Row-level security
  decides who sees what: budget editors and the program admin see everything;
  a brand manager sees only the accounts filed under their name or their
  suppliers; a rep sees nothing (the middleware never lets a rep here, and the
  page refuses a rep cookie or any preview). NOTHING from the workbook is in
  this public repo: no dollars, no vendors, no embedded data. README.txt has
  every rule.
-->
