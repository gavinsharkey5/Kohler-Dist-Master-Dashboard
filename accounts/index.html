<!--
  ACCOUNTS (2026-09-30): the Accounts tab and the one Account page.

  "What should I do at this account today?" A rep sees their own assigned
  accounts (the middleware serves them only their slice of the customer
  base -- see middleware.js and generate.py); a manager sees their team's,
  with the rep named on every row. One account page answers the question
  with up to three supported actions first (open follow-up, overdue tap
  survey, a program this account can still qualify for, a regular product
  that may be due), then the supporting sections: Sales & Reorders,
  Programs, Products to discuss, Notes & Follow-ups, Taps & Visits.

  Nothing here is computed from scratch: program eligibility, targets and
  credit come from the hub's own adapters (hub.js loaded in LIBRARY MODE --
  no #app on this page, so it renders nothing and exposes window.KohlerHub);
  sales history is the Rolling Distribution master, taps are the Tap
  Tracker's own survey, notes are the hub's rep_actions rows. See README.txt.
-->
<main class="wrap home" id="acctApp"><div class="kdh-state loading">Loading your accounts…</div></main>

<footer>Internal use. These pages show customer and account detail — please don’t share the link outside the team.</footer>
