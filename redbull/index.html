<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Bull — Distribution Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#0C0D11; --card:#15171E; --card2:#1B1E27; --ink:#F6F7F9; --ink-soft:#ABB2C2;
    --line:#262A35; --line-soft:#1F222B;
    --accent:#E30613; --accent2:#9C0410;
    --blue:#1B2A6B; --gold:#FFC906;
    --good:#37C46B; --good-soft:#15301E;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);min-height:100vh;
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16.5px;line-height:1.52;
    padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}

  .gx-head{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .gx-head::before{content:"";position:absolute;inset:-40% -10% auto;height:240px;
    background:radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%);pointer-events:none}
  .gx-head .wrap{position:relative;padding:30px 18px 24px}
  .eyebrow{font-family:"Space Grotesk";letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:600;
    color:var(--accent);margin:0 0 9px;display:flex;align-items:center;gap:8px}
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:p 2.4s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
  h1{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.015em;font-size:clamp(30px,8vw,46px);line-height:.96;margin:0}
  .lede{margin:13px 0 0;max-width:60ch;color:var(--ink-soft);font-size:14px}
  .lede b{color:var(--accent)}
  .updated{margin:10px 0 0;font-size:11px;color:#6B7280;font-family:"Space Grotesk";letter-spacing:.04em}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:11px;margin:18px 0 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow)}
  .stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0}
  .stat .v{font-family:"Space Grotesk";font-weight:700;font-size:23px;margin:6px 0 0;line-height:1}
  .stat .v small{font-size:13px;color:var(--ink-soft);font-weight:500}
  .stat .v.accent{color:var(--accent)}

  .seg{margin:22px 0 0}
  .seg .lbl{font-family:"Space Grotesk";font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:"Space Grotesk";font-weight:500;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .shead{display:flex;align-items:center;gap:9px;margin:24px 0 10px}
  .shead h2{font-family:"Space Grotesk";font-size:15px;margin:0}
  .shead .meta{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
  .shead .tr{color:var(--gold)}

  .board{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
  .lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:.12s}
  .lrow:last-child{border-bottom:none}
  .lrow:hover{background:var(--card2)}
  .lrow .medal{font-family:"Space Grotesk";font-weight:700;font-size:13px;color:var(--ink-soft);width:22px;text-align:center}
  .lrow.top .medal.m1{color:var(--gold)}.lrow.top .medal.m2{color:#C3CAD6}.lrow.top .medal.m3{color:#C07B43}
  .lrow .who{flex:1;min-width:0}
  .lrow .who b{font-size:14.5px}
  .lrow .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .lrow .track{height:5px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
  .lrow .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
  .lrow .win{font-family:"Space Grotesk";font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
  .lrow .win small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:500}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
  .hero .top{display:flex;align-items:center;gap:14px}
  .hero .rankbox{text-align:center}
  .hero .rankbox .big{font-size:26px;font-weight:700}
  .hero .rankbox .lab{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
  .hero .nm{font-family:"Space Grotesk";font-weight:700;font-size:19px;flex:1}
  .hero .nm small{display:block;font-family:"Inter";font-weight:500;font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .hero .win2{text-align:right}
  .hero .win2 .b{font-size:24px;font-weight:700;color:var(--accent)}
  .hero .win2 .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase}

  .quest{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:0 0 11px;box-shadow:var(--shadow)}
  .quest.head{border-left:3px solid var(--good)}
  .note{font-size:12.5px;color:var(--ink-soft);line-height:1.75;margin:12px 2px 0}
  .note b{color:var(--ink)}
  .quest .sup{font-family:"Space Grotesk";font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center}
  .badge{font-family:"Space Grotesk";font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .badge.ok{background:var(--good-soft);color:#5fdc8c;border:1px solid #245834}
  .qline{font-size:12.5px;color:var(--ink-soft);margin:13px 0 7px;display:flex;justify-content:space-between}
  .qline .num{color:var(--ink);font-weight:600}
  .bar{height:11px;border-radius:7px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  .bar.done i{background:linear-gradient(90deg,#3FD074,var(--good))}
  .brk{margin:11px 0 2px;border-top:1px solid var(--line-soft);padding-top:10px}
  .brk .cap{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;font-family:"Space Grotesk"}
  .brow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-soft);padding:5px 0;border-bottom:1px solid var(--line-soft)}
  .brow:last-child{border-bottom:none}
  .brow b{color:var(--ink);font-weight:600}
  .brow .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:600;margin-left:6px;white-space:nowrap}
  .brow .tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .brow .tags .tag{margin-left:0}
  .brow .tag.core{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .brow .tag.plus{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
  .brow .tag.free{background:color-mix(in srgb,var(--good) 18%,transparent);color:#5fdc8c}
  .brow .tag.roll{background:color-mix(in srgb,var(--ink) 13%,transparent);color:var(--ink)}
  /* a category this account has NOT bought yet -- shown as "+ Free" so the gap is visible */
  .brow .tag.off,.note .tag.off{background:transparent;color:var(--ink-soft);border:1px dashed var(--line);opacity:.8}
  .brow .chk{color:var(--good);margin-right:5px}
  /* the "what counts as complete" band */
  .rule{display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
        border-left:3px solid var(--good);border-radius:14px;padding:12px 15px;margin:18px 0 0;box-shadow:var(--shadow)}
  .rule .rk{font-family:"Space Grotesk";font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
  .rule .rt{font-size:13px;color:var(--ink-soft);line-height:1.7}
  .rule .rt b{color:var(--ink)}
  .rule .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:600;margin:0 2px}
  .rule .tag.core{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .rule .tag.free{background:color-mix(in srgb,var(--good) 18%,transparent);color:#5fdc8c}
  .rule .tag.plus{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
  .rule .tag.roll{background:color-mix(in srgb,var(--ink) 13%,transparent);color:var(--ink)}
  .stat.hi{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
  .stat.hi .v{color:#5fdc8c}

  .empty{max-width:540px;margin:70px auto;text-align:center;color:var(--ink-soft)}
  .empty h2{font-family:"Space Grotesk";color:var(--ink)}
  .empty code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  footer{margin:26px 0 46px;color:var(--ink-soft);font-size:12px}
  footer hr{border:none;border-top:1px solid var(--line);margin:0 0 13px}
  footer b{color:var(--ink)}
  @media (max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    /* stack name over tags so a three-tag row never breaks mid-tag */
    .brow{flex-direction:column;align-items:flex-start;gap:5px}
    .brow .tags{justify-content:flex-start}
  }
</style></head><body>
<div class="gx-head"><div class="wrap">
  <p class="eyebrow"><span class="pulse"></span> Kohler Distributing · Red Bull · 2026</p>
  <h1>Distribution Tracker</h1>
  <p class="lede" id="lede"></p>
  <p class="updated" id="updated"></p>
</div></div>
<div id="app"><div class="wrap">
  <div class="seg"><p class="lbl">Pick a rep</p><div class="chips" id="chips"></div></div>
  <div id="body"></div>
  <footer><hr><p id="foot"></p></footer>
</div></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=x=>{const v=parseFloat(String(x).replace(/[^0-9.\-]/g,""));return isNaN(v)?0:v;};
function parseCSV(t){const firstLine=t.split(/\r?\n/,1)[0]||"";const delim=(firstLine.split("\t").length>firstLine.split(",").length)?"\t":",";const R=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch==='"')q=true;else if(ch===delim){row.push(c);c="";}else if(ch==='\n'){row.push(c);R.push(row);row=[];c="";}else if(ch==='\r'){}else c+=ch;}}if(c.length||row.length){row.push(c);R.push(row);}return R.filter(r=>r.some(x=>x.trim()!==""));}
function col(H,...n){const h=H.map(x=>x.toLowerCase().trim());for(const k of n){const i=h.findIndex(x=>x.includes(k));if(i>=0)return i;}return -1;}
function statTile(k,v,s){return `<div class="stat"><p class="k">${k}</p><p class="v num">${v}${s||""}</p></div>`;}
const TROPHY='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v3a6 6 0 0 1-12 0V4z"/><path d="M6 5H4a2 2 0 0 0 2 2M18 5h2a2 2 0 0 1-2 2M9 20h6M12 13v7"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>';
const medalColor=r=>r===1?"var(--gold)":r===2?"#C3CAD6":"#C07B43";

// The three tags a buying account can earn -- these are what data.csv holds.
// Edit here and in generate.py's REGULAR_PRODUCTS / FREE_PRODUCTS /
// COREPLUS_PRODUCTS together.
const CATS=[
  {key:'Regular', label:'Regular', cls:'core', blurb:'Red Bull 1/24/8.4 oz Can'},
  {key:'Free', label:'Free', cls:'free', blurb:'Red Bull Sugar Free'},
  {key:'Core+', label:'Core+', cls:'plus', blurb:'all other flavor editions'}
];
const CAT_KEYS=CATS.map(c=>c.key);
// Rollups are DERIVED, never in data.csv: an account counts toward one if it
// bought any of its categories. Core exists because Kohler's 155 Core goal
// was always set on Regular and Sugar Free together.
const ROLLUPS=[
  {key:'Core', label:'Core', cls:'roll', blurb:'Regular or Sugar Free', of:['Regular','Free']}
];
const ALL_KEYS=[...CAT_KEYS,...ROLLUPS.map(r=>r.key)];
// data.csv called Regular "Core" before 2026-09-11; keep a stale copy readable.
const LEGACY={'Core':'Regular'};
const blankAcct=()=>{const o={};CAT_KEYS.forEach(k=>o[k]=false);return o;};
// THE RULE: an account only counts as complete when it buys all three categories.
const isComplete=a=>CAT_KEYS.every(k=>a[k]);
const missingFor=a=>CATS.filter(c=>!a[c.key]);
let REPS={}, GOAL={Core:155,'Core+':84,Overall:239}, activeRep="ALL";

function ingestData(text){
  const rows=parseCSV(text); if(rows.length<2) return;
  const H=rows[0];
  const ci=col(H,"customer"), cati=col(H,"category"), ri=col(H,"sales rep","rep");
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const rep=(r[ri]||"").trim(), cust=(r[ci]||"").trim();
    let cat=(r[cati]||"").trim(); cat=LEGACY[cat]||cat;
    if(!rep||!cat||!cust) continue;
    REPS[rep]=REPS[rep]||{accounts:{}};
    if(!CAT_KEYS.includes(cat)) continue;
    REPS[rep].accounts[cust]=REPS[rep].accounts[cust]||blankAcct();
    REPS[rep].accounts[cust][cat]=true;
  }
}
function ingestGoals(text){
  const rows=parseCSV(text); if(rows.length<2) return;
  const H=rows[0]; const cati=col(H,"category"), gi=col(H,"goal");
  for(let i=1;i<rows.length;i++){const r=rows[i]; const cat=(r[cati]||"").trim(); if(!cat) continue; if(gi>=0) GOAL[cat]=num(r[gi]);}
}
function repStats(rep){
  const accts=REPS[rep]?REPS[rep].accounts:{};
  const by={}; ALL_KEYS.forEach(k=>by[k]=0); let total=0, complete=0;
  Object.values(accts).forEach(a=>{
    CAT_KEYS.forEach(k=>{ if(a[k])by[k]++; });
    ROLLUPS.forEach(r=>{ if(r.of.some(k=>a[k]))by[r.key]++; });
    total++; if(isComplete(a))complete++;
  });
  return {by,total,complete};
}
function teamStats(){
  const by={}; ALL_KEYS.forEach(k=>by[k]=0); let total=0, complete=0;
  Object.keys(REPS).forEach(rep=>{ const s=repStats(rep); ALL_KEYS.forEach(k=>by[k]+=s.by[k]); total+=s.total; complete+=s.complete; });
  return {by,total,complete};
}
// "12 Core · 9 Free · 4 Core+"
const catLine=s=>CATS.map(c=>`${s.by[c.key]} ${c.label}`).join(" · ");
// Goal cards, rollups first. has() says whether one account counts for the card.
const CARDS=[...ROLLUPS.map(r=>({...r,has:a=>r.of.some(k=>a[k])})),
             ...CATS.map(c=>({...c,has:a=>a[c.key]}))];
// Reps are ranked on complete accounts; total accounts only breaks ties.
const byComplete=(a,b)=>b.complete-a.complete||b.total-a.total;
const tagStrip=CATS.map(c=>`<span class="tag ${c.cls}">${c.label}</span>`).join("");
const COMPLETE_RULE=`<div class="rule"><span class="rk">What counts as complete</span>
  <span class="rt">An account is <b>complete</b> only when it buys <b>all three</b> — ${tagStrip} — together.
  Buying two of the three is <b>not complete</b>; sell the missing one to finish the account.
  ${ROLLUPS.map(r=>`<span class="tag ${r.cls}">${r.label}</span> is a rollup, not a fourth sale — an account counts for it as soon as it buys ${r.blurb.replace(" or "," <b>or</b> ")}.`).join(" ")}</span></div>`;

function render(){
  const app=document.getElementById("body"); const reps=Object.keys(REPS);
  if(activeRep==="ALL"){
    const t=teamStats();
    const pct=GOAL.Overall? (t.total/GOAL.Overall*100):0;
    const catTiles=CATS.map(c=>{const g=GOAL[c.key]||0;return statTile(c.label,t.by[c.key]+(g?"<small>/"+g+"</small>":""),"");}).join("");
    const donePct=t.total? (t.complete/t.total*100):0;
    const rollTiles=ROLLUPS.map(r=>{const g=GOAL[r.key]||0;return statTile(r.label,t.by[r.key]+(g?"<small>/"+g+"</small>":""),"");}).join("");
    const stats=`<div class="stats">${statTile("Buying Accounts",t.total,"")}`
      +`<div class="stat hi"><p class="k">Complete (all 3)</p><p class="v num">${t.complete}<small>/${t.total}</small></p></div>`
      +`${rollTiles}${catTiles}${statTile("% of Goal",pct.toFixed(0)+"%","")}</div>`;
    const ranked=reps.map(r=>({rep:r,...repStats(r)})).sort(byComplete).map((r,i)=>({...r,rank:i+1}));
    const rows=ranked.map(R=>{
      const share=R.total? (R.complete/R.total*100):0;   // this rep's own accounts that are complete
      return `<div class="lrow${R.rank<=3?' top':''}" style="--mc:${medalColor(R.rank)}" role="button" tabindex="0" data-rep="${esc(R.rep)}">
        <span class="medal ${R.rank<=3?'m'+R.rank:''}">${R.rank}</span>
        <span class="who"><b>${esc(R.rep)}</b><div class="sub">${R.complete} of ${R.total} accounts complete · ${catLine(R)}</div>
        <div class="track"><i style="width:${Math.min(share,100).toFixed(1)}%"></i></div></span>
        <span class="win">${R.complete}<small>complete</small></span></div>`;
    }).join("");
    app.innerHTML=stats+COMPLETE_RULE+`<div class="shead"><span class="tr">${TROPHY}</span><h2>Rep leaderboard</h2><span class="meta">${ranked.length} reps · by complete accounts</span></div><div class="board">${rows}</div>`
      +`<p class="note">Bar shows the share of each rep's own accounts that are complete. Team-wide, <b>${t.complete} of ${t.total}</b> buying accounts (${donePct.toFixed(0)}%) buy all three.</p>`;
    app.querySelectorAll(".lrow[data-rep]").forEach(el=>{const go=()=>setRep(el.dataset.rep);el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});
  } else {
    const s=repStats(activeRep);
    const t=teamStats();
    const rank=reps.map(r=>({rep:r,...repStats(r)})).sort(byComplete).map(x=>x.rep).indexOf(activeRep)+1;
    const hero=`<div class="hero"><div class="top"><div class="rankbox"><div class="big num">${rank||"–"}</div><div class="lab">Rank</div></div>
      <div class="nm">${esc(activeRep)}<small>${s.complete} of ${s.total} accounts complete · ${catLine(s)}</small></div>
      <div class="win2"><div class="b num">${s.complete}</div><div class="l">complete</div></div></div></div>`;

    function catCard(c){
      const goal=GOAL[c.key]||0;              // 0 = no goal set for this category yet
      const teamActual=t.by[c.key], mine=s.by[c.key];
      const pct=goal?Math.min(teamActual/goal*100,100):0;
      const hit=goal&&teamActual>=goal;
      const accts=Object.entries(REPS[activeRep]?REPS[activeRep].accounts:{}).filter(([n,f])=>c.has(f)).map(([n])=>n).sort();
      const list=accts.length?accts.map(n=>`<div class="brow">${esc(n)}<span class="tag ${c.cls}">${mine} of my ${accts.length}</span></div>`).join(""):'<div class="brow">No accounts yet.</div>';
      return `<details class="quest"><summary style="cursor:pointer;list-style:none"><div class="sup"><span>${c.label} (${c.blurb})${hit?` <span style="color:var(--good)">${CHECK}</span>`:''}</span><span class="num">Team: ${teamActual}${goal?" / "+goal:""}</span></div>
        <div class="qline"><span>My accounts in this category</span><span class="num">${mine}</span></div>
        ${goal?`<div class="bar ${hit?'done':''}"><i style="width:${pct.toFixed(1)}%"></i></div>`:''}</summary>
        <div class="brk"><div class="cap">${accts.length} of my accounts bought this category</div>${list}</div></details>`;
    }
    const cards=CARDS.map(catCard).join("");

    // Headline card: complete accounts, the number that actually counts.
    const donePct=s.total? (s.complete/s.total*100):0;
    const allDone=s.total&&s.complete===s.total;
    const doneCard=`<div class="quest head"><div class="sup"><span>Complete accounts${allDone?` <span style="color:var(--good)">${CHECK}</span>`:''}</span><span class="num">${s.complete} / ${s.total}</span></div>
      <div class="qline"><span>My accounts buying all three (${CAT_KEYS.join(" + ")})</span><span class="num">${donePct.toFixed(0)}%</span></div>
      <div class="bar ${allDone?'done':''}"><i style="width:${donePct.toFixed(1)}%"></i></div></div>`;

    // Account list, split by the rule: finished vs still missing something.
    // Every row shows all three tags -- the ones an account hasn't bought read
    // as "+ Free", so the rep sees exactly what's left to sell.
    const allAccts=Object.entries(REPS[activeRep]?REPS[activeRep].accounts:{});
    const rowFor=([n,f])=>{
      const done=isComplete(f);
      const tags=CATS.map(c=>`<span class="tag ${f[c.key]?c.cls:'off'}">${f[c.key]?'':'+ '}${c.label}</span>`).join("");
      return `<div class="brow${done?' done':''}"><b>${done?`<span class="chk">${CHECK}</span>`:''}${esc(n)}</b><span class="tags">${tags}</span></div>`;
    };
    const done=allAccts.filter(([n,f])=>isComplete(f)).sort((a,b)=>a[0].localeCompare(b[0]));
    // Closest to complete first -- one missing category is the easiest next sale.
    const todo=allAccts.filter(([n,f])=>!isComplete(f))
      .sort((a,b)=>missingFor(a[1]).length-missingFor(b[1]).length||a[0].localeCompare(b[0]));
    const group=(rows,empty)=>`<div class="board" style="padding:6px 14px">${rows.length?rows.map(rowFor).join(""):`<div class="brow">${empty}</div>`}</div>`;

    app.innerHTML=hero+COMPLETE_RULE+doneCard+
      `<div class="shead"><h2>Still to finish</h2><span class="meta">${todo.length} account${todo.length===1?'':'s'} · closest first</span></div>`+
      group(todo,"Every account is complete — nice.")+
      `<p class="note">A <span class="tag off" style="font-size:10.5px;padding:2px 7px;border-radius:999px">+ ${CATS[CATS.length-1].label}</span>-style tag is a category that account has <b>not</b> bought yet. Sell it and the account turns complete.</p>`+
      `<div class="shead"><h2>Complete accounts</h2><span class="meta">${done.length} buying all three</span></div>`+
      group(done,"No complete accounts yet — an account needs Core, Free and Core+ together.")+
      `<div class="shead"><h2>Progress vs team goal</h2><span class="meta">tap a category for accounts</span></div>`+cards;
  }
}
function setRep(v){activeRep=v;document.querySelectorAll("#chips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===activeRep));render();window.scrollTo({top:0,behavior:"smooth"});}
function renderChips(){const reps=Object.keys(REPS).sort();
  document.getElementById("chips").innerHTML=["ALL",...reps].map(v=>`<button class="chip" aria-pressed="${v===activeRep}" data-v="${esc(v)}">${v==="ALL"?"All reps":esc(v)}</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(b=>b.addEventListener("click",()=>setRep(b.dataset.v)));}
function showEmpty(m){document.getElementById("app").innerHTML=`<div class="empty"><h2>No data yet</h2><p>${m}</p></div>`;}
async function boot(){
  let dText=null,gText=null,lastMod=null;
  try{const r=await fetch("data.csv",{cache:"no-store"});if(r.ok){lastMod=r.headers.get("last-modified");dText=await r.text();}}catch(e){}
  try{const r=await fetch("goals.csv",{cache:"no-store"});if(r.ok)gText=await r.text();}catch(e){}
  if(!dText){showEmpty("Upload <code>data.csv</code> (Customer Name, Category, Sales Rep, Bought) and <code>goals.csv</code> next to this page.");return;}
  ingestData(dText); if(gText)ingestGoals(gText);
  if(!Object.keys(REPS).length){showEmpty("Couldn't read the data file — check it has Customer Name, Category and Sales Rep columns.");return;}
  renderChips();render();
  // Lede and footer are built from goals.csv so adding a goal there (e.g. Free)
  // shows up without editing this file.
  const goalParts=[...ROLLUPS,...CATS].filter(c=>GOAL[c.key]>0).map(c=>`<b>${GOAL[c.key]} ${c.label}</b>`);
  const goalPhrase=GOAL.Overall?`Team goal of <b>${GOAL.Overall} buying accounts</b>${goalParts.length?" — "+goalParts.join(", "):""}.`:"";
  const key=[...ROLLUPS,...CATS].map(c=>`<b>${c.label}</b> = ${c.blurb}`).join(", ")+".";
  const rule=`An account is <b>complete</b> only when it buys <b>all three</b> — ${CATS.map(c=>`<b>${c.label}</b>`).join(", ")} — two out of three doesn't count.`;
  const rollKey=ROLLUPS.map(c=>`<b>${c.label}</b> = ${c.blurb}`).join(", ")+".";
  document.getElementById("lede").innerHTML=`${goalPhrase} ${rollKey} ${rule} Tap your name to see your accounts.`;
  document.getElementById("updated").textContent=lastMod?"Updated "+new Date(lastMod).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):"";
  document.getElementById("foot").innerHTML=`${goalPhrase} ${key} ${rule} Each rep's category tally is unique buying accounts that ordered at least one Red Bull SKU in that category; <b>complete</b> counts only accounts buying all three. Reps are ranked by complete accounts. Refresh by re-exporting the RDE Red Bull Tracker report and running <b>generate.py</b> — see README.txt.`;
}
boot();
</script></body></html>
