<body>
<!--
  FIELD TASKS (2026-10-14): a rep hands account work to a sales associate --
  build a display, drop a tap handle, deliver POS -- and the associate works a
  queue, updates the status, attaches the completion photo and talks to the
  rep in one thread. A manager reads everything.
  Data: public.field_tasks / field_task_comments / field_task_reads and the
  private task-photos bucket, through PostgREST with the signed-in token
  (migration supabase/migrations/20261014180000_field_tasks.sql). Row-level
  security decides who sees what; the page never filters by name. A manager
  previewing a rep sees that rep's tasks read-only. Nothing here is a sales
  record. README.txt has every rule.
-->
<main class="wrap tk" id="app" aria-live="polite">
  <div class="kdh-state loading">Loading your tasks…</div>
</main>
<input type="file" id="tkPhotoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="tkLibIn" accept="image/*" hidden>
<script src="../hub/data/accounts.js" defer onerror="window.__noBook=1"></script>
<script src="tasks.js?v=20261014b" defer></script>
</body>
