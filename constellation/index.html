<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constellation Placements — Rep Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F4F5F8; --card:#FFFFFF; --ink:#15171C; --ink-soft:#646A78;
    --accent:#2F6FB0; --accent-deep:#1E4E84; --line:#E7E9EF; --line-soft:#F0F1F5;
    --shadow:0 1px 2px rgba(21,23,28,.05), 0 10px 30px rgba(21,23,28,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:820px;margin:0 auto}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}

  header{background:var(--ink);color:#fff;padding:28px 20px 58px;position:relative;overflow:hidden}
  header .wrap{position:relative;z-index:1}
  .eyebrow{font-family:"Space Grotesk";letter-spacing:.2em;text-transform:uppercase;font-size:11.5px;
    font-weight:600;color:#F4B400;margin:0 0 8px}
  h1{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.01em;font-size:clamp(28px,7vw,44px);line-height:.98;margin:0}
  .lede{margin:12px 0 0;max-width:54ch;color:#B9BEC9;font-size:14.5px}
  .updated{margin:11px 0 0;font-size:11.5px;color:#7C8290;font-family:"Space Grotesk";letter-spacing:.04em}
  .ribbon{position:absolute;left:0;right:0;bottom:0;height:8px;display:flex}
  .ribbon i{flex:1;height:100%}

  .kpis{max-width:820px;margin:-38px auto 0;padding:0 20px;position:relative;z-index:2;
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:0;font-weight:600}
  .kpi .v{font-family:"Space Grotesk";font-weight:700;font-size:25px;margin:6px 0 0;line-height:1}
  .kpi .v small{font-size:13px;color:var(--ink-soft);font-weight:500}

  section.block{max-width:820px;margin:24px auto 0;padding:0 20px}
  .h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 11px}
  .h h2{font-family:"Space Grotesk";font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0}
  .h .meta{font-size:12px;color:var(--ink-soft)}

  .spectrum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .specbar{height:26px;border-radius:8px;overflow:hidden;display:flex;border:1px solid var(--line)}
  .specbar span{height:100%;min-width:2px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:13px 0 0}
  .legend .item{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .legend .ce{color:var(--ink-soft);font-family:"Space Grotesk"}

  .filterlabel{font-family:"Space Grotesk";font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{font-family:"Space Grotesk";font-weight:500;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);transition:all .12s ease}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .board{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;padding:12px 16px;
    border-top:1px solid var(--line-soft);cursor:pointer;transition:background .12s}
  .row:first-child{border-top:none}
  .row:hover{background:#FAFBFD}
  .row .rank{font-family:"Space Grotesk";font-weight:700;color:var(--ink-soft);font-size:14px}
  .row .who b{font-weight:600;font-size:15px}
  .row .who .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .row .who .track{height:6px;background:var(--line);border-radius:4px;margin-top:7px;overflow:hidden}
  .row .who .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:4px}
  .row .big{font-family:"Space Grotesk";font-weight:700;font-size:18px;text-align:right;white-space:nowrap}
  .row .big small{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px}

  .acct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:0 0 10px;box-shadow:var(--shadow)}
  .acct .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .acct .nm{font-weight:600;font-size:14.5px}
  .acct .stat{font-family:"Space Grotesk";font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
  .acct .stat small{font-weight:500;color:var(--ink-soft);font-size:11px}
  .progtags{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
  .ptag{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;color:#fff}

  .empty{max-width:560px;margin:60px auto;padding:0 24px;text-align:center;color:var(--ink-soft)}
  .empty h2{font-family:"Space Grotesk";color:var(--ink);font-size:20px}
  .empty code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:13px}

  footer{max-width:820px;margin:28px auto 0;padding:0 20px 44px;color:var(--ink-soft);font-size:12px}
  footer hr{border:none;border-top:1px solid var(--line);margin:0 0 13px}
  @media (max-width:540px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="eyebrow">Kohler Distributing · Constellation</p>
    <h1>Placement<br>Scorecard</h1>
    <p class="lede">Off-premise SKU placements across the summer programs — Corona Gaintain, Modelo Gaintain, Impact, and Innovation. Filter by rep or by program.</p>
    <p class="updated" id="updated"></p>
  </div>
  <div class="ribbon" id="ribbon"></div>
</header>

<div id="app">
  <section class="kpis" id="kpis"></section>
  <section class="block">
    <div class="h"><h2 id="specTitle">Program mix</h2><span class="meta" id="specMeta"></span></div>
    <div class="spectrum"><div class="specbar" id="specbar"></div><div class="legend" id="legend"></div></div>
  </section>
  <section class="block">
    <p class="filterlabel">Program</p>
    <div class="chips" id="progChips"></div>
    <p class="filterlabel">Rep</p>
    <div class="chips" id="repChips"></div>
  </section>
  <section class="block" id="mainBlock">
    <div class="h"><h2 id="mainTitle">Rep leaderboard</h2><span class="meta" id="mainMeta"></span></div>
    <div id="mainBody"></div>
  </section>
  <footer><hr><p id="foot"></p></footer>
</div>

<script>
const FILES=["corona.csv","modelo.csv","impact.csv","innovation.csv"];
const PROG_COLORS={"Corona Gaintain":"#F4B400","Modelo Gaintain":"#C8102E","Impact":"#8E2DE2","Innovation":"#2BB7B3"};
const FALLBACK=["#F4B400","#C8102E","#8E2DE2","#2BB7B3","#2F6FB0","#E0457B"];
let RECORDS=[], PROGRAMS=[], activeRep="ALL", activeProg="ALL";

function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur="";}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}else if(c==='\r'){}else cur+=c;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function col(head,...needles){const h=head.map(x=>x.toLowerCase().trim());
  for(const n of needles){const i=h.findIndex(x=>x.includes(n));if(i>=0)return i;}return -1;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const round=n=>Math.round(n);

function ingest(text){
  const rows=parseCSV(text); if(rows.length<2) return;
  const H=rows[0];
  const ci={rep:col(H,"sales rep","rep"),cust:col(H,"customer id","cust"),name:col(H,"customer name"),prod:col(H,"product name","product")};
  let vi=col(H,"placement");
  let prog=vi>=0 ? H[vi].replace(/skus?/i,"").replace(/placements?/i,"").trim() : "Program";
  if(ci.rep<0) return;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const rep=(r[ci.rep]||"").trim(); if(!rep) continue;
    RECORDS.push({rep, prog, cust:(r[ci.cust]||"").trim(), name:(r[ci.name]||"").trim(), prod:(r[ci.prod]||"").trim()});
  }
}
function colorFor(p){return PROG_COLORS[p]||FALLBACK[PROGRAMS.indexOf(p)%FALLBACK.length];}
function scope(){return RECORDS.filter(r=>(activeRep==="ALL"||r.rep===activeRep)&&(activeProg==="ALL"||r.prog===activeProg));}
function distinct(arr,key){return new Set(arr.map(x=>x[key])).size;}

function renderKPIs(){
  const s=scope();
  const placements=s.length, accounts=distinct(s,"cust"), skus=distinct(s,"prod");
  const byAcct={}; s.forEach(r=>{(byAcct[r.cust]=byAcct[r.cust]||new Set()).add(r.prod);});
  const depth=Object.keys(byAcct).length?Object.values(byAcct).reduce((a,b)=>a+b.size,0)/Object.keys(byAcct).length:0;
  const fourth = activeRep==="ALL" ? ["Reps", distinct(s,"rep"), ""] : ["SKUs / acct", depth.toFixed(1), ""];
  const tiles=[["Placements",placements,""],["Accounts",accounts,""],["SKUs placed",skus,""],fourth];
  document.getElementById("kpis").innerHTML=tiles.map(([k,v,sm])=>`<div class="kpi"><p class="k">${k}</p><p class="v num">${v}<small>${sm}</small></p></div>`).join("");
}
function renderSpectrum(){
  const s=scope(); const t={}; s.forEach(r=>t[r.prog]=(t[r.prog]||0)+1);
  const ordered=PROGRAMS.filter(p=>t[p]>0); const total=s.length||1;
  document.getElementById("specbar").innerHTML=ordered.map(p=>`<span style="flex-grow:${t[p]};background:${colorFor(p)}" title="${esc(p)}: ${t[p]}"></span>`).join("");
  document.getElementById("legend").innerHTML=ordered.map(p=>`<span class="item"><span class="dot" style="background:${colorFor(p)}"></span>${esc(p)} <span class="ce">${t[p]}</span></span>`).join("");
  document.getElementById("specTitle").textContent = activeProg==="ALL"?"Program mix":activeProg;
  document.getElementById("specMeta").textContent = `${round(total)} placements`+(activeRep==="ALL"?"":" · "+activeRep);
}
function renderRibbon(){
  const t={}; RECORDS.forEach(r=>t[r.prog]=(t[r.prog]||0)+1);
  document.getElementById("ribbon").innerHTML=PROGRAMS.map(p=>`<i style="flex-grow:${t[p]};background:${colorFor(p)}"></i>`).join("");
}
function renderMain(){
  if(activeRep==="ALL"){
    document.getElementById("mainTitle").textContent="Rep leaderboard";
    const s=scope(); const by={};
    s.forEach(r=>{const R=by[r.rep]||(by[r.rep]={pl:0,acc:new Set()});R.pl++;R.acc.add(r.cust);});
    const reps=Object.entries(by).map(([name,v])=>({name,pl:v.pl,acc:v.acc.size})).sort((a,b)=>b.pl-a.pl);
    const max=reps[0]?reps[0].pl:1;
    document.getElementById("mainMeta").textContent=`${reps.length} reps · ${activeProg==="ALL"?"all programs":activeProg}`;
    document.getElementById("mainBody").innerHTML=`<div class="board">`+reps.map((R,i)=>
      `<div class="row" role="button" tabindex="0" data-rep="${esc(R.name)}">
        <span class="rank num">${i+1}</span>
        <span class="who"><b>${esc(R.name)}</b><div class="sub">${R.acc} accounts</div>
          <div class="track"><i style="width:${(R.pl/max*100).toFixed(1)}%"></i></div></span>
        <span class="big num">${R.pl}<small>placements</small></span></div>`).join("")+`</div>`;
    document.querySelectorAll(".row[data-rep]").forEach(el=>{
      const go=()=>setRep(el.dataset.rep);
      el.addEventListener("click",go);
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
    });
  } else {
    document.getElementById("mainTitle").textContent="Accounts";
    const s=scope(); const by={};
    s.forEach(r=>{const A=by[r.cust]||(by[r.cust]={name:r.name,skus:new Set(),progs:new Set(),pl:0});A.skus.add(r.prod);A.progs.add(r.prog);A.pl++;});
    const accts=Object.values(by).sort((a,b)=>b.pl-a.pl);
    document.getElementById("mainMeta").textContent=`${accts.length} accounts · ${activeProg==="ALL"?"all programs":activeProg}`;
    document.getElementById("mainBody").innerHTML=accts.map(a=>{
      const tags=[...a.progs].map(p=>`<span class="ptag" style="background:${colorFor(p)}">${esc(p)}</span>`).join("");
      return `<div class="acct"><div class="top">
        <div class="nm">${esc(a.name||"—")}</div>
        <span class="stat num">${a.pl}<small> placements · ${a.skus.size} SKUs</small></span></div>
        <div class="progtags">${tags}</div></div>`;
    }).join("");
  }
}
function renderChips(){
  document.getElementById("progChips").innerHTML=["ALL",...PROGRAMS].map(v=>
    `<button class="chip" aria-pressed="${v===activeProg}" data-v="${esc(v)}">${v==="ALL"?"All programs":esc(v)}</button>`).join("");
  const reps=[...new Set(RECORDS.map(r=>r.rep))].sort();
  document.getElementById("repChips").innerHTML=["ALL",...reps].map(v=>
    `<button class="chip" aria-pressed="${v===activeRep}" data-v="${esc(v)}">${v==="ALL"?"All reps":esc(v)}</button>`).join("");
  document.querySelectorAll("#progChips .chip").forEach(b=>b.addEventListener("click",()=>{activeProg=b.dataset.v;refresh();}));
  document.querySelectorAll("#repChips .chip").forEach(b=>b.addEventListener("click",()=>setRep(b.dataset.v)));
}
function setRep(v){activeRep=v;refresh();window.scrollTo({top:0,behavior:"smooth"});}
function refresh(){
  document.querySelectorAll("#progChips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===activeProg));
  document.querySelectorAll("#repChips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===activeRep));
  renderKPIs();renderSpectrum();renderMain();
}
function showEmpty(msg){document.getElementById("app").innerHTML=`<div class="empty"><h2>No data yet</h2><p>${msg}</p></div>`;}

async function boot(){
  let any=false,lastMod=null;
  for(const f of FILES){
    try{const res=await fetch(f,{cache:"no-store"});if(res.ok){lastMod=res.headers.get("last-modified")||lastMod;ingest(await res.text());any=true;}}catch(e){}
  }
  if(!any||!RECORDS.length){showEmpty("Upload the program files (<code>corona.csv</code>, <code>modelo.csv</code>, <code>impact.csv</code>, <code>innovation.csv</code>) next to this page and refresh."); return;}
  PROGRAMS=[...new Set(RECORDS.map(r=>r.prog))].sort((a,b)=>RECORDS.filter(r=>r.prog===b).length-RECORDS.filter(r=>r.prog===a).length);
  renderRibbon();renderChips();refresh();
  document.getElementById("updated").textContent=lastMod?"Updated "+new Date(lastMod).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):"";
  document.getElementById("foot").textContent="Each row in the reports is one SKU placement at an account. Figures reflect the latest program files uploaded.";
}
boot();
</script>
</body>
</html>
