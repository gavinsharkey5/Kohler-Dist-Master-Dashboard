&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

(()=&gt;{

 const rows=[{inv:&#x27;1234567&#x27;,account:&#x27;Example supplier&#x27;,item:&#x27;Samples · historical example&#x27;,vendor:&#x27;Kohler Distributing&#x27;,date:&#x27;Feb 2, 2026&#x27;,total:100.00,spend:0,status:&#x27;Reversed&#x27;,pdf:true},{inv:&#x27;DEMO-2048&#x27;,account:&#x27;Supplier account A&#x27;,item:&#x27;Fall display materials&#x27;,vendor:&#x27;Custom Vendor&#x27;,date:&#x27;Oct 15, 2026&#x27;,total:480,spend:240,status:&#x27;Pending&#x27;,pdf:true},{inv:&#x27;DEMO-2051&#x27;,account:&#x27;Supplier account B&#x27;,item:&#x27;Account activation&#x27;,vendor:&#x27;BDA&#x27;,date:&#x27;Oct 16, 2026&#x27;,total:250,spend:250,status:&#x27;Pending&#x27;,pdf:false},{inv:&#x27;DEMO-2054&#x27;,account:&#x27;Supplier account C&#x27;,item:&#x27;Printed point of sale&#x27;,vendor:&#x27;Custom Vendor&#x27;,date:&#x27;Oct 16, 2026&#x27;,total:625,spend:312.50,status:&#x27;Received&#x27;,pdf:true}];
 const money=n=&gt;n.toLocaleString(&#x27;en-US&#x27;,{style:&#x27;currency&#x27;,currency:&#x27;USD&#x27;});
 function stats(budget=false){return `&lt;div class=&quot;kd-stats&quot;&gt;${(budget?[[&#x27;Available budget&#x27;,&#x27;$24,800&#x27;,&#x27;Illustrative remaining balance&#x27;],[&#x27;Kohler spend&#x27;,&#x27;$8,640&#x27;,&#x27;October · sample figures&#x27;],[&#x27;Needs a PDF&#x27;,&#x27;1&#x27;,&#x27;In this preview ledger&#x27;]]:[[&#x27;Today’s priorities&#x27;,&#x27;3&#x27;,&#x27;Two follow-ups · one recap&#x27;],[&#x27;Active programs&#x27;,&#x27;12&#x27;,&#x27;Three ending this month&#x27;],[&#x27;Awaiting review&#x27;,&#x27;4&#x27;,&#x27;Team tasks and documents&#x27;]]).map(x=&gt;`&lt;div class=&quot;kd-stat&quot;&gt;&lt;label&gt;${x[0]}&lt;/label&gt;&lt;strong&gt;${x[1]}&lt;/strong&gt;&lt;small&gt;${x[2]}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}

 function consoleView(){return `&lt;div class=&quot;kd-console&quot;&gt;&lt;div class=&quot;kd-panel-head&quot;&gt;&lt;h2&gt;Operations queue&lt;/h2&gt;&lt;span class=&quot;kd-pill kd-warn&quot;&gt;3 open&lt;/span&gt;&lt;/div&gt;${[[&#x27;FIN&#x27;,&#x27;Review supplier recap&#x27;,&#x27;Invoice documents&#x27;,&#x27;budget&#x27;],[&#x27;FIELD&#x27;,&#x27;Display photo review&#x27;,&#x27;Team submission&#x27;,&#x27;detail&#x27;],[&#x27;SALES&#x27;,&#x27;October goal check&#x27;,&#x27;Program progress&#x27;,&#x27;detail&#x27;]].map(c=&gt;`&lt;div class=&quot;kd-console-row&quot;&gt;&lt;strong&gt;${c[0]}&lt;/strong&gt;&lt;div&gt;${c[1]}&lt;br&gt;&lt;small&gt;Ready for your review&lt;/small&gt;&lt;/div&gt;&lt;small&gt;${c[2]}&lt;/small&gt;&lt;button class=&quot;kd-button&quot; ${c[3]===&#x27;budget&#x27;?&#x27;data-view=&quot;budget&quot;&#x27;:`data-detail=&quot;${c[1]}&quot;`}&gt;Review ↗&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}
 function home(theme){let title={signature:&#x27;Good morning, Manager.&#x27;,dispatch:&#x27;Your daily dispatch.&#x27;,precision:&#x27;Your workspace&#x27;,fieldwork:&#x27;Move the day forward.&#x27;,nightshift:&#x27;Manager overview&#x27;}[theme];return `&lt;div class=&quot;kd-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;kd-eyebrow&quot;&gt;Friday, October 16 · Northern New Jersey&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;Your priorities, programs and team in one place.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;kd-button kd-primary&quot; data-detail=&quot;Assign a task&quot;&gt;+ Assign task&lt;/button&gt;&lt;/div&gt;${stats()}${theme===&#x27;fieldwork&#x27;?board():theme===&#x27;nightshift&#x27;?consoleView():`&lt;div class=&quot;kd-layout&quot;&gt;${tasks()}${programs()}&lt;/div&gt;`}${shortcuts()}`}
 function ledger(){return `&lt;div class=&quot;kd-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;kd-eyebrow&quot;&gt;Finance / Supplier Budgets&lt;/div&gt;&lt;h1&gt;Every dollar, documented.&lt;/h1&gt;&lt;p&gt;Review expenses, invoice PDFs and supplier billbacks.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;kd-button kd-primary&quot; data-view=&quot;new&quot;&gt;+ New Expense&lt;/button&gt;&lt;/div&gt;${stats(true)}&lt;div class=&quot;kd-tools&quot;&gt;&lt;input type=&quot;search&quot; aria-label=&quot;Search invoice or supplier&quot; placeholder=&quot;Search invoice or supplier…&quot;&gt;&lt;select aria-label=&quot;Budget year&quot;&gt;&lt;option&gt;2026&lt;/option&gt;&lt;option&gt;2025&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;kd-button&quot; data-missing aria-pressed=&quot;false&quot;&gt;Missing PDF · 1&lt;/button&gt;&lt;button class=&quot;kd-button&quot; data-detail=&quot;Bulk attach PDFs&quot;&gt;Bulk attach PDFs&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;kd-ledger&quot;&gt;&lt;table class=&quot;kd-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:29%&quot;&gt;Invoice &amp; documents&lt;/th&gt;&lt;th style=&quot;width:29%&quot;&gt;Account / expense&lt;/th&gt;&lt;th style=&quot;width:23%&quot;&gt;Billback status&lt;/th&gt;&lt;th style=&quot;width:19%&quot;&gt;Kohler spend&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(r=&gt;`&lt;tr data-invoice=&quot;${r.inv}&quot; data-pdf=&quot;${r.pdf}&quot;&gt;&lt;td&gt;&lt;b&gt;${r.inv}&lt;/b&gt;&lt;small&gt;${r.date}&lt;/small&gt;${r.pdf?`&lt;button class=&quot;kd-button&quot; data-pdf=&quot;${r.inv}&quot;&gt;View PDF ↗&lt;/button&gt;`:&#x27;&lt;span class=&quot;kd-pill kd-warn&quot; style=&quot;margin-top:7px&quot;&gt;Missing PDF&lt;/span&gt;&lt;button class=&quot;kd-button&quot; data-detail=&quot;Attach PDF&quot;&gt;Attach PDF&lt;/button&gt;&#x27;}&lt;button class=&quot;kd-source&quot; data-encompass=&quot;${r.inv}&quot;&gt;Open in Encompass ↗&lt;/button&gt;&lt;/td&gt;&lt;td&gt;&lt;b  function expense(theme){let id=&#x27;kd-&#x27;+theme;return `&lt;div class=&quot;kd-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;kd-eyebrow&quot;&gt;Finance / Supplier Budgets / New Expense&lt;/div&gt;&lt;h1&gt;New Expense&lt;/h1&gt;&lt;p&gt;Keep the expense and its supporting invoice together.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;kd-button&quot; data-view=&quot;budget&quot;&gt;← Ledger&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;kd-form-layout&quot;&gt;&lt;form class=&quot;kd-form&quot;&gt;&lt;div class=&quot;kd-form-grid&quot;&gt;&lt;label class=&quot;kd-field&quot;&gt;Date&lt;input type=&quot;date&quot; value=&quot;2026-10-16&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;kd-field&quot;&gt;Invoice number &lt;input placeholder=&quot;e.g. 1234567&quot;&gt;&lt;/label&gt;&lt;label class=&quot;kd-field kd-wide&quot;&gt;Supplier account&lt;select required&gt;&lt;option value=&quot;&quot;&gt;Choose an account…&lt;/option&gt;&lt;option&gt;Supplier account A&lt;/option&gt;&lt;option&gt;Supplier account B&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;kd-field&quot;&gt;Vendor&lt;input placeholder=&quot;Choose or enter vendor&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;kd-field&quot;&gt;Items purchased&lt;input placeholder=&quot;Describe the expense&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;kd-field&quot;&gt;Total amount ($)&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;0.00&quot; data-total required&gt;&lt;/label&gt;&lt;label class=&quot;kd-field&quot;&gt;Billback amount ($)&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;0.00&quot; data-billback&gt;&lt;/label&gt;&lt;label class=&quot;kd-field kd-wide&quot;&gt;Notes &lt;span class=&quot;kd-optional&quot;&gt;Optional&lt;/span&gt;&lt;textarea placeholder=&quot;Add context for the manager reviewing this expense&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;kd-drop&quot;&gt;&lt;label for=&quot;${id}-pdf&quot;&gt;Invoice PDFs &lt;span class=&quot;kd-optional&quot;&gt;Optional&lt;/span&gt;&lt;/label&gt;&lt;p&gt;Attach supporting PDFs · Up to 20 MB per file&lt;/p&gt;&lt;input id=&quot;${id}-pdf&quot; type=&quot;file&quot; accept=&quot;application/pdf,.pdf&quot; multiple&gt;&lt;div class=&quot;kd-staged&quot; aria-live=&quot;polite&quot;&gt;No PDFs selected.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kd-form-actions&quot;&gt;&lt;button class=&quot;kd-button kd-primary&quot; type=&quot;submit&quot;&gt;Save Expense&lt;/button&gt;&lt;button class=&quot;kd-button&quot; type=&quot;submit&quot; data-another&gt;Save &amp; Add Another&lt;/button&gt;&lt;button class=&quot;kd-button kd-text&quot; type=&quot;button&quot; data-view=&quot;budget&quot;&gt;Cancel&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;kd-feedback&quot; role=&quot;status&quot;&gt;Design preview · Files stay on your device.&lt;/div&gt;&lt;/form&gt;&lt;aside class=&quot;kd-summary&quot;&gt;&lt;h2&gt;Expense summary&lt;/h2&gt;&lt;dl&gt;&lt;div&gt;&lt;dt&gt;Total amount&lt;/dt&gt;&lt;dd data-summary-total&gt;$0.00&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Supplier billback&lt;/dt&gt;&lt;dd data-summary-bb&gt;$0.00&lt;/dd&gt;&lt;/div&gt;&lt;div class=&quot;kd-net&quot;&gt;&lt;dt&gt;Kohler spend&lt;/dt&gt;&lt;dd data-summary-net&gt;$0.00&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;p style=&quot;margin-top:22px&quot;&gt;Selected PDFs appear alongside this expense in the ledger after saving.&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;`}

me}-home-tab&quot; aria-controls=&quot;${theme}-home&quot; aria-selected=&quot;true&quot; data-view=&quot;home&quot;&gt;Home&lt;/button&gt;&lt;button role=&quot;tab&quot; id=&quot;${theme}-budget-tab&quot; aria-controls=&quot;${theme}-budget&quot; aria-selected=&quot;false&quot; data-view=&quot;budget&quot;&gt;Supplier Budgets&lt;/button&gt;&lt;button role=&quot;tab&quot; id=&quot;${theme}-new-tab&quot; aria-controls=&quot;${theme}-new&quot; aria-selected=&quot;false&quot; data-view=&quot;new&quot;&gt;New Expense&lt;/button&gt;&lt;/div&gt;&lt;section role=&quot;tabpanel&quot; id=&quot;${theme}-home&quot; aria-labelledby=&quot;${theme}-home-tab&quot; data-panel=&quot;home&quot;&gt;${home(theme)}&lt;/section&gt;&lt;section role=&quot;tabpanel&quot; id=&quot;${theme}-budget&quot; aria-labelledby=&quot;${theme}-budget-tab&quot; data-panel=&quot;budget&quot; hidden&gt;${ledger()}&lt;/section&gt;&lt;section role=&quot;tabpanel&quot; id=&quot;${theme}-new&quot; aria-labelledby=&quot;${theme}-new-tab&quot; data-panel=&quot;new&quot; hidden&gt;${expense(theme)}&lt;/section&gt;&lt;div class=&quot;kd-notice&quot;&gt;&lt;span&gt;Kohler Distribution Hub · Internal workspace&lt;/span&gt;&lt;span&gt;Illustrative data · No live changes&lt;/span&gt;&lt;/div&gt;&lt;/main&gt;&lt;/div&gt;&lt;div class=&quot;kd-modal&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;Preview detail&quot; hidden&gt;&lt;div class=&quot;kd-modal-box&quot;&gt;&lt;h2 data-modal-title&gt;&lt;/h2&gt;&lt;div data-modal-body&gt;&lt;/div&gt;&lt;button class=&quot;kd-button kd-primary&quot; data-close&gt;Back to preview&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  function view(name){app.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(p=&gt;p.hidden=p.dataset.panel!==name);app.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-selected&#x27;,String(b.dataset.view===name)));app.querySelectorAll(&#x27;.kd-nav [data-view]&#x27;).forEach(b=&gt;{if(b.dataset.view===(name===&#x27;new&#x27;?&#x27;budget&#x27;:name))b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;)});app.querySelector(&#x27;[data-crumb]&#x27;).textContent={home:&#x27;Home&#x27;,budget:&#x27;Supplier Budgets&#x27;,new:&#x27;New Expense&#x27;}[name];}
