<script>
(()=>{
 const root=document.getElementById('kohler-directions');
 const names={signature:'Kohler Signature',dispatch:'The Dispatch',precision:'Precision Workspace',fieldwork:'Fieldwork',nightshift:'Nightshift'};
 const rows=[{inv:'1234567',account:'Example supplier',item:'Samples · historical example',vendor:'Kohler Distributing',date:'Feb 2, 2026',total:100.00,spend:0,status:'Reversed',pdf:true},{inv:'DEMO-2048',account:'Supplier account A',item:'Fall display materials',vendor:'Custom Vendor',date:'Oct 15, 2026',total:480,spend:240,status:'Pending',pdf:true},{inv:'DEMO-2051',account:'Supplier account B',item:'Account activation',vendor:'BDA',date:'Oct 16, 2026',total:250,spend:250,status:'Pending',pdf:false},{inv:'DEMO-2054',account:'Supplier account C',item:'Printed point of sale',vendor:'Custom Vendor',date:'Oct 16, 2026',total:625,spend:312.50,status:'Received',pdf:true}];
 const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});
 function stats(budget=false){return `<div class="kd-stats">${(budget?[['Available budget','$24,800','Illustrative remaining balance'],['Kohler spend','$8,640','October · sample figures'],['Needs a PDF','1','In this preview ledger']]:[['Today’s priorities','3','Two follow-ups · one recap'],['Active programs','12','Three ending this month'],['Awaiting review','4','Team tasks and documents']]).map(x=>`<div class="kd-stat"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
 function tasks(){return `<div class="kd-panel"><div class="kd-panel-head"><h2>Next up</h2><small>My work · 3</small></div>${[['Review supplier recap','Supplier Budgets · Finance','Today'],['Follow up on display photos','Field Tasks · Team','Today'],['Review October program results','Incentives · Programs','This week']].map((t,i)=>`<label class="kd-task"><input type="checkbox" aria-label="Complete ${t[0]}"><span><span class="kd-task-title">${t[0]}</span><small>${t[1]}</small></span><span class="kd-pill ${i<2?'kd-warn':''}">${t[2]}</span></label>`).join('')}</div>`}
 function programs(){return `<div class="kd-panel"><div class="kd-panel-head"><h2>Program watch</h2><small>October</small></div><div class="kd-program"><b>Fall distribution rewards</b><p>Team goal progress</p><div class="kd-progress"><span style="width:72%"></span></div><div class="kd-program-foot"><span>72% of goal</span><span>15 days left</span></div></div><div class="kd-program"><b>Seasonal draft conversion</b><p>Team goal progress</p><div class="kd-progress"><span style="width:46%"></span></div><div class="kd-program-foot"><span>46% of goal</span><span>7 days left</span></div></div></div>`}
 function shortcuts(){return `<div class="kd-shortcuts"><button class="kd-shortcut" data-view="budget">Supplier Budgets <em>↗</em><span>Expenses, PDFs & billbacks</span></button><button class="kd-shortcut" data-detail="Team Accounts">Team Accounts <em>↗</em><span>Follow-ups & opportunities</span></button><button class="kd-shortcut" data-detail="Inventory">What Can I Sell <em>↗</em><span>Available & running low</span></button></div>`}
 function board(){return `<div class="kd-board">${[['To follow up','2',[['Account follow-up','Review the next reorder opportunity.','Accounts'],['Display photos','Check the latest field submission.','Field Tasks']]],['To review','1',[['Supplier recap','Review invoice PDFs before closing out.','Supplier Budgets']]],['Coming up','1',[['October programs','Review progress before the month ends.','Programs']]]].map(l=>`<div class="kd-lane"><div class="kd-lane-head"><span>${l[0]}</span><span>${l[1]}</span></div>${l[2].map(c=>`<div class="kd-board-card"><span class="kd-pill">${c[2]}</span><h2>${c[0]}</h2><p>${c[1]}</p><button class="kd-button kd-text" ${c[2]==='Supplier Budgets'?'data-view="budget"':`data-detail="${c[0]}"`}>Open work →</button></div>`).join('')}</div>`).join('')}</div>`}
 function consoleView(){return `<div class="kd-console"><div class="kd-panel-head"><h2>Operations queue</h2><span class="kd-pill kd-warn">3 open</span></div>${[['FIN','Review supplier recap','Invoice documents','budget'],['FIELD','Display photo review','Team submission','detail'],['SALES','October goal check','Program progress','detail']].map(c=>`<div class="kd-console-row"><strong>${c[0]}</strong><div>${c[1]}<br><small>Ready for your review</small></div><small>${c[2]}</small><button class="kd-button" ${c[3]==='budget'?'data-view="budget"':`data-detail="${c[1]}"`}>Review ↗</button></div>`).join('')}</div>`}
 function home(theme){let title={signature:'Good morning, Manager.',dispatch:'Your daily dispatch.',precision:'Your workspace',fieldwork:'Move the day forward.',nightshift:'Manager overview'}[theme];return `<div class="kd-heading"><div><div class="kd-eyebrow">Friday, October 16 · Northern New Jersey</div><h1>${title}</h1><p>Your priorities, programs and team in one place.</p></div><button class="kd-button kd-primary" data-detail="Assign a task">+ Assign task</button></div>${stats()}${theme==='fieldwork'?board():theme==='nightshift'?consoleView():`<div class="kd-layout">${tasks()}${programs()}</div>`}${shortcuts()}`}
 function ledger(){return `<div class="kd-heading"><div><div class="kd-eyebrow">Finance / Supplier Budgets</div><h1>Every dollar, documented.</h1><p>Review expenses, invoice PDFs and supplier billbacks.</p></div><button class="kd-button kd-primary" data-view="new">+ New Expense</button></div>${stats(true)}<div class="kd-tools"><input type="search" aria-label="Search invoice or supplier" placeholder="Search invoice or supplier…"><select aria-label="Budget year"><option>2026</option><option>2025</option></select><button class="kd-button" data-missing aria-pressed="false">Missing PDF · 1</button><button class="kd-button" data-detail="Bulk attach PDFs">Bulk attach PDFs</button></div><div class="kd-ledger"><table class="kd-table"><thead><tr><th style="width:29%">Invoice & documents</th><th style="width:29%">Account / expense</th><th style="width:23%">Billback status</th><th style="width:19%">Kohler spend</th></tr></thead><tbody>${rows.map(r=>`<tr data-invoice="${r.inv}" data-pdf="${r.pdf}"><td><b>${r.inv}</b><small>${r.date}</small>${r.pdf?`<button class="kd-button" data-pdf="${r.inv}">View PDF ↗</button>`:'<span class="kd-pill kd-warn" style="margin-top:7px">Missing PDF</span><button class="kd-button" data-detail="Attach PDF">Attach PDF</button>'}<button class="kd-source" data-encompass="${r.inv}">Open in Encompass ↗</button></td><td><b>${r.account}</b><small>${r.item}</small></td><td><span class="kd-pill ${r.status==='Received'?'kd-good':r.status==='Pending'?'kd-warn':''}">${r.status}</span><small style="margin-top:7px">${r.status==='Reversed'?'Original total '+money(r.total):'Total '+money(r.total)}</small></td><td class="kd-money">${money(r.spend)}${r.status==='Reversed'?'<small>Reversed example</small>':''}</td></tr>`).join('')}</tbody></table><div class="kd-row-count" aria-live="polite">4 example expenses · Sample data</div></div>`}
 function expense(theme){let id='kd-'+theme;return `<div class="kd-heading"><div><div class="kd-eyebrow">Finance / Supplier Budgets / New Expense</div><h1>New Expense</h1><p>Keep the expense and its supporting invoice together.</p></div><button class="kd-button" data-view="budget">← Ledger</button></div><div class="kd-form-layout"><form class="kd-form"><div class="kd-form-grid"><label class="kd-field">Date<input type="date" value="2026-10-16" required></label><label class="kd-field">Invoice number <input placeholder="e.g. 1234567"></label><label class="kd-field kd-wide">Supplier account<select required><option value="">Choose an account…</option><option>Supplier account A</option><option>Supplier account B</option></select></label><label class="kd-field">Vendor<input placeholder="Choose or enter vendor" required></label><label class="kd-field">Items purchased<input placeholder="Describe the expense" required></label><label class="kd-field">Total amount ($)<input type="number" min="0" step="0.01" placeholder="0.00" data-total required></label><label class="kd-field">Billback amount ($)<input type="number" min="0" step="0.01" placeholder="0.00" data-billback></label><label class="kd-field kd-wide">Notes <span class="kd-optional">Optional</span><textarea placeholder="Add context for the manager reviewing this expense"></textarea></label><div class="kd-drop"><label for="${id}-pdf">Invoice PDFs <span class="kd-optional">Optional</span></label><p>Attach supporting PDFs · Up to 20 MB per file</p><input id="${id}-pdf" type="file" accept="application/pdf,.pdf" multiple><div class="kd-staged" aria-live="polite">No PDFs selected.</div></div></div><div class="kd-form-actions"><button class="kd-button kd-primary" type="submit">Save Expense</button><button class="kd-button" type="submit" data-another>Save & Add Another</button><button class="kd-button kd-text" type="button" data-view="budget">Cancel</button></div><div class="kd-feedback" role="status">Design preview · Files stay on your device.</div></form><aside class="kd-summary"><h2>Expense summary</h2><dl><div><dt>Total amount</dt><dd data-summary-total>$0.00</dd></div><div><dt>Supplier billback</dt><dd data-summary-bb>$0.00</dd></div><div class="kd-net"><dt>Kohler spend</dt><dd data-summary-net>$0.00</dd></div></dl><p style="margin-top:22px">Selected PDFs appear alongside this expense in the ledger after saving.</p></aside></div>`}
 root.querySelectorAll('.kd-app').forEach(app=>{
  const theme=app.dataset.theme;
  app.innerHTML=`<aside class="kd-nav"><div class="kd-brand"><span class="kd-mark">K</span><span>Kohler<small>Distribution Hub</small></span></div><nav class="kd-nav-group" aria-label="Workspace"><label>Workspace</label><button data-view="home" aria-current="page">Home</button><button data-detail="Accounts">Accounts</button><button data-detail="Programs">Programs</button><button data-view="budget">Supplier Budgets</button></nav><div class="kd-secondary-nav"><label>Operations</label><button data-detail="Field Tasks">Field Tasks</button><button data-detail="Team">Team</button><button data-detail="Inventory">Inventory</button><button data-detail="Reports">Reports</button></div><div class="kd-nav-foot"><div class="kd-user"><span class="kd-avatar">GS</span><span class="kd-user-text">Preview Manager<br><span style="opacity:.7;font-size:11px">Manager workspace</span></span></div></div></aside><div class="kd-main"><header class="kd-top"><span class="kd-crumb">${names[theme]} <span style="opacity:.5">/</span> <span data-crumb>Home</span></span><div class="kd-top-actions"><span class="kd-top-date">Oct 16, 2026</span><span class="kd-demo">Design preview</span></div></header><main class="kd-content"><div class="kd-tabs" role="tablist" aria-label="Preview screens"><button role="tab" id="${theme}-home-tab" aria-controls="${theme}-home" aria-selected="true" data-view="home">Home</button><button role="tab" id="${theme}-budget-tab" aria-controls="${theme}-budget" aria-selected="false" data-view="budget">Supplier Budgets</button><button role="tab" id="${theme}-new-tab" aria-controls="${theme}-new" aria-selected="false" data-view="new">New Expense</button></div><section role="tabpanel" id="${theme}-home" aria-labelledby="${theme}-home-tab" data-panel="home">${home(theme)}</section><section role="tabpanel" id="${theme}-budget" aria-labelledby="${theme}-budget-tab" data-panel="budget" hidden>${ledger()}</section><section role="tabpanel" id="${theme}-new" aria-labelledby="${theme}-new-tab" data-panel="new" hidden>${expense(theme)}</section><div class="kd-notice"><span>Kohler Distribution Hub · Internal workspace</span><span>Illustrative data · No live changes</span></div></main></div><div class="kd-modal" role="dialog" aria-modal="true" aria-label="Preview detail" hidden><div class="kd-modal-box"><h2 data-modal-title></h2><div data-modal-body></div><button class="kd-button kd-primary" data-close>Back to preview</button></div></div>`;
  function view(name){app.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==name);app.querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===name)));app.querySelectorAll('.kd-nav [data-view]').forEach(b=>{if(b.dataset.view===(name==='new'?'budget':name))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});app.querySelector('[data-crumb]').textContent={home:'Home',budget:'Supplier Budgets',new:'New Expense'}[name];}
  let returnFocus=null;
  function modal(title,body){returnFocus=document.activeElement;app.querySelector('[data-modal-title]').textContent=title;app.querySelector('[data-modal-body]').innerHTML=body;app.querySelector('.kd-modal').hidden=false;app.querySelector('[data-close]').focus();}
  function close(){app.querySelector('.kd-modal').hidden=true;returnFocus?.focus();}
  app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)view(b.dataset.view);if(b.hasAttribute('data-close'))close();if(b.dataset.pdf)modal('Invoice '+b.dataset.pdf,`<span class="kd-pill kd-good">PDF attached</span><div class="kd-file-line"><strong>${b.dataset.pdf==='1234567'?'1234567 Example.pdf':'Example invoice.pdf'}</strong><small>Invoice PDF · Document preview</small></div><p>This demonstrates document access. The production site opens the secured invoice PDF.</p>`);if(b.dataset.encompass)modal('Open in Encompass',`<p>Invoice <strong>${b.dataset.encompass}</strong> opens its matching Encompass record in a new tab on the production site.</p><p>External navigation is disabled in these design previews.</p>`);if(b.dataset.detail)modal(b.dataset.detail,b.dataset.detail==='Bulk attach PDFs'?'<p>Select multiple PDFs, match filenames to invoice numbers, review any ambiguous matches, then attach the batch.</p><div class="kd-file-line"><strong>1234567 Example.pdf → 1234567</strong><small>Example exact invoice match</small></div>':'<p>This area uses the same navigation, typography, spacing and action hierarchy throughout the proposed theme.</p><p>Home, Supplier Budgets and New Expense are available as interactive preview screens.</p>');if(b.hasAttribute('data-missing')){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));filter();}});
  app.addEventListener('keydown',e=>{const tab=e.target.closest('[role="tab"]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...app.querySelectorAll('[role="tab"]')];let index=tabs.indexOf(tab);index=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;view(tabs[index].dataset.view);tabs[index].focus();}const dialog=app.querySelector('.kd-modal');if(dialog.hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();app.querySelector('[data-close]').focus();}});
  const search=app.querySelector('input[type="search"]');function filter(){const q=search.value.toLowerCase();const missing=app.querySelector('[data-missing]').getAttribute('aria-pressed')==='true';let count=0;app.querySelectorAll('[data-invoice]').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(q)||(missing&&tr.dataset.pdf==='true');if(!tr.hidden)count++;});app.querySelector('.kd-row-count').textContent=count+' example expense'+(count===1?'':'s')+' · Sample data';}
  search.addEventListener('input',filter);
  app.querySelector('.kd-tools select').addEventListener('change',e=>{app.querySelector('.kd-row-count').textContent=e.target.value==='2025'?'No 2025 sample expenses.': '4 example expenses · Sample data';app.querySelector('.kd-table').hidden=e.target.value==='2025';});
  app.querySelectorAll('.kd-task input').forEach(c=>c.addEventListener('change',()=>c.closest('.kd-task').classList.toggle('done',c.checked)));
  const form=app.querySelector('form');const file=form.querySelector('input[type="file"]');file.addEventListener('change',()=>{const files=[...file.files];const bad=files.find(f=>!f.name.toLowerCase().endsWith('.pdf')||f.size>20*1024*1024);form.querySelector('.kd-staged').textContent=bad?'Choose PDF files no larger than 20 MB.':files.length?files.map(f=>f.name).join(' · '):'No PDFs selected.';});
  function sums(){const total=Number(form.querySelector('[data-total]').value)||0,bb=Number(form.querySelector('[data-billback]').value)||0;app.querySelector('[data-summary-total]').textContent=money(total);app.querySelector('[data-summary-bb]').textContent=money(bb);app.querySelector('[data-summary-net]').textContent=money(total-bb);}
  form.addEventListener('input',sums);form.addEventListener('submit',e=>{e.preventDefault();const feedback=form.querySelector('.kd-feedback');feedback.textContent='Preview only — no expense or PDF was uploaded.';if(e.submitter?.hasAttribute('data-another')){form.reset();form.querySelector('.kd-staged').textContent='No PDFs selected.';sums();feedback.textContent='Ready for another expense. Preview only — nothing was uploaded.';}});
  const settings={compact:false};if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>app.style.setProperty('--kd-radius',settings.compact?'4px':theme==='fieldwork'?'15px':theme==='dispatch'?'2px':theme==='precision'||theme==='nightshift'?'5px':'12px')});tweak.addToggle(settings,'compact',{label:'Sharper corners'});}
 });
})();
</script>
