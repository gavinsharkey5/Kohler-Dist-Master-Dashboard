<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off-Prem MPO Tracker | July 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Same warm barrel-wood + amber-beer + Kohler-blue theme as the
       on-premise dashboard and the 6-Month Review dashboard, themed off
       Kohler Distributing's brand photography rather than a generic
       neutral dark UI. */
    --canvas:#15100A; --card:#241A11; --card-alt:#1C130C; --border:#3D2E1D; --line-soft:#2A1F14;
    --text:#F7F1E6; --text-dim:#B7A489; --text-mute:#8A7860;
    --accent:#4E7CE8; --accent-soft:rgba(78,124,232,0.16); --accent-deep:#1F3E82;
    --good:#4CC97A; --good-soft:rgba(76,201,122,0.16);
    --amber:#F4B83E; --amber-soft:rgba(244,184,62,0.16);
    --red:#EB6A50; --red-soft:rgba(235,106,80,0.16);
    --input-bg:#1A130C; --input-border:#4A3A26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;}
  a{color:var(--accent);}
  .topbar{padding:24px 32px 0;max-width:1200px;margin:0 auto;}
  .crumb{font-size:13px;color:var(--text-dim);margin-bottom:18px;}
  .crumb a{color:var(--text-dim);text-decoration:none;}
  .crumb a:hover{color:var(--accent);}

  .hero-banner{max-width:1200px;margin:0 auto;position:relative;border-radius:14px;overflow:hidden;
    border:1px solid var(--border);box-shadow:var(--shadow);background:var(--card)}
  .hero-banner-img{display:block;width:100%;height:auto;max-height:220px;object-fit:cover}
  .hero-banner::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(21,16,10,.05) 0%,rgba(21,16,10,.6) 100%)}
  .hero-logo-badge{position:absolute;top:14px;left:18px;height:52px;width:auto;z-index:1;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
  @media (max-width:640px){
    .hero-banner-img{max-height:120px}
    .hero-logo-badge{height:38px;top:10px;left:12px}
  }

  header{max-width:1200px;margin:0 auto;padding:22px 32px 20px;border-bottom:1px solid var(--border);}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4vw,38px);margin-bottom:8px;}
  .sub{color:var(--text-dim);font-size:14.5px;}
  .updated{margin:10px 0 0;font-size:12px;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 70%,transparent);animation:lp 2s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

  .kpi-strip{max-width:1200px;margin:28px auto 0;padding:0 32px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  @media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:700px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);}
  .kpi-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .kpi-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
  .kpi-val.warn{color:var(--amber);}
  .kpi-val.good{color:var(--good);}
  .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

  .repbar-wrap{max-width:1200px;margin:24px auto 0;padding:0 32px;}
  .repbar-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
  .repbar{display:flex;flex-wrap:wrap;gap:8px;}
  .repchip{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .repchip:hover{border-color:var(--accent);color:var(--text);}
  .repchip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  .monthbar{max-width:1200px;margin:0 auto;padding:14px 32px 0;display:flex;gap:8px;flex-wrap:wrap;}
  .monthtab{background:none;border:1px solid var(--border);color:var(--text-dim);padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
  .monthtab:hover{color:var(--text);border-color:var(--text-dim);}
  .monthtab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  main{max-width:1200px;margin:28px auto;padding:0 32px;display:flex;flex-direction:column;gap:20px;}

  .backbtn{background:none;border:1px solid var(--border);color:var(--text-dim);font:inherit;font-weight:600;font-size:14px;padding:8px 15px;border-radius:11px;cursor:pointer;margin-bottom:4px;}
  .backbtn:hover{color:var(--text);border-color:var(--text-dim);}
  .rep-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px;}
  .rep-hero h2{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}

  .obj-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .obj-head{padding:22px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .obj-head:hover{background:var(--card-alt);}
  .obj-head.static{cursor:default;}
  .obj-head.static:hover{background:none;}
  .obj-left{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .obj-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .obj-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;}
  .weight-tag{font-size:11px;color:var(--text-dim);background:var(--card-alt);border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .goal-tag{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(78,124,232,0.35);padding:2px 8px;border-radius:20px;}
  .obj-bar-track{width:100%;max-width:420px;height:7px;background:var(--input-bg);border-radius:4px;overflow:hidden;margin-top:2px;}
  .obj-bar-fill{height:100%;border-radius:4px;background:var(--good);}
  .obj-bar-fill.over{background:var(--amber);}
  .obj-right{display:flex;align-items:center;gap:18px;flex-shrink:0;}
  .obj-progress-txt{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;text-align:right;}
  .obj-progress-sub{font-size:11.5px;color:var(--text-dim);text-align:right;}
  .chev{transition:transform .18s;color:var(--text-dim);font-size:14px;}
  .obj-card.open .chev{transform:rotate(90deg);}
  .obj-body{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid transparent;}
  .obj-card.open .obj-body{max-height:200000px;border-top:1px solid var(--border);}
  .obj-card.static-open .obj-body{max-height:none;overflow:visible;border-top:1px solid var(--border);}
  .obj-body-inner{padding:20px 24px 26px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 12px;background:var(--card-alt);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .flag-hit{color:var(--good);font-weight:600;}
  /* Lytt POS photo lines (Disruptors objective) */
  .photo-btn{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap;}
  .photo-btn:hover{text-decoration:underline;}
  .photo-sub{color:var(--text-dim);font-size:12px;}
  .flag-miss{color:var(--text-dim);}
  .mini-bar-track{display:inline-block;width:80px;height:6px;background:var(--input-bg);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px;}
  .mini-bar-fill{height:100%;background:var(--good);}
  .mini-bar-fill.over{background:var(--amber);}
  .over-badge{color:var(--amber);font-size:11px;font-weight:600;margin-left:6px;}
  .table-scroll{max-height:480px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .table-scroll table thead th{position:sticky;top:0;background:var(--card);z-index:1;}

  .empty-obj{padding:22px 24px;color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:space-between;}
  .empty-tag{font-size:11px;background:var(--card-alt);border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--text-dim);}
  .empty-state{color:var(--text-dim);font-size:13px;padding:6px 2px 2px;}

  /* Target Accounts -- per-rep prospect lists (accounts in their book that
     don't carry the brand yet, in the off-premise core territory). Collapsed
     by default since a rep's full account base can run to 100+ rows; click
     the header to reveal it. */
  .targets-block{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .targets-toggle{cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;color:var(--amber);
    text-transform:uppercase;letter-spacing:.04em;padding:2px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .targets-toggle:hover{color:var(--text);}
  .targets-hint{color:var(--text-dim);font-weight:500;text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif;font-size:12px;}
  .targets-chev{font-size:9px;transition:transform .15s;display:inline-block;color:var(--amber);}
  .targets-toggle.open .targets-chev{transform:rotate(90deg);}
  .targets-table{display:none;}
  .targets-table.open{display:block;padding-top:8px;}
  .tgt-county{border-top:1px solid var(--line-soft);}
  .tgt-county:first-child{border-top:none;}
  .tgt-county-toggle{cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;color:var(--text-dim);
    padding:8px 2px;display:flex;align-items:center;gap:7px;}
  .tgt-county-toggle:hover{color:var(--text);}
  .tgt-county-count{color:var(--text-mute);font-weight:500;}
  .tgt-county-chev{font-size:8px;transition:transform .15s;display:inline-block;}
  .tgt-county-toggle.open .tgt-county-chev{transform:rotate(90deg);}
  .tgt-county-table{display:none;}
  .tgt-county-table.open{display:block;}

  /* Dual-brand objectives (Molson Coors Peroni/Banquet, Wine & Spirits Le
     Grand/Leyenda/Green River) -- each brand needs to read as its own
     clearly separated section instead of a small dim label that blends
     into the surrounding text, since a rep's status/targets/existing
     accounts for one brand are easy to misattribute to the other otherwise. */
  .brand-group{padding:12px 0 14px 26px;border-top:1px solid var(--line-soft);}
  .brand-group:first-child{border-top:none;padding-top:0;}
  .brand-group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .brand-pill{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(78,124,232,0.35);padding:3px 11px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.04em;}
  .brand-group-progress{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--text);}

  .rep-row{cursor:pointer;}
  .rep-row:hover{background:var(--card-alt);}
  .rep-row td:first-child{display:flex;align-items:center;gap:8px;}
  .rep-chev{font-size:10px;color:var(--text-dim);transition:transform .15s;display:inline-block;}
  .rep-row.expanded .rep-chev{transform:rotate(90deg);}
  .rep-sub{display:none;}
  .rep-sub.open{display:table-row;}
  .rep-sub td{background:var(--card-alt);padding:0;}
  .rep-sub-inner{padding:10px 24px 14px 38px;}
  .rep-sub-inner table{font-size:12.5px;}
  .rep-sub-inner th{padding:6px 10px;}
  .rep-sub-inner td{padding:6px 10px;}
  .no-lines{color:var(--text-dim);font-size:12.5px;padding:10px 24px 14px 38px;}
  .complete-tag{color:var(--good);font-weight:600;}
  .focus-row{background:var(--amber-soft);}
  .pkg-group-row{cursor:pointer;}
  .pkg-group-row:hover td{background:var(--input-bg);}
  .pkg-group-row td{background:var(--card-alt);color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:7px 12px;}
  .pkg-group-row:first-child td{border-top:none;}
  .pkg-chev{display:inline-block;margin-right:7px;font-size:9px;transition:transform .15s;}
  .pkg-group-row.collapsed .pkg-chev{transform:rotate(-90deg);}
  .pkg-item-row.hidden{display:none;}
  .rep-row-nodata td{color:var(--text-dim);opacity:0.6;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  /* ===== Mobile / tablet responsiveness ===== */
  html, body{overflow-x:hidden;}
  * { -webkit-tap-highlight-color: transparent; }

  @media (max-width: 820px){
    .topbar{padding:18px 16px 0;}
    .monthbar{padding:14px 16px 0;}
    header{padding:0 16px 16px;}
    .kpi-strip{padding:0 16px;gap:10px;margin-top:20px;}
    .repbar-wrap{padding:0 16px;margin-top:18px;}
    main{padding:0 16px;margin:20px auto;gap:14px;}
    h1{font-size:clamp(22px,6vw,30px);}
    .sub{font-size:13.5px;}

    .kpi{padding:14px 14px;}
    .kpi-val{font-size:21px;}
    .kpi-label{font-size:10.5px;}

    .repchip{padding:9px 14px;font-size:13px;min-height:38px;display:inline-flex;align-items:center;}

    .obj-head{padding:16px 16px;flex-wrap:wrap;gap:12px;}
    .obj-name{font-size:15.5px;}
    .obj-right{gap:12px;width:100%;justify-content:space-between;}
    .obj-progress-txt{font-size:18px;}
    .obj-body-inner{padding:14px 12px 18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}

    .rep-hero{gap:10px;}
    .rep-hero h2{font-size:21px;}

    table{font-size:13px;}
    th, td{padding:10px 8px;}
    .mini-bar-track{width:46px;margin-right:6px;}

    .rep-sub-inner{padding:8px 10px 12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .rep-sub-inner table{min-width:540px;font-size:12.5px;}
    .rep-sub-inner th, .rep-sub-inner td{padding:8px 9px;white-space:nowrap;}

    .table-scroll{max-height:400px;}
  }

  @media (max-width: 480px){
    .topbar{padding:14px 12px 0;}
    .monthbar{padding:12px 12px 0;}
    header{padding:0 12px 14px;}
    .kpi-strip{padding:0 12px;grid-template-columns:repeat(2,1fr)!important;gap:8px;}
    .repbar-wrap{padding:0 12px;}
    main{padding:0 12px;}
    .kpi{padding:12px 12px;}
    .kpi-val{font-size:19px;}
    .obj-head{padding:14px 12px;}
    .obj-name{font-size:14.5px;}
    .weight-tag, .goal-tag{font-size:10px;padding:2px 7px;}
    .obj-progress-txt{font-size:16px;}
    table{font-size:12.5px;}
    th, td{padding:9px 7px;}
    .rep-row td:first-child{gap:6px;}
  }

</style>
</head>
<body>

<div class="topbar">
  <div class="crumb"><a href="../index.html">MPO Tracker</a> &nbsp;/&nbsp; Off-Premise</div>
  <div class="hero-banner">
    <img class="hero-banner-img" src="../../assets/hero-banner.jpg" alt="Kohler Distributing Company headquarters">
    <img class="hero-logo-badge" src="../../assets/kohler-logo-badge.png" alt="Kohler Distributing Company">
  </div>
</div>

<div class="monthbar" id="monthbar"></div>

<header>
  <div class="eyebrow" id="eyebrow">Off-Premise · July 2026</div>
  <h1>Off-Prem MPO Tracker</h1>
  <p class="sub">20% of Total Commission Eligibility — weighted across objectives. Each month's objectives are entirely different programs (see each objective card for its specific goal).</p>
  <p class="updated" id="updated-line"></p>
</header>

<div class="kpi-strip" id="kpi-strip"></div>

<div class="repbar-wrap">
  <div class="repbar-label">Jump to a rep</div>
  <div class="repbar" id="repbar"></div>
</div>

<main id="objectives"></main>

<script>
let DATA = {};
let OBJECTIVES = [];

const ROSTER = ["Alex Rodriguez","Alisa Acciardi","Allison Scott","Andrew Lundy","Anthony Palmisano","Brian Sengebush","Chris Payton","Dan Lagala","Dave Ehlers","Derrick Laws","Dylan Rubino","Hakan Sadik","Jaime Colonna","Javier Melo","Jayson Romine","Jim Heaney","John O'Donoghue","Klejdi Lamo","Matt Powierski","Michael Harboy","Mike Ast","Nick Melissari","Pablo Lopez","Paul Mclaughlin","Phil Ernst","Robin Feldman","Shane Barreca"];

const OBJECTIVES_2026_07 = [
  {key:'new_belgium', name:'New Belgium – Achieve 90% of Assigned Distribution Goal', shortName:'New Belgium', weight:0.30, type:'new_belgium', hasData:true, goalLabel:'90% of dist. goal'},
  {key:'ws_2xo', name:'Wine & Spirits – 2XO (2), Le Grand Pinot Noir (1), Yave (1) Placements', shortName:'W&S 2XO/Le Grand/Yave', weight:0.30, type:'placements', hasData:true, goalLabel:'4 placements each'},
  {key:'sapporo_light', name:'Sapporo Light – (5) Placements per Rep', shortName:'Sapporo Light', weight:0.10, type:'placements', hasData:true, goalLabel:'5 placements each'},
  {key:'famosa', name:'Famosa 7oz Urban Market – (5) Placements per Rep', shortName:'Famosa 7oz', weight:0.10, type:'placements', hasData:true, goalLabel:'5 placements each'},
  {key:'disruptors', name:'Disruptors – (3) Bin Stackers/Racks in iSellBeer', shortName:'Disruptors', weight:0.20, type:'photos', hasData:false},
];

// August's objectives are entirely different brands/rules from July's (per
// Kohler, 2026-08-04) -- see generate_2026-08.py for the "90-Day Non-Buy"
// new-placement classification (Molson Coors Peroni/Banquet, and each Wine
// & Spirits brand family, all independently). Molson Coors and Wine &
// Spirits are both "dual" objectives -- N brand-family sub-targets that
// must ALL be hit for the objective to count as achieved (confirmed with
// Gavin 2026-08-04: Molson Coors both required, Wine & Spirits all three
// required), not a combined pool. BBC Lytt is a "pct_of_base" objective --
// each rep's target is 25% of their OWN account-base size (not a fixed
// number), computed client-side from the Sales Reps' Customer Base export.
const OBJECTIVES_2026_08 = [
  {key:'corona_premier', name:'Constellation – (5) Corona Premier Suitcase Placements', shortName:'Corona Premier', weight:0.30, type:'placements', hasData:true, goalLabel:'5 placements each'},
  {key:'bbc_lytt', name:'BBC – Achieve Distro Lytt 25% of Account Base', shortName:'BBC Lytt', weight:0.30, type:'pct_of_base', hasData:true, goalLabel:'25% of account base'},
  {key:'molson_coors', name:'Molson Coors – (4) New Peroni Placements, (4) New Banquet Placements (90-Day Non-Buy)', shortName:'Molson Coors', weight:0.15, type:'dual', hasData:true, goalLabel:'4 Peroni + 4 Banquet each',
    subs:[{key:'peroni', label:'Peroni', match:'peroni', target:4, flagLabel:'New Placement'}, {key:'banquet', label:'Banquet', match:'coors', target:4, flagLabel:'New Placement'}]},
  {key:'wine_spirits', name:'Wine & Spirits – (5) New Placements: (2) Le Grand Wines, (2) Leyenda, (1) Green River 50 mLs (90-Day Non-Buy)', shortName:'Wine & Spirits', weight:0.15, type:'dual', hasData:true, goalLabel:'2 Le Grand + 2 Leyenda + 1 Green River',
    subs:[{key:'le_grand', label:'Le Grand Noir', match:'grand', target:2, flagLabel:'New Placement'}, {key:'leyenda', label:'Leyenda 1925', match:'leyenda', target:2, flagLabel:'New Placement'}, {key:'green_river', label:'Green River', match:'green river', target:1, flagLabel:'New Placement'}]},
  // Photos objective went live 2026-08-19 (per Gavin): counted in DISTINCT
  // photos, not photo-bearing rows -- several SKU rows sharing one photo
  // link are ONE pic toward the 8. Sales Reps only; every line must carry
  // a clickable photo (generate_lytt_pos.py enforces both).
  {key:'disruptors', name:'Disruptors – (8) Lytt POS Items Pics in iSellBeer', shortName:'Disruptors', weight:0.10, type:'photos', hasData:true, goalLabel:'8 POS item pics each'},
];

// Each entry is a permanent monthly snapshot -- add a new one here (and a
// matching generate_<key>.py, and its own objectives list above) once a new
// month's RDE exports are ready. Earlier months stay viewable forever.
// MONTHS[MONTHS.length-1] is the default/active tab on page load, so the
// most-recently-added month should stay last in this array.
const MONTHS = [
  {key:'2026-07', label:'July 2026', dir:'data/2026-07/', objectives: OBJECTIVES_2026_07, tables: [
    {objKey:'new_belgium', special:'new_belgium', actualsFile:'mpo_new_belgium_actuals.json', goalsFile:'mpo_new_belgium_90goals.json'},
    {objKey:'ws_2xo', file:'mpo_wine_spirits_2xo.json', target:4, builder:'placements'},
    {objKey:'sapporo_light', file:'mpo_sapporo_light.json', target:5, builder:'placements'},

      targetsFile:'mpo_targets_molson_coors.json', targetsBrandField:'BRAND_FAMILY'},
    {objKey:'wine_spirits', file:'mpo_wine_spirits.json', dual:true, brandField:'BRAND_FAMILY',

  ]},

let activeMonth = MONTHS[MONTHS.length-1].key;

// ---- Snowflake JSON -> DATA builder ----
// Column names in the synced tables aren't guaranteed, so match by
// tokenized header words instead of position/exact-name (same approach
// used for the on-prem MPO tracker).
function tokens(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);}
function wordMatches(tok,w){return tok===w||(w.length>=4&&tok.startsWith(w))||(tok.length>=4&&w.startsWith(tok));}
function findCol(row, candidateWordSets){
  const keys=Object.keys(row);
  for(const words of candidateWordSets){
    const hit=keys.find(k=>{const t=tokens(k);return words.every(w=>t.some(tok=>wordMatches(tok,w)));});
    if(hit) return hit;
  }
  return null;
}
function parseDateMs(s){const d=new Date(s);return isNaN(d)?0:d.getTime();}
function truthyFlag(v){const s=String(v==null?"":v).trim().toLowerCase();return s==="1"||s==="true"||s==="y"||s==="yes";}
// Pulls a SKU-like numeric code (3+ digits) out of either a dedicated
// product-number column or a combined "12345 Product Name ..." string.
// Package sizes ("2/12/12 oz Can") never contain a 3+ digit run, so this
// doesn't false-match on those.
function extractProductNum(s){const m=String(s||"").match(/\d{3,}/);return m?m[0]:null;}

const REP_COLS=[["rep","name"],["rep"]];
const CUSTOMER_COLS=[["customer","name"],["account","name"],["customer"],["account"],["location"]];
const CUSTOMER_NUM_COLS=[["customer","num"],["customer","id"],["account","num"]];
const DATE_COLS=[["date"]];
const NEWBUYER_COLS=[["new","buyer"],["is","new"],["new","placement"]];
const PERIOD_COLS=[["period"]];
const BRAND_COLS=[["brand","family"],["brand"]];
const PRODUCT_COLS=[["product","name"],["product","desc"],["product"],["brand"],["item"]];
const COUNT_COLS=[["count"],["qty"],["quantity"],["cases"],["units"]];
const PACKAGE_COLS=[["package","group"],["package"],["pack"]];
const PLACEMENTS_COLS=[["placement"]];
const GOAL_COLS=[["goal"]];

// Header-name matching breaks down for columns like "Product #" — the "#"
// is stripped by tokens(), leaving just "product", indistinguishable from
// a product-NAME column by name alone. Classify by sampled VALUES instead:
// a "product"/"item"/"sku"-tokened column whose values are mostly numeric
// is the number column; a same-topic column with mostly non-numeric values
// is the name column. Sidesteps header-spelling guesswork entirely.
function isNumericValue(v){if(v==null) return false; const s=String(v).trim(); return s!==""&&/^-?\d+(\.\d+)?$/.test(s);}
function findProductNumNameCols(rows){
  const keys=Object.keys(rows[0]);
  const candidates=keys.filter(k=>{const t=tokens(k);return t.some(tok=>wordMatches(tok,"product")||wordMatches(tok,"item")||wordMatches(tok,"sku"));});
  const sample=rows.slice(0,Math.min(25,rows.length));
  let numCol=null, nameCol=null;
  candidates.forEach(k=>{
    const vals=sample.map(r=>r[k]).filter(v=>v!=null&&String(v).trim()!=="");
    const numericCount=vals.filter(isNumericValue).length;
    const mostlyNumeric=vals.length>0&&numericCount>=Math.ceil(vals.length*0.8);
    if(mostlyNumeric){ if(!numCol) numCol=k; } else { if(!nameCol) nameCol=k; }
  });
  return {numCol, nameCol};
}

function buildPlacementsDataset(rows, target){
  if(!Array.isArray(rows)||!rows.length) return null;
  const repCol=findCol(rows[0],REP_COLS), prodCol=findCol(rows[0],PRODUCT_COLS),
        custCol=findCol(rows[0],CUSTOMER_COLS), dateCol=findCol(rows[0],DATE_COLS),
        countCol=findCol(rows[0],COUNT_COLS), brandCol=findCol(rows[0],BRAND_COLS);
  if(!repCol||!prodCol||!custCol||!dateCol||!countCol) return null;
  const byRep=new Map();
  rows.forEach(r=>{
    const rep=String(r[repCol]||"").trim(); if(!rep) return;
    if(!byRep.has(rep)) byRep.set(rep,[]);
    const n=parseFloat(r[countCol]);
    const line={product:String(r[prodCol]||"").trim(), customer:String(r[custCol]||"").trim(), date:String(r[dateCol]||"").trim(), count:isNaN(n)?1:n};
    if(brandCol) line.brand=String(r[brandCol]||"").trim();
    byRep.get(rep).push(line);
  });
  const reps=[];
  byRep.forEach((lines,rep)=>{
    lines.sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date));
    const count=lines.reduce((s,l)=>s+l.count,0);
    reps.push({rep, count, lines});
  });
  const reps_at_goal=ROSTER.filter(name=>{const r=reps.find(x=>x.rep===name);return r?r.count>=target:false;}).length;
  return {target_per_rep:target, reps, reps_at_goal, reps_total:ROSTER.length};
}

function buildNewAccountsDataset(rows, target){
  if(!Array.isArray(rows)||!rows.length) return null;
  const repCol=findCol(rows[0],REP_COLS), custCol=findCol(rows[0],CUSTOMER_COLS),
        dateCol=findCol(rows[0],DATE_COLS), flagCol=findCol(rows[0],NEWBUYER_COLS),
        periodCol=findCol(rows[0],PERIOD_COLS), prodCol=findCol(rows[0],PRODUCT_COLS);
  if(!repCol||!custCol||!dateCol||!flagCol) return null;
  const byRep=new Map();
  rows.forEach(r=>{
    const rep=String(r[repCol]||"").trim(); if(!rep) return;
    if(!byRep.has(rep)) byRep.set(rep,[]);
    byRep.get(rep).push({customer:String(r[custCol]||"").trim(), date:String(r[dateCol]||"").trim(), new_buyer: truthyFlag(r[flagCol])?"1":"0", period: periodCol?String(r[periodCol]||"").trim().toLowerCase():"", product: prodCol?String(r[prodCol]||"").trim():""});
  });
  const reps=[];
  byRep.forEach((lines,rep)=>{
    lines.sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date));
    const qualLines=lines.filter(l=>l.new_buyer==="1");
    reps.push({rep, qualifying:qualLines.length, accounts:qualLines.map(l=>l.customer), lines});
  });
  const reps_at_goal=ROSTER.filter(name=>{const r=reps.find(x=>x.rep===name);return r?r.qualifying>=target:false;}).length;
  return {target_per_rep:target, reps, reps_at_goal, reps_total:ROSTER.length};
}

// Per-rep VARIABLE target: each rep's target is ceil(pct * their own
// distinct account-base size), not a fixed number across reps (BBC Lytt --
// 25% of account base). baseRows is the denominator source (one row per
// rep/account, possibly duplicated per shipping address -- deduped here by
// customer number); numRows is the numerator source (one row per rep/
// account/product carrying the tracked brand). A rep with no base-file
// rows is skipped entirely (rather than assumed to have a target of 0).
function buildPctOfBaseDataset(baseRows, numRows, pct){
  if(!Array.isArray(baseRows)||!baseRows.length) return null;
  const bRepCol=findCol(baseRows[0],REP_COLS), bNumCol=findCol(baseRows[0],CUSTOMER_NUM_COLS);
  if(!bRepCol||!bNumCol) return null;
  const baseByRep=new Map();
  baseRows.forEach(r=>{
    const rep=String(r[bRepCol]||"").trim(); if(!rep) return;
    if(!baseByRep.has(rep)) baseByRep.set(rep,new Set());
    baseByRep.get(rep).add(String(r[bNumCol]||"").trim());
  });
  const numByRep=new Map();
  if(Array.isArray(numRows)&&numRows.length){
    const nRepCol=findCol(numRows[0],REP_COLS), nNumCol=findCol(numRows[0],CUSTOMER_NUM_COLS),
          nNameCol=findCol(numRows[0],CUSTOMER_COLS), nProdCol=findCol(numRows[0],PRODUCT_COLS);
    numRows.forEach(r=>{
      const rep=String(r[nRepCol]||"").trim(); if(!rep) return;
      if(!numByRep.has(rep)) numByRep.set(rep,[]);
      numByRep.get(rep).push({
        customer_num: nNumCol?String(r[nNumCol]||"").trim():"",
        customer: nNameCol?String(r[nNameCol]||"").trim():"",
        product: nProdCol?String(r[nProdCol]||"").trim():"",
      });
    });
  }
  const reps=[];
  baseByRep.forEach((accountSet,rep)=>{
    const base=accountSet.size;
    const target=Math.max(1,Math.ceil(base*pct));
    const lines=numByRep.get(rep)||[];
    const qualifyingSet=new Set(lines.map(l=>l.customer_num));
    reps.push({rep, base, target, qualifying:qualifyingSet.size, accounts:[...qualifyingSet], lines});
  });
  const reps_at_goal=ROSTER.filter(name=>{const r=reps.find(x=>x.rep===name);return r?r.qualifying>=r.target:false;}).length;
  return {pct, reps, reps_at_goal, reps_total:ROSTER.length};
}

// Lytt POS photos (Disruptors): rows come from generate_lytt_pos.py with
// fixed keys (REP/SOURCE/CUSTOMER_NAME/CITY/BRAND/DETAIL/QUANTITY/DATE/
// PHOTO_URL), one row per photographed POS item, every row guaranteed to
// carry a photo link. A rep's progress toward the 8 is DISTINCT photo
// links (per Gavin 2026-08-19), not rows -- one photo showing five items
// is one pic.
function buildPhotosDataset(rows, target){
  if(!Array.isArray(rows)||!rows.length) return null;
  const byRep=new Map();
  rows.forEach(r=>{
    const rep=String(r.REP||"").trim();
    if(!rep||!r.PHOTO_URL) return;
    if(!byRep.has(rep)) byRep.set(rep,[]);
    byRep.get(rep).push({source:String(r.SOURCE||""), customer:String(r.CUSTOMER_NAME||""), city:String(r.CITY||""),
      brand:String(r.BRAND||""), detail:String(r.DETAIL||""), qty:r.QUANTITY==null?"":String(r.QUANTITY),
      date:String(r.DATE||""), photo:String(r.PHOTO_URL)});
  });
  const reps=[];
  byRep.forEach((lines,rep)=>{
    lines.sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date));
    const count=new Set(lines.map(l=>l.photo)).size;
    reps.push({rep, count, lines});
  });
  const reps_at_goal=ROSTER.filter(name=>{const r=reps.find(x=>x.rep===name);return r?r.count>=target:false;}).length;
  return {target_per_rep:target, reps, reps_at_goal, reps_total:ROSTER.length};
}

const BUILDERS = {new_accounts: buildNewAccountsDataset, placements: buildPlacementsDataset, photos: buildPhotosDataset};

const AREA_COLS=[["area"]];

// Target-account rows (prospects who don't carry the brand -- or, for
// Molson Coors, a specific product -- yet, in the off-premise core
// territory -- see generate_2026-08.py's build_targets()/
// build_targets_by_product()) grouped by rep, keyed by rep name for
// direct lookup at render time. Molson Coors' rows carry a Product Num/
// Name (Corona Premier's don't), which targetsBlockHtml() uses to decide
// whether to group by product or by county.
function groupTargetsByRep(rows){
  if(!Array.isArray(rows)||!rows.length) return {};
  const repCol=findCol(rows[0],REP_COLS), custCol=findCol(rows[0],CUSTOMER_COLS),
        areaCol=findCol(rows[0],AREA_COLS), prodCol=findCol(rows[0],PRODUCT_COLS);
  if(!repCol||!custCol) return {};
  const by={};
  rows.forEach(r=>{
    const rep=String(r[repCol]||"").trim(); if(!rep) return;
    if(!by[rep]) by[rep]=[];
    by[rep].push({customer:String(r[custCol]||"").trim(), area:areaCol?String(r[areaCol]||"").trim():"", product:prodCol?String(r[prodCol]||"").trim():""});
  });
  return by;
}

// Fixed display order for the core-market counties (matches how Gavin
// always lists them); anything else sorts after, alphabetically. Same
// list as on-prem's ALLOWED_TARGET_COUNTIES/COUNTY_ORDER -- off-prem's
// core territory (sales_reps_customer_base_core.csv) covers this same
// set of counties.
const COUNTY_ORDER = ['Bergen','Passaic','Passaic-FF','Morris 1','Morris 3','Sussex'];
function groupTargetsByCounty(targets){
  const groups = new Map();
  targets.forEach(t=>{
    const key = t.area || 'Other';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  });
  return [...groups.entries()]
    .map(([name, items])=>({name, items: items.slice().sort((a,b)=>a.customer.localeCompare(b.customer))}))
    .sort((a,b)=>{
      const ai=COUNTY_ORDER.indexOf(a.name), bi=COUNTY_ORDER.indexOf(b.name);
      if(ai!==-1||bi!==-1) return (ai===-1?99:ai)-(bi===-1?99:bi);
      return a.name.localeCompare(b.name);
    });
}

// Molson Coors' Target Accounts groups by PRODUCT instead of county --
// per Kohler's manager (2026-08-05), the 90-day-non-buy incentive is
// scored per SKU, so a rep needs to know exactly which product to sell
// in at an account, not just that the account is "missing Peroni".
// Alphabetical by product name; each group lists the accounts (with
// their county, since that's still useful context, just not the grouping
// key here) that haven't carried that exact SKU.
function groupTargetsByProduct(targets){
  const groups = new Map();
  targets.forEach(t=>{
    const key = t.product || 'Other';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  });
  return [...groups.entries()]
    .map(([name, items])=>({name, items: items.slice().sort((a,b)=>a.customer.localeCompare(b.customer))}))
    .sort((a,b)=>a.name.localeCompare(b.name));
}

// Collapsed-by-default, both at the "N Target Accounts" level and per
// group within it -- a rep's full prospect list can run to 100+ rows, so
// grouping (and keeping every group closed until tapped) is what keeps
// this scannable on an iPad instead of one long undifferentiated list --
// mirrors on-prem's Target Accounts treatment. Reuses the same
// .tgt-county* classes for both grouping modes since the visual pattern
// is identical, just the grouping key (product vs. county) differs.
function targetsBlockHtml(targets, brandLabel){
  if(!targets || !targets.length) return '';
  const tid = 'tgt'+(uid++);
  const byProduct = targets.some(t=>t.product);
  const groups = byProduct ? groupTargetsByProduct(targets) : groupTargetsByCounty(targets);
  const groupsHtml = groups.map(g=>{
    const gid = 'tgtc'+(uid++);
    const rows = g.items.map(t=>`<tr><td>${t.customer}</td>${byProduct?`<td>${t.area}</td>`:''}</tr>`).join('');
    return `<div class="tgt-county">
      <div class="tgt-county-toggle" data-target="${gid}"><span class="tgt-county-chev">▶</span>${g.name}<span class="tgt-county-count">${g.items.length}</span></div>
      <div class="tgt-county-table" id="${gid}"><div class="rep-sub-inner" style="padding-left:2px"><table>${byProduct?'<thead><tr><th>Customer</th><th>Area</th></tr></thead>':''}<tbody>${rows}</tbody></table></div></div>
    </div>`;
  }).join('');
  // Product mode: the header count is DISTINCT accounts missing at least
  // one SKU, not the (much larger) account+product row count -- a rep
  // cares "how many of my accounts have a gap", not how many rows exist.
  const count = byProduct ? new Set(targets.map(t=>t.customer)).size : targets.length;
  const hint = byProduct
    ? `— missing at least one ${brandLabel} product; expand a product below to see who`
    : `— don't carry ${brandLabel} yet, in your core territory`;
  return `<div class="targets-block">
    <div class="targets-toggle" data-target="${tid}"><span class="targets-chev">▶</span>${count} Target Account${count===1?'':'s'}<span class="targets-hint">${hint}</span></div>
    <div class="targets-table" id="${tid}">${groupsHtml}</div>
  </div>`;
}
document.addEventListener('click', e=>{
  const header = e.target.closest('.targets-toggle, .tgt-county-toggle');
  if(!header) return;
  header.classList.toggle('open');
  document.getElementById(header.dataset.target)?.classList.toggle('open');
});

// Joins the flat actuals export (rep/package/product/placements) against
// the long-format goals export (rep/product#/product name/package/GOAL90)
// by rep + product number (falling back to rep + normalized product name
// if either side lacks a parseable product number), NOT by row position.
// The actuals export only contains rows for products with placement
// activity, so a rep/product with zero placements this period has no
// actuals row at all -- those goal rows are backfilled below (as
// zero-placement lines) so group/rep goal totals reflect the full
// assigned goal, not just the goal for products with recorded activity.
function buildNewBelgiumDataset(actualRows, goalRows){
  if(!Array.isArray(actualRows)||!actualRows.length||!Array.isArray(goalRows)||!goalRows.length) return null;
  const aRepCol=findCol(actualRows[0],REP_COLS), aPkgCol=findCol(actualRows[0],PACKAGE_COLS),
        aProdCol=findCol(actualRows[0],PRODUCT_COLS), aPlaceCol=findCol(actualRows[0],PLACEMENTS_COLS);
  const {numCol:gNumCol, nameCol:gNameCol}=findProductNumNameCols(goalRows);
  const gRepCol=findCol(goalRows[0],REP_COLS), gPkgCol=findCol(goalRows[0],PACKAGE_COLS),
        gGoalCol=findCol(goalRows[0],GOAL_COLS);
  if(!aRepCol||!aProdCol||!aPlaceCol||!gRepCol||!gGoalCol||(!gNumCol&&!gNameCol)) return null;

  // The goals export has no package-group field (it has a Package Type
  // string like "1/15/19.2 oz Can" instead) -- build a global product ->
  // package-group lookup from the actuals export (whichever rep/rows have
  // it) so zero-placement goal rows can still be bucketed into the right
  // group.
  const groupByNum=new Map(), groupByName=new Map();
  actualRows.forEach(r=>{
    const productRaw=String(r[aProdCol]||"").trim();
    const pkg=aPkgCol?String(r[aPkgCol]||"").trim():"";
    if(!pkg) return;
    const num=extractProductNum(productRaw);
    if(num && !groupByNum.has(num)) groupByNum.set(num,pkg);
    const nameKey=tokens(productRaw).join(" ");
    if(nameKey && !groupByName.has(nameKey)) groupByName.set(nameKey,pkg);
  });

  const goalList=[];
  goalRows.forEach(r=>{
    const rep=String(r[gRepCol]||"").trim(); if(!rep) return;
    const goal=parseFloat(r[gGoalCol]); if(isNaN(goal)) return;
    const num=gNumCol?extractProductNum(r[gNumCol]):null;
    const rawName=gNameCol?String(r[gNameCol]||"").trim():"";
    const nameKey=rawName?tokens(rawName).join(" "):null;
    const pkgType=gPkgCol?String(r[gPkgCol]||"").trim():"";
    const displayProduct=[num,rawName,pkgType].filter(Boolean).join(" ");
    const package_group=(num&&groupByNum.get(num))||(nameKey&&groupByName.get(nameKey))||"";
    goalList.push({rep, num, nameKey, goal90:goal, package_group, displayProduct});
  });
  const goalMap=new Map();
  goalList.forEach(g=>{
    if(g.num) goalMap.set(g.rep+"|n:"+g.num, g);
    if(g.nameKey && !goalMap.has(g.rep+"|t:"+g.nameKey)) goalMap.set(g.rep+"|t:"+g.nameKey, g);
  });

  const byRep=new Map();
  function repLineMap(rep){ if(!byRep.has(rep)) byRep.set(rep,new Map()); return byRep.get(rep); }

  let unmatched=0;
  actualRows.forEach(r=>{
    const rep=String(r[aRepCol]||"").trim(); if(!rep) return;
    const productRaw=String(r[aProdCol]||"").trim();
    const placementsRaw=parseFloat(r[aPlaceCol]);
    const placements=isNaN(placementsRaw)?0:placementsRaw;
    const pkg=aPkgCol?String(r[aPkgCol]||"").trim():"";
    const num=extractProductNum(productRaw);
    const nameKey=tokens(productRaw).join(" ");
    const g=(num&&goalMap.get(rep+"|n:"+num))||goalMap.get(rep+"|t:"+nameKey);
    if(!g) unmatched++;
    const goal90=g?g.goal90:0;
    const pct=goal90>0?Math.round((placements/goal90*100)*10)/10:0;
    const matchKey=g?(g.num?"n:"+g.num:"t:"+g.nameKey):"raw:"+nameKey;
    repLineMap(rep).set(matchKey, {package_group:pkg||(g&&g.package_group)||"", product:productRaw, placements, goal90, pct});
  });
  if(unmatched) console.warn('New Belgium: '+unmatched+' actual rows had no matching goal row (rep+product could not be joined)');

  // Backfill any goal row with no actuals this period as a zero-placement line.
  goalList.forEach(g=>{
    const matchKey=g.num?"n:"+g.num:"t:"+g.nameKey;
    const lines=repLineMap(g.rep);
    if(!lines.has(matchKey)){
      lines.set(matchKey, {package_group:g.package_group, product:g.displayProduct, placements:0, goal90:g.goal90, pct:0});
    }
  });

  const reps=[];
  let total_placements=0, total_goal90=0, reps_hit90=0;
  byRep.forEach((lineMap,rep)=>{
    const repLines=[...lineMap.values()];
    const placements=repLines.reduce((s,l)=>s+l.placements,0);
    const goal90=repLines.reduce((s,l)=>s+l.goal90,0);
    const pct=goal90>0?Math.round((placements/goal90*100)*10)/10:0;
    const hit90=goal90>0&&(placements/goal90)>=0.9;
    total_placements+=placements; total_goal90+=goal90;
    if(hit90) reps_hit90++;
    reps.push({rep, placements, goal90, pct, hit90, lines:repLines});
  });
  const company_pct=total_goal90>0?Math.round((total_placements/total_goal90*100)*10)/10:0;
  return {company_pct, total_placements, total_goal90, reps_hit90, reps_total:ROSTER.length, reps};
}

function showDataError(msg){
  document.getElementById('kpi-strip').innerHTML='';
  document.getElementById('objectives').innerHTML=`<div class="empty-obj"><div>${msg}</div></div>`;
}

function renderMonthBar(){
  const bar = document.getElementById('monthbar');
  bar.innerHTML = MONTHS.map(m=>`<button class="monthtab${m.key===activeMonth?' active':''}" data-month="${m.key}">${m.label}</button>`).join('');
  bar.querySelectorAll('.monthtab').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.month===activeMonth) return;
    loadMonth(b.dataset.month);
    window.scrollTo({top:0,behavior:'smooth'});
  }));
}

async function loadMonth(monthKey){
  const month = MONTHS.find(m=>m.key===monthKey);
  if(!month) return;
  activeMonth = monthKey;
  OBJECTIVES = month.objectives;
  DATA = {};
  activeRep = null;
  renderMonthBar();
  document.getElementById('eyebrow').textContent = `Off-Premise · ${month.label}`;
  document.title = `Off-Prem MPO Tracker | ${month.label}`;
  document.getElementById('updated-line').innerHTML = '';

  const cb="?_="+Date.now();
  async function loadJSON(file){
    try{
      const res=await fetch(month.dir+file+cb,{cache:"no-store"});
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  for(const t of month.tables){
    try{
      if(t.special==='new_belgium'){
        const [actuals, goals] = await Promise.all([loadJSON(t.actualsFile), loadJSON(t.goalsFile)]);
        if(actuals && goals){
          const built=buildNewBelgiumDataset(actuals, goals);
          if(built) DATA[t.objKey]=built;
        }
        continue;
      }
      if(t.special==='pct_of_base'){
        const [baseRows, numRows] = await Promise.all([loadJSON(t.baseFile), loadJSON(t.numFile)]);
        if(baseRows){
          const built=buildPctOfBaseDataset(baseRows, numRows||[], t.pct);
          if(built){
            DATA[t.objKey]=built;
            if(t.targetsFile){
              const trows=await loadJSON(t.targetsFile);
              if(trows) built.targetsByRep=groupTargetsByRep(trows);
            }
          }
        }
        continue;
      }
      const rows=await loadJSON(t.file);
      if(!rows) continue;
      const builder=BUILDERS[t.builder];
      if(t.dual){
        const subs=t.subs.map(s=>{
          const subRows=rows.filter(r=>String(r[t.brandField]||"").toLowerCase().includes(s.match));
          const built=builder(subRows, s.target);
          return {...s, ...(built||{reps:[],reps_at_goal:0,reps_total:ROSTER.length,target_per_rep:s.target})};
        });
        const reps_at_goal=ROSTER.filter(name=>subs.every(s=>{
          const r=s.reps.find(x=>x.rep===name);
          return r?r.qualifying>=s.target:false;
        })).length;
        DATA[t.objKey]={subs, reps_at_goal, reps_total:ROSTER.length};
      } else {
        const built=builder(rows, t.target);
        if(built) DATA[t.objKey]=built;
      }
      if(t.targetsFile && DATA[t.objKey]){
        const trows=await loadJSON(t.targetsFile);
        if(trows){
          if(t.dual){
            DATA[t.objKey].subs.forEach(s=>{
              const subRows=trows.filter(r=>String(r[t.targetsBrandField]||"").toLowerCase().includes(s.match));
              s.targetsByRep=groupTargetsByRep(subRows);
            });
          } else {
            DATA[t.objKey].targetsByRep=groupTargetsByRep(trows);
          }
        }
      }
    }catch(e){}
  }

  const missing=OBJECTIVES.filter(o=>o.hasData && !DATA[o.key]);
  if(missing.length){
    showDataError("Couldn't load synced MPO data. Check that "+month.dir+"mpo_*.json files exist with recognizable rep/customer columns.");
    return;
  }

  const meta=await loadJSON('sync_meta.json');
  if(meta && meta.synced_at){
    const d=new Date(meta.synced_at);
    const fmt=d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
    document.getElementById('updated-line').innerHTML=`<span class="livedot"></span> Data refreshed ${fmt}`;
  }

  renderKPIs();
  renderRepBar();
  renderMain();
}

function objPct(o){
  if(!o.hasData) return 0;
  if(o.key==='new_belgium') return Math.min(DATA.new_belgium.company_pct,100);
  const d = DATA[o.key];
  return d.reps_total ? (d.reps_at_goal/d.reps_total)*100 : 0;
}

function renderKPIs(){
  const strip = document.getElementById('kpi-strip');
  strip.innerHTML = '';
  const weighted = OBJECTIVES.reduce((s,o)=>s+o.weight*objPct(o),0);
  const kpis = [
    {label:'Weighted MPO Complete', val: weighted.toFixed(0)+'%', cls: weighted>=90?'good':(weighted>=50?'':'warn'), sub:`across all ${OBJECTIVES.length} objectives`},
  ];
  OBJECTIVES.forEach(o=>{
    if(!o.hasData) return;
    if(o.key==='new_belgium'){
      const d=DATA.new_belgium;
      kpis.push({label:(o.shortName||o.name)+' – Dist. Goal', val: d.company_pct.toFixed(1)+'%', cls: d.company_pct>=100?'good':'warn', sub: d.reps_hit90+' / '+d.reps_total+' reps at goal'});
      return;
    }
    const d = DATA[o.key];
    kpis.push({label:(o.shortName||o.name)+' – Reps at Goal', val: d.reps_at_goal+' / '+d.reps_total, cls:'warn', sub:o.goalLabel||''});
  });
  kpis.forEach(k=>{
    const el = document.createElement('div');
    el.className='kpi';
    el.innerHTML = `<div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div><div class="kpi-sub">${k.sub}</div>`;
    strip.appendChild(el);
  });
}

function allReps(){
  return ROSTER.slice().sort();
}
function repFind(objKey, rep){ return DATA[objKey].reps.find(r=>r.rep===rep); }

// Sort New Belgium product lines so incomplete (not yet at goal) show first, worst first
function sortNBLines(lines){
  return lines.slice().sort((a,b)=>{
    const ah = a.pct>=90?1:0, bh = b.pct>=90?1:0;
    if(ah!==bh) return ah-bh;
    return a.pct-b.pct;
  });
}
function nbPctCell(pct){
  return pct>=90 ? '<span class="complete-tag">At Goal</span>' : pct.toFixed(1)+'%';
}
// Groups a rep's product lines by package type, sorting each group's
// products incomplete-first/worst-first (same rule as sortNBLines), and
// puts groups with anything still below goal ahead of fully-at-goal
// groups so the rep's outstanding work still surfaces first overall.
function groupNBLines(lines){
  const groups = new Map();
  lines.forEach(l=>{
    const key = l.package_group || 'Other';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l);
  });
  return [...groups.entries()]
    .map(([name, items])=>{
      const sorted = sortNBLines(items);
      const totalPlacements = sorted.reduce((s,l)=>s+l.placements,0);
      const totalGoal90 = sorted.reduce((s,l)=>s+l.goal90,0);
      return {name, items: sorted, hasIncomplete: sorted.some(l=>l.pct<90), totalPlacements, totalGoal90};
    })
    .sort((a,b)=> a.hasIncomplete===b.hasIncomplete ? a.name.localeCompare(b.name) : (a.hasIncomplete?-1:1));
}
function nbLineTable(lines){
  const body = groupNBLines(lines).map(g=>{
    const gid = 'nbg'+(uid++);
    const header = `<tr class="pkg-group-row" data-group="${gid}"><td><span class="pkg-chev">▼</span>${g.name}</td><td class="num">${g.totalPlacements}</td><td class="num">${g.totalGoal90}</td><td class="num"></td></tr>`;
    const rows = g.items.map(l=>`<tr class="pkg-item-row ${gid} ${l.pct<90?'focus-row':''}"><td>${l.product}</td><td class="num">${l.placements}</td><td class="num">${l.goal90}</td><td class="num">${nbPctCell(l.pct)}</td></tr>`).join('');
    return header+rows;
  }).join('');
  return `<table><thead><tr><th>Product</th><th class="num">Placements</th><th class="num">100% Goal</th><th class="num">% to Goal</th></tr></thead><tbody>${body}</tbody></table>`;
}
// Delegated once for the whole page -- covers package-group headers however

function lineTablePlacements(lines){
  if(!lines || lines.length===0) return '<div class="no-lines">No activity recorded this month.</div>';
  const rows = lines.map(l=>`<tr><td>${l.product}</td><td>${l.customer}</td><td>${l.date}</td><td class="num">${l.count}</td></tr>`).join('');
  return `<div class="rep-sub-inner" style="padding-left:2px"><table><thead><tr><th>Product</th><th>Customer</th><th>Date</th><th class="num">Count</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
// Raw lines carry one row per historical transaction (going back to May so
// the 90-day-non-buy classifier has purchase history to check), but a rep
// doesn't need every prior date -- just when an account/product last
// bought in the base (90-day non-buy) period vs. the current month, and
// what that means. Molson Coors/Wine & Spirits both carry a PERIOD field
// (base/current) per line -- mirrors on-prem's identical treatment:
//   New Buyer            -- bought this month, never in the base period.
//                            Eligible for this incentive.
//   Repeat Buyer          -- bought in BOTH the base period and this
//                            month. Not new, but actively reordering.
//   Bought in Base Period -- bought in the base period only, no
//                            this-month purchase yet. Already carries the
//                            brand, not an incentive-eligible target.
// Only New Buyers are shown directly -- Repeat Buyers and Bought-in-Base-
// Period accounts already carry the brand, so they're tucked behind the
// same collapsed-dropdown pattern as Target Accounts instead of cluttering
// the default view (same cleanup as on-prem's).
//
// Rows are deduped by (customer, product) rather than customer alone when
// product info is present -- Molson Coors' new-placement classification is
// now per PRODUCT (see generate_2026-08.py), so a single account can carry
// several independent new-vs-existing statuses (one per SKU) in the same
// Peroni/Banquet sub-table; collapsing by customer alone would silently
// merge separate new placements into one row.
function isActiveMonthDate(dateStr){
  return typeof dateStr==='string' && dateStr.startsWith(activeMonth);
}
function lineTableNewAccounts(lines, flagLabel, targetsHtml){
  flagLabel = flagLabel || 'New Buyer';
  targetsHtml = targetsHtml || '';
  if(!lines || lines.length===0) return `<div class="no-lines">No activity recorded this month.</div>${targetsHtml}`;
  const hasPeriods = lines.some(l=>l.period==='base'||l.period==='current');
  const hasProduct = lines.some(l=>l.product);
  const keyOf = l => hasProduct ? (l.customer+''+l.product) : l.customer;

  if(!hasPeriods){
    const byKey = new Map();
    lines.forEach(l=>{
      const k=keyOf(l);
      if(!byKey.has(k)) byKey.set(k, {customer:l.customer, product:l.product, isNew:false, activeDate:null});
      const c = byKey.get(k);
      if(l.new_buyer==='1') c.isNew = true;
      if(isActiveMonthDate(l.date) && (!c.activeDate || l.date>c.activeDate)) c.activeDate = l.date;
    });
    const rows = [...byKey.values()]
      .sort((a,b)=> (b.isNew-a.isNew) || (b.activeDate||'').localeCompare(a.activeDate||'') || a.customer.localeCompare(b.customer))
      .map(c=>{
        const status = c.isNew ? `<span class="flag-hit">✓ ${flagLabel}</span>` : (c.activeDate ? '<span class="flag-miss">Regular Buyer</span>' : '<span class="flag-miss">—</span>');
        return `<tr>${hasProduct?`<td>${c.product}</td>`:''}<td>${c.customer}</td><td>${c.activeDate||''}</td><td>${status}</td></tr>`;
      }).join('');
    return `<div class="rep-sub-inner" style="padding-left:2px"><table><thead><tr>${hasProduct?'<th>Product</th>':''}<th>Customer</th><th>Date</th><th>Qualifies</th></tr></thead><tbody>${rows}</tbody></table>${targetsHtml}</div>`;
  }

  const byKey = new Map();
  lines.forEach(l=>{
    const k=keyOf(l);
    if(!byKey.has(k)) byKey.set(k, {customer:l.customer, product:l.product, isNew:false, baseDate:null, currentDate:null});
    const c = byKey.get(k);
    if(l.new_buyer==='1') c.isNew = true;
    if(l.period==='current' && (!c.currentDate || l.date>c.currentDate)) c.currentDate = l.date;
    if(l.period==='base' && (!c.baseDate || l.date>c.baseDate)) c.baseDate = l.date;
  });
  const all = [...byKey.values()];

  const newOnes = all.filter(c=>c.isNew)
    .sort((a,b)=> (b.currentDate||'').localeCompare(a.currentDate||'') || a.customer.localeCompare(b.customer));
  const existing = all.filter(c=>!c.isNew)
    .sort((a,b)=>{
      const rank = c => (c.baseDate && c.currentDate) ? 0 : 1; // Repeat Buyer before Bought in Base Period
      return rank(a)-rank(b) || (b.currentDate||b.baseDate||'').localeCompare(a.currentDate||a.baseDate||'') || a.customer.localeCompare(b.customer);
    });

  const newRowsHtml = newOnes.length
    ? `<table><thead><tr>${hasProduct?'<th>Product</th>':''}<th>Customer</th><th>Base Period</th><th>This Month</th><th>Status</th></tr></thead><tbody>${
        newOnes.map(c=>`<tr>${hasProduct?`<td>${c.product}</td>`:''}<td>${c.customer}</td><td>${c.baseDate||''}</td><td>${c.currentDate||''}</td><td><span class="flag-hit">✓ ${flagLabel}</span></td></tr>`).join('')
      }</tbody></table>`
    : `<div class="no-lines" style="padding:0">No new placements yet this month.</div>`;

  return `<div class="rep-sub-inner" style="padding-left:2px">${newRowsHtml}${targetsHtml}${existingAccountsBlockHtml(existing, hasProduct)}</div>`;
}
// Same collapsed-dropdown treatment as Target Accounts, for accounts that
// already carry the brand (Repeat Buyer or Bought in Base Period) -- kept
// available for full traceability, just not part of what a rep sees by
// default when they open the program.
function existingAccountsBlockHtml(existing, hasProduct){
  if(!existing.length) return '';
  const eid = 'exist'+(uid++);
  const rows = existing.map(c=>{
    // baseDate-only -> genuinely only bought in the base period. currentDate-only
    // (not new) can only happen for a customer+product/key that already had an
    // earlier current-period row claim the new-placement flag (e.g. two separate
    // transactions of the same product/key in the same month) -- that's a repeat
    // within this month, NOT "Bought in Base Period", which was the bug that hid
    // genuinely-new per-product placements (see generate_2026-08.py's docstring).
    const status = (c.baseDate && c.currentDate) ? 'Repeat Buyer'
      : c.baseDate ? 'Bought in Base Period'
      : 'Repeat This Month';
    return `<tr>${hasProduct?`<td>${c.product}</td>`:''}<td>${c.customer}</td><td>${c.baseDate||''}</td><td>${c.currentDate||''}</td><td><span class="flag-miss">${status}</span></td></tr>`;
  }).join('');
  return `<div class="targets-block">
    <div class="targets-toggle" data-target="${eid}"><span class="targets-chev">▶</span>${existing.length} Existing Account${existing.length===1?'':'s'}<span class="targets-hint">— already carry it, not eligible for new-placement credit</span></div>
    <div class="targets-table" id="${eid}"><table><thead><tr>${hasProduct?'<th>Product</th>':''}<th>Customer</th><th>Base Period</th><th>This Month</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}
// BBC Lytt's numerator file has no per-row Date (it's a distro snapshot,
// not a transaction log), so each line is just a Customer/Product pair.
// Grouped by Customer (collapsed by default, same .tgt-county* toggle
// pattern as Target Accounts) rather than one flat row per customer+product
// -- a rep can carry Lytt in several flavors at the same account, which
// made the old flat table run long and repeat the customer name on every
// row. Clicking a customer reveals just their products.
function lineTableLytt(lines){
  if(!lines || lines.length===0) return '<div class="no-lines">No Lytt-carrying accounts recorded this month.</div>';
  const byCustomer = new Map();
  lines.forEach(l=>{
    if(!byCustomer.has(l.customer)) byCustomer.set(l.customer, []);
    byCustomer.get(l.customer).push(l.product);
  });
  const customers = [...byCustomer.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const rows = customers.map(([customer, products])=>{
    const gid = 'tgtc'+(uid++);
    const prodRows = products.slice().sort().map(p=>`<tr><td>${p}</td></tr>`).join('');
    return `<div class="tgt-county">
      <div class="tgt-county-toggle" data-target="${gid}"><span class="tgt-county-chev">▶</span>${customer}<span class="tgt-county-count">${products.length}</span></div>
      <div class="tgt-county-table" id="${gid}"><div class="rep-sub-inner" style="padding-left:2px"><table><thead><tr><th>Product</th></tr></thead><tbody>${prodRows}</tbody></table></div></div>
    </div>`;
  }).join('');
  return `<div class="rep-sub-inner" style="padding-left:2px">${rows}</div>`;
}

// One table row per DISTINCT PHOTO (matching how the 8-pic target is
// counted), with every Lytt item pictured in it listed on that row --
// mirrors the display-auction tracker's photo-first, rep-grouped layout.
function lineTablePhotos(lines){
  if(!lines || lines.length===0) return '<div class="no-lines">No Lytt POS photos submitted yet this month.</div>';
  const byPhoto=new Map();
  lines.forEach(l=>{
    if(!byPhoto.has(l.photo)) byPhoto.set(l.photo,[]);
    byPhoto.get(l.photo).push(l);
  });
  const rows=[...byPhoto.values()].map(items=>{
    const f=items[0];
    const itemsHtml=items.map(l=>l.brand+(l.detail?` <span class="photo-sub">${l.detail}</span>`:'')+(l.qty&&l.qty!=='1'?` ×${l.qty}`:'')).join(', ');
    return `<tr><td><a class="photo-btn" href="${f.photo}" target="_blank" rel="noopener">📷 View Photo</a></td>`+
      `<td>${f.customer}${f.city?` <span class="photo-sub">· ${f.city}</span>`:''}</td>`+
      `<td>${itemsHtml}</td><td>${f.source}</td><td style="white-space:nowrap">${f.date||'—'}</td></tr>`;
  }).join('');
  return `<div class="rep-sub-inner" style="padding-left:2px"><table><thead><tr><th>Photo</th><th>Account</th><th>Lytt items pictured</th><th>Source</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

      head.className='obj-head static';
      if(!r){
        head.innerHTML = `<div class="obj-left"><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div></div><div class="empty-tag">No activity</div>`;
        card.appendChild(head);
        container.appendChild(card);
        return;
      }
      head.innerHTML = `
        <div class="obj-left">
          <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div>
          <div class="obj-bar-track"><div class="obj-bar-fill" style="width:${Math.min(r.pct,100)}%"></div></div>
        </div>
        <div class="obj-right"><div><div class="obj-progress-txt">${r.placements.toFixed(0)} / ${r.goal90.toFixed(0)}</div><div class="obj-progress-sub">Placements / Goal</div></div></div>`;
      card.appendChild(head);
      const body = document.createElement('div');
      body.className='obj-body';
      const inner = document.createElement('div');
      inner.className='obj-body-inner';
      inner.style.paddingTop='0';
      inner.innerHTML = nbLineTable(r.lines);
      body.appendChild(inner);
      card.appendChild(body);
      container.appendChild(card);
      return;
    }

    if(o.type==='photos'){
      const d = DATA[o.key];
      const target = d.target_per_rep;
      const r = repFind(o.key, activeRep);
      const val = r ? r.count : 0;
      const pct = Math.min(val/target,1)*100, hit = val>=target, over = val>target;
      const head = document.createElement('div');
      head.className='obj-head static';
      head.innerHTML = `
        <div class="obj-left">
          <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span><span class="goal-tag">${target} pics per rep</span></div>
          <div class="obj-bar-track"><div class="obj-bar-fill${over?' over':''}" style="width:${pct}%"></div></div>
        </div>
        <div class="obj-right"><div><div class="obj-progress-txt">${val} / ${target}${over?'<span class="over-badge">+'+(val-target)+' over</span>':''}</div><div class="obj-progress-sub">${hit?'<span class="flag-hit">✓ At goal</span>':'In progress'} · distinct photos</div></div></div>`;
      card.appendChild(head);
      const body = document.createElement('div');
      body.className='obj-body';
      const inner = document.createElement('div');
      inner.className='obj-body-inner';
      inner.style.paddingTop='0';
      inner.innerHTML = lineTablePhotos(r ? r.lines : []);
      body.appendChild(inner);
      card.appendChild(body);
      container.appendChild(card);
      return;
    }

    // placements type: sapporo_light / famosa
    const d = DATA[o.key];
    const target = d.target_per_rep;
    const r = repFind(o.key, activeRep);
    const head = document.createElement('div');
    head.className='obj-head static';
    if(d.reps_total===0){
      head.innerHTML = `<div class="obj-left"><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div></div><div class="empty-tag">No data yet</div>`;
      card.appendChild(head);
      container.appendChild(card);
      return;
    }
    const val = r ? r.count : 0;
    const pct = Math.min(val/target,1)*100;
    const hit = val>=target;
    const over = val>target;
    head.innerHTML = `
      <div class="obj-left">
        <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span><span class="goal-tag">${target} per rep</span></div>
        <div class="obj-bar-track"><div class="obj-bar-fill${over?' over':''}" style="width:${pct}%"></div></div>
      </div>
      <div class="obj-right"><div><div class="obj-progress-txt">${val} / ${target}${over?'<span class="over-badge">+'+(val-target)+' over</span>':''}</div><div class="obj-progress-sub">${hit?'<span class="flag-hit">✓ At goal</span>':'In progress'}</div></div></div>`;
    card.appendChild(head);
    const body = document.createElement('div');
    body.className='obj-body';
    const inner = document.createElement('div');
    inner.className='obj-body-inner';
    inner.style.paddingTop='0';
    inner.innerHTML = lineTablePlacements(r ? r.lines : []);
    if(d.targetsByRep){
      inner.innerHTML += targetsBlockHtml(d.targetsByRep[activeRep], o.shortName||o.name);
    }
    body.appendChild(inner);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function renderObjectiveView(){
  container.innerHTML = '';
  OBJECTIVES.forEach(o=>{
    const card = document.createElement('div');
    card.className='obj-card';

    if(!o.hasData){
      card.innerHTML = `
        <div class="empty-obj">
          <div><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div></div>
          <div class="empty-tag">No data yet</div>
        </div>`;
      container.appendChild(card);
      return;
    }

    if(o.type==='dual'){
      const d = DATA[o.key];
      const pct = objPct(o);
      const goalTagsHtml = d.subs.map(s=>`<span class="goal-tag">${s.label} ${s.target}</span>`).join('');
      const head = document.createElement('div');
      head.className='obj-head';
      head.innerHTML = `
        <div class="obj-left">
          <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span>${goalTagsHtml}</div>
          <div class="obj-bar-track"><div class="obj-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="obj-right">
          <div><div class="obj-progress-txt">${d.reps_at_goal} / ${d.reps_total}</div><div class="obj-progress-sub">reps at goal (all required)</div></div>
          <div class="chev">▶</div>
        </div>`;
      head.addEventListener('click',()=>card.classList.toggle('open'));
      card.appendChild(head);

      const body = document.createElement('div');
      body.className='obj-body';
      const inner = document.createElement('div');
      inner.className='obj-body-inner';

      const table = document.createElement('table');
      const headHtml = `<thead><tr><th>Rep</th>${d.subs.map(s=>`<th class="num">${s.label}</th>`).join('')}<th>Status</th></tr></thead>`;
      let bodyRows = '';
      ROSTER.forEach(repName=>{
        const subVals = d.subs.map(s=>{const r=s.reps.find(x=>x.rep===repName); return {sub:s, r, val:r?r.qualifying:0};});
        const hasAny = subVals.some(sv=>sv.r);
        const hasTargets = d.subs.some(s=>(s.targetsByRep||{})[repName]?.length);
        if(!hasAny && !hasTargets){
          bodyRows += `<tr class="rep-row-nodata"><td>${repName}</td>${d.subs.map(()=>'<td class="num">—</td>').join('')}<td><span class="flag-miss">No data</span></td></tr>`;
          return;
        }
        const rowId = 'row'+(uid++);
        const allHit = hasAny && subVals.every(sv=>sv.val>=sv.sub.target);
        const cells = subVals.map(sv=>{
          const rp=Math.min(sv.val/sv.sub.target,1)*100, over=sv.val>sv.sub.target;
          return `<td class="num"><span class="mini-bar-track"><span class="mini-bar-fill${over?' over':''}" style="width:${rp}%"></span></span>${sv.val} / ${sv.sub.target}${over?'<span class="over-badge">+'+(sv.val-sv.sub.target)+' over</span>':''}</td>`;
        }).join('');
        const statusHtml = !hasAny ? '<span class="flag-miss">No activity</span>' : (allHit?'<span class="flag-hit">✓ At goal</span>':'<span class="flag-miss">In progress</span>');
        bodyRows += `<tr class="rep-row" data-target="${rowId}"><td><span class="rep-chev">▶</span>${repName}</td>${cells}<td>${statusHtml}</td></tr>`;
        const subTables = d.subs.map((s,i)=>{
          const tgtHtml = targetsBlockHtml((s.targetsByRep||{})[repName], s.label);
          const val=subVals[i].val, over=val>s.target, hit=val>=s.target;
          const headHtml = `<div class="brand-group-head"><span class="brand-pill">${s.label}</span><span class="brand-group-progress">${val} / ${s.target}${over?'<span class="over-badge">+'+(val-s.target)+' over</span>':''}${hit?' <span class="flag-hit">✓</span>':''}</span></div>`;
          return `<div class="brand-group">${headHtml}${subVals[i].r?lineTableNewAccounts(subVals[i].r.lines, s.flagLabel, tgtHtml):'<div class="no-lines">No activity recorded this month.</div>'+tgtHtml}</div>`;
        }).join('');
        bodyRows += `<tr class="rep-sub" id="${rowId}"><td colspan="${d.subs.length+2}">${subTables}</td></tr>`;
      });
      table.innerHTML = headHtml + `<tbody>${bodyRows}</tbody>`;
      inner.appendChild(table);
      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          const sub=document.getElementById(row.dataset.target);
          sub.classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
      body.appendChild(inner);
      card.appendChild(body);
      container.appendChild(card);
      return;
    }

    const pct = objPct(o);
    const head = document.createElement('div');
    head.className='obj-head';

    let headerRightHTML;
    if(o.key==='new_belgium'){
      headerRightHTML = `<div><div class="obj-progress-txt">${DATA.new_belgium.company_pct.toFixed(1)}%</div><div class="obj-progress-sub">${DATA.new_belgium.reps_hit90} / ${DATA.new_belgium.reps_total} reps at goal</div></div>`;
    } else {
      const d = DATA[o.key];
      headerRightHTML = `<div><div class="obj-progress-txt">${d.reps_at_goal} / ${d.reps_total}</div><div class="obj-progress-sub">reps at goal</div></div>`;
    }

    let goalTag = '';
    if(o.type==='placements' || o.type==='new_accounts'){
      goalTag = `<span class="goal-tag">${DATA[o.key].target_per_rep} per rep</span>`;
    } else if(o.type==='photos'){
      goalTag = `<span class="goal-tag">${DATA[o.key].target_per_rep} pics per rep</span>`;
    } else if(o.type==='pct_of_base'){
      goalTag = `<span class="goal-tag">${o.goalLabel}</span>`;
    }

    head.innerHTML = `
      <div class="obj-left">
        <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span>${goalTag}</div>
        <div class="obj-bar-track"><div class="obj-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="obj-right">${headerRightHTML}<div class="chev">▶</div></div>`;
    head.addEventListener('click',()=>card.classList.toggle('open'));
    card.appendChild(head);

    const body = document.createElement('div');
    body.className='obj-body';
    const inner = document.createElement('div');
    inner.className='obj-body-inner';

    if(o.key==='new_belgium'){
      const rows = ROSTER.map(repName=>{
        const r = DATA.new_belgium.reps.find(x=>x.rep===repName);
        if(!r){
          return `<tr class="rep-row-nodata"><td>${repName}</td><td class="num">—</td><td class="num">—</td></tr>`;
        }
        const rowId = 'nbrow'+(uid++);
        return `
          <tr class="rep-row" data-target="${rowId}">
            <td><span class="rep-chev">▶</span>${r.rep}</td>
            <td class="num">${r.placements.toFixed(0)}</td>
            <td class="num">${r.goal90.toFixed(0)}</td>
          </tr>
          <tr class="rep-sub" id="${rowId}">
            <td colspan="3"><div class="rep-sub-inner">${nbLineTable(r.lines)}</div></td>
          </tr>`;
      }).join('');

      const table = document.createElement('div');
      table.className='table-scroll';
      table.innerHTML = `<table><thead><tr><th>Rep</th><th class="num">Total Placements</th><th class="num">Total 100% Goal</th></tr></thead><tbody>${rows}</tbody></table>`;
      inner.appendChild(table);

      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          document.getElementById(row.dataset.target).classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
    } else if(o.type==='placements'){
      const d = DATA[o.key];
      const target = d.target_per_rep;
      const table = document.createElement('table');
      let bodyRows = '';
      ROSTER.forEach(repName=>{
        const r = d.reps.find(x=>x.rep===repName);
        const myTargets = (d.targetsByRep||{})[repName];
        if(!r && !(myTargets&&myTargets.length)){
          bodyRows += `<tr class="rep-row-nodata"><td>${repName}</td><td class="num">—</td><td><span class="flag-miss">No data</span></td></tr>`;
          return;
        }
        const rowId = 'row'+(uid++);
        const count = r?r.count:0;
        const rp = Math.min(count/target,1)*100;
        const hit = count>=target;
        const over = count>target;
        bodyRows += `<tr class="rep-row" data-target="${rowId}">
          <td><span class="rep-chev">▶</span>${repName}</td>
          <td class="num"><span class="mini-bar-track"><span class="mini-bar-fill${over?' over':''}" style="width:${rp}%"></span></span>${count} / ${target}${over?'<span class="over-badge">+'+(count-target)+' over</span>':''}</td>
          <td>${r?(hit?'<span class="flag-hit">✓ At goal</span>':'<span class="flag-miss">In progress</span>'):'<span class="flag-miss">No activity</span>'}</td>
        </tr>`;
        const activityHtml = r ? lineTablePlacements(r.lines) : '<div class="no-lines" style="padding-left:2px">No activity recorded this month.</div>';
        bodyRows += `<tr class="rep-sub" id="${rowId}"><td colspan="3">${activityHtml}${targetsBlockHtml(myTargets, o.shortName||o.name)}</td></tr>`;
      });
      table.innerHTML = `<thead><tr><th>Rep</th><th class="num">Placements</th><th>Status</th></tr></thead><tbody>${bodyRows}</tbody>`;
      inner.appendChild(table);
      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          document.getElementById(row.dataset.target).classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
    } else if(o.type==='photos'){
      const d = DATA[o.key];
      const target = d.target_per_rep;
      const table = document.createElement('table');
      let bodyRows = '';
      ROSTER.forEach(repName=>{
        const r = d.reps.find(x=>x.rep===repName);
        if(!r){
          bodyRows += `<tr class="rep-row-nodata"><td>${repName}</td><td class="num">—</td><td><span class="flag-miss">No photos</span></td></tr>`;
          return;
        }
        const rowId = 'row'+(uid++);
        const rp = Math.min(r.count/target,1)*100, hit = r.count>=target, over = r.count>target;
        bodyRows += `<tr class="rep-row" data-target="${rowId}">
          <td><span class="rep-chev">▶</span>${repName}</td>
          <td class="num"><span class="mini-bar-track"><span class="mini-bar-fill${over?' over':''}" style="width:${rp}%"></span></span>${r.count} / ${target}${over?'<span class="over-badge">+'+(r.count-target)+' over</span>':''}</td>
          <td>${hit?'<span class="flag-hit">✓ At goal</span>':'<span class="flag-miss">In progress</span>'}</td>
        </tr>`;
        bodyRows += `<tr class="rep-sub" id="${rowId}"><td colspan="3">${lineTablePhotos(r.lines)}</td></tr>`;
      });
      table.innerHTML = `<thead><tr><th>Rep</th><th class="num">POS Pics</th><th>Status</th></tr></thead><tbody>${bodyRows}</tbody>`;
      inner.appendChild(table);
      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          document.getElementById(row.dataset.target).classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
    } else if(o.type==='pct_of_base'){
      const d = DATA[o.key];
      const table = document.createElement('table');
      let bodyRows = '';
      ROSTER.forEach(repName=>{
        const r = d.reps.find(x=>x.rep===repName);
        if(!r){
          bodyRows += `<tr class="rep-row-nodata"><td>${repName}</td><td class="num">—</td><td class="num">—</td><td><span class="flag-miss">No data</span></td></tr>`;
          return;
        }
        const rowId = 'row'+(uid++);
        const rp = Math.min(r.qualifying/r.target,1)*100;
        const hit = r.qualifying>=r.target;
        const over = r.qualifying>r.target;
        bodyRows += `<tr class="rep-row" data-target="${rowId}">
          <td><span class="rep-chev">▶</span>${r.rep}</td>
          <td class="num">${r.base}</td>
          <td class="num"><span class="mini-bar-track"><span class="mini-bar-fill${over?' over':''}" style="width:${rp}%"></span></span>${r.qualifying} / ${r.target}${over?'<span class="over-badge">+'+(r.qualifying-r.target)+' over</span>':''}</td>
          <td>${hit?'<span class="flag-hit">✓ At goal</span>':'<span class="flag-miss">In progress</span>'}</td>
        </tr>`;
        const tgtHtml = targetsBlockHtml((d.targetsByRep||{})[repName], o.shortName||o.name);
        bodyRows += `<tr class="rep-sub" id="${rowId}"><td colspan="4">${lineTableLytt(r.lines)}${tgtHtml}</td></tr>`;
      });
      table.innerHTML = `<thead><tr><th>Rep</th><th class="num">Account Base</th><th class="num">Lytt Accounts</th><th>Status</th></tr></thead><tbody>${bodyRows}</tbody>`;
      inner.appendChild(table);
      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          document.getElementById(row.dataset.target).classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
    }

    body.appendChild(inner);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function renderMain(){
  document.querySelectorAll('.repchip').forEach(c=>c.classList.toggle('active', c.dataset.rep===activeRep));
  if(activeRep) renderRepView(); else renderObjectiveView();
}
loadMonth(activeMonth);
</script>
