<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off-Prem MPO Tracker | July 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#0E1014; --card:#181B22; --card-alt:#14171D; --border:#2A2E38;
    --text:#E9ECF1; --text-dim:#9AA1AD; --accent:#3FB68B; --accent-soft:rgba(63,182,139,0.12);
    --amber:#E0A93E; --red:#E0603E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;}
  a{color:var(--accent);}
  .topbar{padding:24px 32px 0;max-width:1200px;margin:0 auto;}
  .crumb{font-size:13px;color:var(--text-dim);margin-bottom:18px;}
  .crumb a{color:var(--text-dim);text-decoration:none;}
  .crumb a:hover{color:var(--accent);}
  header{max-width:1200px;margin:0 auto;padding:0 32px 20px;border-bottom:1px solid var(--border);}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4vw,38px);margin-bottom:8px;}
  .sub{color:var(--text-dim);font-size:14.5px;}
  .updated{margin:10px 0 0;font-size:12px;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent);animation:lp 2s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

  .kpi-strip{max-width:1200px;margin:28px auto 0;padding:0 32px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  @media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:700px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .kpi-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .kpi-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
  .kpi-val.warn{color:var(--amber);}
  .kpi-val.good{color:var(--accent);}
  .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

  .repbar-wrap{max-width:1200px;margin:24px auto 0;padding:0 32px;}
  .repbar-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
  .repbar{display:flex;flex-wrap:wrap;gap:8px;}
  .repchip{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .repchip:hover{border-color:var(--accent);color:var(--text);}
  .repchip.active{background:var(--accent-soft);border-color:rgba(63,182,139,0.4);color:var(--accent);}

  main{max-width:1200px;margin:28px auto;padding:0 32px;display:flex;flex-direction:column;gap:20px;}

  .backbtn{background:none;border:1px solid var(--border);color:var(--text-dim);font:inherit;font-weight:600;font-size:14px;padding:8px 15px;border-radius:11px;cursor:pointer;margin-bottom:4px;}
  .backbtn:hover{color:var(--text);border-color:var(--text-dim);}
  .rep-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px;}
  .rep-hero h2{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}

  .obj-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .obj-head{padding:22px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .obj-head:hover{background:var(--card-alt);}
  .obj-head.static{cursor:default;}
  .obj-head.static:hover{background:none;}
  .obj-left{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .obj-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .obj-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;}
  .weight-tag{font-size:11px;color:var(--text-dim);background:#20242D;border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .goal-tag{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(63,182,139,0.3);padding:2px 8px;border-radius:20px;}
  .obj-bar-track{width:100%;max-width:420px;height:7px;background:#252932;border-radius:4px;overflow:hidden;margin-top:2px;}
  .obj-bar-fill{height:100%;border-radius:4px;background:var(--accent);}
  .obj-bar-fill.over{background:var(--amber);}
  .obj-right{display:flex;align-items:center;gap:18px;flex-shrink:0;}
  .obj-progress-txt{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;text-align:right;}
  .obj-progress-sub{font-size:11.5px;color:var(--text-dim);text-align:right;}
  .chev{transition:transform .18s;color:var(--text-dim);font-size:14px;}
  .obj-card.open .chev{transform:rotate(90deg);}
  .obj-body{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid transparent;}
  .obj-card.open .obj-body{max-height:5000px;border-top:1px solid var(--border);}
  .obj-card.static-open .obj-body{max-height:5000px;border-top:1px solid var(--border);}
  .obj-body-inner{padding:20px 24px 26px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid #1E222B;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .flag-hit{color:var(--accent);font-weight:600;}
  .flag-miss{color:var(--text-dim);}
  .mini-bar-track{display:inline-block;width:80px;height:6px;background:#252932;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px;}
  .mini-bar-fill{height:100%;background:var(--accent);}
  .mini-bar-fill.over{background:var(--amber);}
  .over-badge{color:var(--amber);font-size:11px;font-weight:600;margin-left:6px;}
  .table-scroll{max-height:480px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .table-scroll table thead th{position:sticky;top:0;background:var(--card);z-index:1;}

  .empty-obj{padding:22px 24px;color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:space-between;}
  .empty-tag{font-size:11px;background:#20242D;border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--text-dim);}
  .empty-state{color:var(--text-dim);font-size:13px;padding:6px 2px 2px;}

  .rep-row{cursor:pointer;}
  .rep-row:hover{background:#1C202A;}
  .rep-row td:first-child{display:flex;align-items:center;gap:8px;}
  .rep-chev{font-size:10px;color:var(--text-dim);transition:transform .15s;display:inline-block;}
  .rep-row.expanded .rep-chev{transform:rotate(90deg);}
  .rep-sub{display:none;}
  .rep-sub.open{display:table-row;}
  .rep-sub td{background:var(--card-alt);padding:0;}
  .rep-sub-inner{padding:10px 24px 14px 38px;}
  .rep-sub-inner table{font-size:12.5px;}
  .rep-sub-inner th{padding:6px 10px;}
  .rep-sub-inner td{padding:6px 10px;}
  .no-lines{color:var(--text-dim);font-size:12.5px;padding:10px 24px 14px 38px;}
  .complete-tag{color:var(--accent);font-weight:600;}
  .focus-row{background:rgba(224,169,62,0.06);}
  .pkg-group-row{cursor:pointer;}
  .pkg-group-row:hover td{background:#20242E;}
  .pkg-group-row td{background:#1A1E27;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:7px 12px;}
  .pkg-group-row:first-child td{border-top:none;}
  .pkg-chev{display:inline-block;margin-right:7px;font-size:9px;transition:transform .15s;}
  .pkg-group-row.collapsed .pkg-chev{transform:rotate(-90deg);}
  .pkg-item-row.hidden{display:none;}
  .rep-row-nodata td{color:var(--text-dim);opacity:0.6;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#2A2E38;border-radius:4px;}

  /* ===== Mobile / tablet responsiveness ===== */
  html, body{overflow-x:hidden;}
  * { -webkit-tap-highlight-color: transparent; }

  @media (max-width: 820px){
    .topbar{padding:18px 16px 0;}
    header{padding:0 16px 16px;}
    .kpi-strip{padding:0 16px;gap:10px;margin-top:20px;}
    .repbar-wrap{padding:0 16px;margin-top:18px;}
    main{padding:0 16px;margin:20px auto;gap:14px;}
    h1{font-size:clamp(22px,6vw,30px);}
    .sub{font-size:13.5px;}

    .kpi{padding:14px 14px;}
    .kpi-val{font-size:21px;}
    .kpi-label{font-size:10.5px;}

    .repchip{padding:9px 14px;font-size:13px;min-height:38px;display:inline-flex;align-items:center;}

    .obj-head{padding:16px 16px;flex-wrap:wrap;gap:12px;}
    .obj-name{font-size:15.5px;}
    .obj-right{gap:12px;width:100%;justify-content:space-between;}
    .obj-progress-txt{font-size:18px;}
    .obj-body-inner{padding:14px 12px 18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}

    .rep-hero{gap:10px;}
    .rep-hero h2{font-size:21px;}

    table{font-size:13px;}
    th, td{padding:10px 8px;}
    .mini-bar-track{width:46px;margin-right:6px;}

    .rep-sub-inner{padding:8px 10px 12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .rep-sub-inner table{min-width:540px;font-size:12.5px;}
    .rep-sub-inner th, .rep-sub-inner td{padding:8px 9px;white-space:nowrap;}

    .table-scroll{max-height:400px;}
  }

  @media (max-width: 480px){
    .topbar{padding:14px 12px 0;}
    header{padding:0 12px 14px;}
    .kpi-strip{padding:0 12px;grid-template-columns:repeat(2,1fr)!important;gap:8px;}
    .repbar-wrap{padding:0 12px;}
    main{padding:0 12px;}
    .kpi{padding:12px 12px;}
    .kpi-val{font-size:19px;}
    .obj-head{padding:14px 12px;}
    .obj-name{font-size:14.5px;}
    .weight-tag, .goal-tag{font-size:10px;padding:2px 7px;}
    .obj-progress-txt{font-size:16px;}
    table{font-size:12.5px;}
    th, td{padding:9px 7px;}
    .rep-row td:first-child{gap:6px;}
  }

</style>
</head>
<body>

<div class="topbar">
  <div class="crumb"><a href="../index.html">MPO Tracker</a> &nbsp;/&nbsp; Off-Premise</div>
</div>

<header>
  <div class="eyebrow">Off-Premise · July 2026</div>
  <h1>Off-Prem MPO Tracker</h1>
  <p class="sub">20% of Total Commission Eligibility — weighted across objectives. New Belgium targets are the <strong>90%-of-goal</strong> figures per rep/product; Sapporo Light and Famosa are <strong>per-rep</strong> targets.</p>
  <p class="updated" id="updated-line"></p>
</header>

<div class="kpi-strip" id="kpi-strip"></div>

<div class="repbar-wrap">
  <div class="repbar-label">Jump to a rep</div>
  <div class="repbar" id="repbar"></div>
</div>

<main id="objectives"></main>

<script>
let DATA = {};

const OBJECTIVES = [
  {key:'new_belgium', name:'New Belgium – Achieve 90% of Assigned Distribution Goal', weight:0.30, type:'new_belgium', hasData:true},
  {key:'ws_2xo', name:'Wine & Spirits – 2XO (2), Le Grand Pinot Noir (1), Yave (1) Placements', weight:0.30, type:'placements', hasData:true},
  {key:'sapporo_light', name:'Sapporo Light – (5) Placements per Rep', weight:0.10, type:'placements', hasData:true},
  {key:'famosa', name:'Famosa 7oz Urban Market – (5) Placements per Rep', weight:0.10, type:'placements', hasData:true},
  {key:'disruptors', name:'Disruptors – (3) Bin Stackers/Racks in iSellBeer', weight:0.20, type:'placeholder', hasData:false},
];

const ROSTER = ["Alex Rodriguez","Alisa Acciardi","Allison Scott","Andrew Lundy","Anthony Palmisano","Brian Sengebush","Chris Payton","Dan Lagala","Dave Ehlers","Derrick Laws","Dylan Rubino","Hakan Sadik","Jaime Colonna","Javier Melo","Jayson Romine","Jim Heaney","John O'Donoghue","Klejdi Lamo","Matt Powierski","Michael Harboy","Mike Ast","Nick Melissari","Pablo Lopez","Paul Mclaughlin","Phil Ernst","Robin Feldman","Shane Barreca"];

// ---- Snowflake JSON -> DATA builder ----
// Column names in the synced tables aren't guaranteed, so match by
// tokenized header words instead of position/exact-name (same approach
// used for the on-prem MPO tracker).
function tokens(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);}
function wordMatches(tok,w){return tok===w||(w.length>=4&&tok.startsWith(w))||(tok.length>=4&&w.startsWith(tok));}
function findCol(row, candidateWordSets){
  const keys=Object.keys(row);
  for(const words of candidateWordSets){
    const hit=keys.find(k=>{const t=tokens(k);return words.every(w=>t.some(tok=>wordMatches(tok,w)));});
    if(hit) return hit;
  }
  return null;
}
function parseDateMs(s){const d=new Date(s);return isNaN(d)?0:d.getTime();}
// Pulls a SKU-like numeric code (3+ digits) out of either a dedicated
// product-number column or a combined "12345 Product Name ..." string.
// Package sizes ("2/12/12 oz Can") never contain a 3+ digit run, so this
// doesn't false-match on those.
function extractProductNum(s){const m=String(s||"").match(/\d{3,}/);return m?m[0]:null;}

const REP_COLS=[["rep","name"],["rep"]];
const CUSTOMER_COLS=[["customer","name"],["account","name"],["customer"],["account"],["location"]];
const DATE_COLS=[["date"]];
const BRAND_COLS=[["brand","family"],["brand"]];
const PRODUCT_COLS=[["product","name"],["product","desc"],["product"],["brand"],["item"]];
const COUNT_COLS=[["count"],["qty"],["quantity"],["cases"],["units"]];
const PACKAGE_COLS=[["package","group"],["package"],["pack"]];
const PLACEMENTS_COLS=[["placement"]];
const GOAL_COLS=[["goal"]];

// Header-name matching breaks down for columns like "Product #" — the "#"
// is stripped by tokens(), leaving just "product", indistinguishable from
// a product-NAME column by name alone. Classify by sampled VALUES instead:
// a "product"/"item"/"sku"-tokened column whose values are mostly numeric
// is the number column; a same-topic column with mostly non-numeric values
// is the name column. Sidesteps header-spelling guesswork entirely.
function isNumericValue(v){if(v==null) return false; const s=String(v).trim(); return s!==""&&/^-?\d+(\.\d+)?$/.test(s);}
function findProductNumNameCols(rows){
  const keys=Object.keys(rows[0]);
  const candidates=keys.filter(k=>{const t=tokens(k);return t.some(tok=>wordMatches(tok,"product")||wordMatches(tok,"item")||wordMatches(tok,"sku"));});
  const sample=rows.slice(0,Math.min(25,rows.length));
  let numCol=null, nameCol=null;
  candidates.forEach(k=>{
    const vals=sample.map(r=>r[k]).filter(v=>v!=null&&String(v).trim()!=="");
    const numericCount=vals.filter(isNumericValue).length;
    const mostlyNumeric=vals.length>0&&numericCount>=Math.ceil(vals.length*0.8);
    if(mostlyNumeric){ if(!numCol) numCol=k; } else { if(!nameCol) nameCol=k; }
  });
  return {numCol, nameCol};
}

function buildPlacementsDataset(rows, target){
  if(!Array.isArray(rows)||!rows.length) return null;
  const repCol=findCol(rows[0],REP_COLS), prodCol=findCol(rows[0],PRODUCT_COLS),
        custCol=findCol(rows[0],CUSTOMER_COLS), dateCol=findCol(rows[0],DATE_COLS),
        countCol=findCol(rows[0],COUNT_COLS), brandCol=findCol(rows[0],BRAND_COLS);
  if(!repCol||!prodCol||!custCol||!dateCol||!countCol) return null;
  const byRep=new Map();
  rows.forEach(r=>{
    const rep=String(r[repCol]||"").trim(); if(!rep) return;
    if(!byRep.has(rep)) byRep.set(rep,[]);
    const n=parseFloat(r[countCol]);
    const line={product:String(r[prodCol]||"").trim(), customer:String(r[custCol]||"").trim(), date:String(r[dateCol]||"").trim(), count:isNaN(n)?1:n};
    if(brandCol) line.brand=String(r[brandCol]||"").trim();
    byRep.get(rep).push(line);
  });
  const reps=[];
  byRep.forEach((lines,rep)=>{
    lines.sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date));
    const count=lines.reduce((s,l)=>s+l.count,0);
    reps.push({rep, count, lines});
  });
  const reps_at_goal=ROSTER.filter(name=>{const r=reps.find(x=>x.rep===name);return r?r.count>=target:false;}).length;
  return {target_per_rep:target, reps, reps_at_goal, reps_total:ROSTER.length};
}

// Joins the flat actuals export (rep/package/product/placements) against
// the long-format goals export (rep/product#/product name/package/GOAL90)
// by rep + product number (falling back to rep + normalized product name
// if either side lacks a parseable product number), NOT by row position.
// The actuals export only contains rows for products with placement
// activity, so a rep/product with zero placements this period has no
// actuals row at all -- those goal rows are backfilled below (as
// zero-placement lines) so group/rep goal totals reflect the full
// assigned goal, not just the goal for products with recorded activity.
function buildNewBelgiumDataset(actualRows, goalRows){
  if(!Array.isArray(actualRows)||!actualRows.length||!Array.isArray(goalRows)||!goalRows.length) return null;
  const aRepCol=findCol(actualRows[0],REP_COLS), aPkgCol=findCol(actualRows[0],PACKAGE_COLS),
        aProdCol=findCol(actualRows[0],PRODUCT_COLS), aPlaceCol=findCol(actualRows[0],PLACEMENTS_COLS);
  const {numCol:gNumCol, nameCol:gNameCol}=findProductNumNameCols(goalRows);
  const gRepCol=findCol(goalRows[0],REP_COLS), gPkgCol=findCol(goalRows[0],PACKAGE_COLS),
        gGoalCol=findCol(goalRows[0],GOAL_COLS);
  if(!aRepCol||!aProdCol||!aPlaceCol||!gRepCol||!gGoalCol||(!gNumCol&&!gNameCol)) return null;

  // The goals export has no package-group field (it has a Package Type
  // string like "1/15/19.2 oz Can" instead) -- build a global product ->
  // package-group lookup from the actuals export (whichever rep/rows have
  // it) so zero-placement goal rows can still be bucketed into the right
  // group.
  const groupByNum=new Map(), groupByName=new Map();
  actualRows.forEach(r=>{
    const productRaw=String(r[aProdCol]||"").trim();
    const pkg=aPkgCol?String(r[aPkgCol]||"").trim():"";
    if(!pkg) return;
    const num=extractProductNum(productRaw);
    if(num && !groupByNum.has(num)) groupByNum.set(num,pkg);
    const nameKey=tokens(productRaw).join(" ");
    if(nameKey && !groupByName.has(nameKey)) groupByName.set(nameKey,pkg);
  });

  const goalList=[];
  goalRows.forEach(r=>{
    const rep=String(r[gRepCol]||"").trim(); if(!rep) return;
    const goal=parseFloat(r[gGoalCol]); if(isNaN(goal)) return;
    const num=gNumCol?extractProductNum(r[gNumCol]):null;
    const rawName=gNameCol?String(r[gNameCol]||"").trim():"";
    const nameKey=rawName?tokens(rawName).join(" "):null;
    const pkgType=gPkgCol?String(r[gPkgCol]||"").trim():"";
    const displayProduct=[num,rawName,pkgType].filter(Boolean).join(" ");
    const package_group=(num&&groupByNum.get(num))||(nameKey&&groupByName.get(nameKey))||"";
    goalList.push({rep, num, nameKey, goal90:goal, package_group, displayProduct});
  });
  const goalMap=new Map();
  goalList.forEach(g=>{
    if(g.num) goalMap.set(g.rep+"|n:"+g.num, g);
    if(g.nameKey && !goalMap.has(g.rep+"|t:"+g.nameKey)) goalMap.set(g.rep+"|t:"+g.nameKey, g);
  });

  const byRep=new Map();
  function repLineMap(rep){ if(!byRep.has(rep)) byRep.set(rep,new Map()); return byRep.get(rep); }

  let unmatched=0;
  actualRows.forEach(r=>{
    const rep=String(r[aRepCol]||"").trim(); if(!rep) return;
    const productRaw=String(r[aProdCol]||"").trim();
    const placementsRaw=parseFloat(r[aPlaceCol]);
    const placements=isNaN(placementsRaw)?0:placementsRaw;
    const pkg=aPkgCol?String(r[aPkgCol]||"").trim():"";
    const num=extractProductNum(productRaw);
    const nameKey=tokens(productRaw).join(" ");
    const g=(num&&goalMap.get(rep+"|n:"+num))||goalMap.get(rep+"|t:"+nameKey);
    if(!g) unmatched++;
    const goal90=g?g.goal90:0;
    const pct=goal90>0?Math.round((placements/goal90*100)*10)/10:0;
    const matchKey=g?(g.num?"n:"+g.num:"t:"+g.nameKey):"raw:"+nameKey;
    repLineMap(rep).set(matchKey, {package_group:pkg||(g&&g.package_group)||"", product:productRaw, placements, goal90, pct});
  });
  if(unmatched) console.warn('New Belgium: '+unmatched+' actual rows had no matching goal row (rep+product could not be joined)');

  // Backfill any goal row with no actuals this period as a zero-placement line.
  goalList.forEach(g=>{
    const matchKey=g.num?"n:"+g.num:"t:"+g.nameKey;
    const lines=repLineMap(g.rep);
    if(!lines.has(matchKey)){
      lines.set(matchKey, {package_group:g.package_group, product:g.displayProduct, placements:0, goal90:g.goal90, pct:0});
    }
  });

  const reps=[];
  let total_placements=0, total_goal90=0, reps_hit90=0;
  byRep.forEach((lineMap,rep)=>{
    const repLines=[...lineMap.values()];
    const placements=repLines.reduce((s,l)=>s+l.placements,0);
    const goal90=repLines.reduce((s,l)=>s+l.goal90,0);
    const pct=goal90>0?Math.round((placements/goal90*100)*10)/10:0;
    const hit90=goal90>0&&(placements/goal90)>=0.9;
    total_placements+=placements; total_goal90+=goal90;
    if(hit90) reps_hit90++;
    reps.push({rep, placements, goal90, pct, hit90, lines:repLines});
  });
  const company_pct=total_goal90>0?Math.round((total_placements/total_goal90*100)*10)/10:0;
  return {company_pct, total_placements, total_goal90, reps_hit90, reps_total:ROSTER.length, reps};
}

function showDataError(msg){
  document.getElementById('kpi-strip').innerHTML='';
  document.getElementById('objectives').innerHTML=`<div class="empty-obj"><div>${msg}</div></div>`;
}

async function boot(){
  const cb="?_="+Date.now();
  async function loadJSON(file){
    try{
      const res=await fetch(file+cb,{cache:"no-store"});
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  const [actuals, goals, ws2xo, sapLight, famosa] = await Promise.all([
    loadJSON('data/mpo_new_belgium_actuals.json'),
    loadJSON('data/mpo_new_belgium_90goals.json'),
    loadJSON('data/mpo_wine_spirits_2xo.json'),
    loadJSON('data/mpo_sapporo_light.json'),
    loadJSON('data/mpo_famosa.json'),
  ]);

  if(actuals && goals){
    const built=buildNewBelgiumDataset(actuals, goals);
    if(built) DATA.new_belgium=built;
  }
  if(ws2xo){ const built=buildPlacementsDataset(ws2xo,4); if(built) DATA.ws_2xo=built; }
  if(sapLight){ const built=buildPlacementsDataset(sapLight,5); if(built) DATA.sapporo_light=built; }
  if(famosa){ const built=buildPlacementsDataset(famosa,5); if(built) DATA.famosa=built; }

  if(!DATA.new_belgium||!DATA.ws_2xo||!DATA.sapporo_light||!DATA.famosa){
    showDataError("Couldn't load synced MPO data. Check that the Snowflake sync workflow has run and that data/mpo_*.json files exist with recognizable rep/product/goal columns.");
    return;
  }

  const meta=await loadJSON('data/sync_meta.json');
  if(meta && meta.synced_at){
    const d=new Date(meta.synced_at);
    const fmt=d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
    document.getElementById('updated-line').innerHTML=`<span class="livedot"></span> Data refreshed ${fmt}`;
  }

  renderKPIs();
  renderRepBar();
  renderMain();
}

function repGoalPct(d){ return d.reps_total ? (d.reps_at_goal/d.reps_total)*100 : 0; }
function pctOf(o){
  if(!o.hasData) return 0;
  if(o.key==='new_belgium') return Math.min(DATA.new_belgium.company_pct,100);
  if(o.type==='placements') return repGoalPct(DATA[o.key]);
  return 0;
}

function renderKPIs(){
  const strip = document.getElementById('kpi-strip');
  const weighted = OBJECTIVES.reduce((s,o)=>s+o.weight*pctOf(o),0);
  const kpis = [
    {label:'Weighted MPO Complete', val: weighted.toFixed(0)+'%', cls: weighted>=90?'good':(weighted>=50?'':'warn'), sub:'across all objectives'},
    {label:'New Belgium Dist. Goal', val: DATA.new_belgium.company_pct.toFixed(1)+'%', cls: DATA.new_belgium.company_pct>=100?'good':'warn', sub: DATA.new_belgium.reps_hit90+' / '+DATA.new_belgium.reps_total+' reps at goal'},
    {label:'Sapporo Light – Reps at Goal', val: DATA.sapporo_light.reps_at_goal+' / '+DATA.sapporo_light.reps_total, cls:'warn', sub:'5 placements each'},
    {label:'W&S 2XO/Le Grand/Yave', val: DATA.ws_2xo.reps_at_goal+' / '+DATA.ws_2xo.reps_total, cls:'warn', sub:'4 placements each'},
    {label:'Famosa 7oz – Reps at Goal', val: DATA.famosa.reps_total ? (DATA.famosa.reps_at_goal+' / '+DATA.famosa.reps_total) : '—', cls: DATA.famosa.reps_at_goal>0?'good':'warn', sub: DATA.famosa.reps_total ? '5 placements each' : 'no data yet'},
  ];
  kpis.forEach(k=>{
    const el = document.createElement('div');
    el.className='kpi';
    el.innerHTML = `<div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div><div class="kpi-sub">${k.sub}</div>`;
    strip.appendChild(el);
  });
}

function allReps(){
  return ROSTER.slice().sort();
}
function repFind(objKey, rep){ return DATA[objKey].reps.find(r=>r.rep===rep); }

// Sort New Belgium product lines so incomplete (not yet at goal) show first, worst first
function sortNBLines(lines){
  return lines.slice().sort((a,b)=>{
    const ah = a.pct>=90?1:0, bh = b.pct>=90?1:0;
    if(ah!==bh) return ah-bh;
    return a.pct-b.pct;
  });
}
function nbPctCell(pct){
  return pct>=90 ? '<span class="complete-tag">At Goal</span>' : pct.toFixed(1)+'%';
}
// Groups a rep's product lines by package type, sorting each group's
// products incomplete-first/worst-first (same rule as sortNBLines), and
// puts groups with anything still below goal ahead of fully-at-goal
// groups so the rep's outstanding work still surfaces first overall.
function groupNBLines(lines){
  const groups = new Map();
  lines.forEach(l=>{
    const key = l.package_group || 'Other';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l);
  });
  return [...groups.entries()]
    .map(([name, items])=>{
      const sorted = sortNBLines(items);
      const totalPlacements = sorted.reduce((s,l)=>s+l.placements,0);
      const totalGoal90 = sorted.reduce((s,l)=>s+l.goal90,0);
      return {name, items: sorted, hasIncomplete: sorted.some(l=>l.pct<90), totalPlacements, totalGoal90};
    })
    .sort((a,b)=> a.hasIncomplete===b.hasIncomplete ? a.name.localeCompare(b.name) : (a.hasIncomplete?-1:1));
}
function nbLineTable(lines){
  const body = groupNBLines(lines).map(g=>{
    const gid = 'nbg'+(uid++);
    const header = `<tr class="pkg-group-row" data-group="${gid}"><td><span class="pkg-chev">▼</span>${g.name}</td><td class="num">${g.totalPlacements}</td><td class="num">${g.totalGoal90}</td><td class="num"></td></tr>`;
    const rows = g.items.map(l=>`<tr class="pkg-item-row ${gid} ${l.pct<90?'focus-row':''}"><td>${l.product}</td><td class="num">${l.placements}</td><td class="num">${l.goal90}</td><td class="num">${nbPctCell(l.pct)}</td></tr>`).join('');
    return header+rows;
  }).join('');
  return `<table><thead><tr><th>Product</th><th class="num">Placements</th><th class="num">100% Goal</th><th class="num">% to Goal</th></tr></thead><tbody>${body}</tbody></table>`;
}
// Delegated once for the whole page -- covers package-group headers however
// many times nbLineTable() re-renders (rep view, or every expanded row in
// the objective view's New Belgium table).
document.addEventListener('click', e=>{
  const header = e.target.closest('.pkg-group-row');
  if(!header) return;
  const gid = header.dataset.group;
  const collapsed = header.classList.toggle('collapsed');
  document.querySelectorAll('.pkg-item-row.'+gid).forEach(row=>row.classList.toggle('hidden', collapsed));
});

let activeRep = null;
const container = document.getElementById('objectives');
let uid = 0;

function renderRepBar(){
  const bar = document.getElementById('repbar');
  const reps = allReps();
  bar.innerHTML = reps.map(r=>`<button class="repchip" data-rep="${r}">${r}</button>`).join('');
  bar.querySelectorAll('.repchip').forEach(b=>b.addEventListener('click',()=>{activeRep=b.dataset.rep;renderMain();window.scrollTo({top:0,behavior:'smooth'});}));
}

function lineTablePlacements(lines){
  if(!lines || lines.length===0) return '<div class="no-lines">No activity recorded this month.</div>';
  const rows = lines.map(l=>`<tr><td>${l.product}</td><td>${l.customer}</td><td>${l.date}</td><td class="num">${l.count}</td></tr>`).join('');
  return `<div class="rep-sub-inner" style="padding-left:2px"><table><thead><tr><th>Product</th><th>Customer</th><th>Date</th><th class="num">Count</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderRepView(){
  container.innerHTML = '';
  const backWrap = document.createElement('div');
  backWrap.innerHTML = `<button class="backbtn" id="backbtn">‹ All reps</button>`;
  container.appendChild(backWrap);
  document.getElementById('backbtn').addEventListener('click',()=>{activeRep=null;renderMain();});

  const hero = document.createElement('div');
  hero.className='rep-hero';
  hero.innerHTML = `<h2>${activeRep}</h2>`;
  container.appendChild(hero);

  OBJECTIVES.forEach(o=>{
    const card = document.createElement('div');
    card.className='obj-card static-open';

    if(o.type==='placeholder'){
      card.innerHTML = `<div class="empty-obj"><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div><div class="empty-tag">No data yet</div></div>`;
      container.appendChild(card);
      return;
    }

    if(o.key==='new_belgium'){
      const r = DATA.new_belgium.reps.find(x=>x.rep===activeRep);
      const head = document.createElement('div');
      head.className='obj-head static';
      if(!r){
        head.innerHTML = `<div class="obj-left"><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div></div><div class="empty-tag">No activity</div>`;
        card.appendChild(head);
        container.appendChild(card);
        return;
      }
      head.innerHTML = `
        <div class="obj-left">
          <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div>
          <div class="obj-bar-track"><div class="obj-bar-fill" style="width:${Math.min(r.pct,100)}%"></div></div>
        </div>
        <div class="obj-right"><div><div class="obj-progress-txt">${r.placements.toFixed(0)} / ${r.goal90.toFixed(0)}</div><div class="obj-progress-sub">Placements / Goal</div></div></div>`;
      card.appendChild(head);
      const body = document.createElement('div');
      body.className='obj-body';
      const inner = document.createElement('div');
      inner.className='obj-body-inner';
      inner.style.paddingTop='0';
      inner.innerHTML = nbLineTable(r.lines);
      body.appendChild(inner);
      card.appendChild(body);
      container.appendChild(card);
      return;
    }

    // placements type: sapporo_light / famosa
    const d = DATA[o.key];
    const target = d.target_per_rep;
    const r = repFind(o.key, activeRep);
    const head = document.createElement('div');
    head.className='obj-head static';
    if(d.reps_total===0){
      head.innerHTML = `<div class="obj-left"><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div></div><div class="empty-tag">No data yet</div>`;
      card.appendChild(head);
      container.appendChild(card);
      return;
    }
    const val = r ? r.count : 0;
    const pct = Math.min(val/target,1)*100;
    const hit = val>=target;
    const over = val>target;
    head.innerHTML = `
      <div class="obj-left">
        <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span><span class="goal-tag">${target} per rep</span></div>
        <div class="obj-bar-track"><div class="obj-bar-fill${over?' over':''}" style="width:${pct}%"></div></div>
      </div>
      <div class="obj-right"><div><div class="obj-progress-txt">${val} / ${target}${over?'<span class="over-badge">+'+(val-target)+' over</span>':''}</div><div class="obj-progress-sub">${hit?'<span class="flag-hit">✓ At goal</span>':'In progress'}</div></div></div>`;
    card.appendChild(head);
    const body = document.createElement('div');
    body.className='obj-body';
    const inner = document.createElement('div');
    inner.className='obj-body-inner';
    inner.style.paddingTop='0';
    inner.innerHTML = lineTablePlacements(r ? r.lines : []);
    body.appendChild(inner);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function renderObjectiveView(){
  container.innerHTML = '';
  OBJECTIVES.forEach(o=>{
    const card = document.createElement('div');
    card.className='obj-card';

    if(o.type==='placeholder'){
      card.innerHTML = `
        <div class="empty-obj">
          <div><div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span></div></div>
          <div class="empty-tag">No data yet</div>
        </div>`;
      container.appendChild(card);
      return;
    }

    const pct = pctOf(o);
    const head = document.createElement('div');
    head.className='obj-head';

    let headerRightHTML;
    if(o.key==='new_belgium'){
      headerRightHTML = `<div><div class="obj-progress-txt">${DATA.new_belgium.company_pct.toFixed(1)}%</div><div class="obj-progress-sub">${DATA.new_belgium.reps_hit90} / ${DATA.new_belgium.reps_total} reps at goal</div></div>`;
    } else {
      const d = DATA[o.key];
      headerRightHTML = `<div><div class="obj-progress-txt">${d.reps_at_goal} / ${d.reps_total}</div><div class="obj-progress-sub">reps at goal</div></div>`;
    }

    const goalTag = (o.type==='placements') ? `<span class="goal-tag">${DATA[o.key].target_per_rep} per rep</span>` : '';

    head.innerHTML = `
      <div class="obj-left">
        <div class="obj-name-row"><span class="obj-name">${o.name}</span><span class="weight-tag">${(o.weight*100).toFixed(0)}% weight</span>${goalTag}</div>
        <div class="obj-bar-track"><div class="obj-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="obj-right">${headerRightHTML}<div class="chev">▶</div></div>`;
    head.addEventListener('click',()=>card.classList.toggle('open'));
    card.appendChild(head);

    const body = document.createElement('div');
    body.className='obj-body';
    const inner = document.createElement('div');
    inner.className='obj-body-inner';

    if(o.key==='new_belgium'){
      const rows = ROSTER.map(repName=>{
        const r = DATA.new_belgium.reps.find(x=>x.rep===repName);
        if(!r){
          return `<tr class="rep-row-nodata"><td>${repName}</td><td class="num">—</td><td class="num">—</td></tr>`;
        }
        const rowId = 'nbrow'+(uid++);
        return `
          <tr class="rep-row" data-target="${rowId}">
            <td><span class="rep-chev">▶</span>${r.rep}</td>
            <td class="num">${r.placements.toFixed(0)}</td>
            <td class="num">${r.goal90.toFixed(0)}</td>
          </tr>
          <tr class="rep-sub" id="${rowId}">
            <td colspan="3"><div class="rep-sub-inner">${nbLineTable(r.lines)}</div></td>
          </tr>`;
      }).join('');

      const table = document.createElement('div');
      table.className='table-scroll';
      table.innerHTML = `<table><thead><tr><th>Rep</th><th class="num">Total Placements</th><th class="num">Total 100% Goal</th></tr></thead><tbody>${rows}</tbody></table>`;
      inner.appendChild(table);

      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          document.getElementById(row.dataset.target).classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
    } else if(o.type==='placements'){
      const d = DATA[o.key];
      const target = d.target_per_rep;
      const table = document.createElement('table');
      let bodyRows = '';
      ROSTER.forEach(repName=>{
        const r = d.reps.find(x=>x.rep===repName);
        if(!r){
          bodyRows += `<tr class="rep-row-nodata"><td>${repName}</td><td class="num">—</td><td><span class="flag-miss">No data</span></td></tr>`;
          return;
        }
        const rowId = 'row'+(uid++);
        const rp = Math.min(r.count/target,1)*100;
        const hit = r.count>=target;
        const over = r.count>target;
        bodyRows += `<tr class="rep-row" data-target="${rowId}">
          <td><span class="rep-chev">▶</span>${r.rep}</td>
          <td class="num"><span class="mini-bar-track"><span class="mini-bar-fill${over?' over':''}" style="width:${rp}%"></span></span>${r.count} / ${target}${over?'<span class="over-badge">+'+(r.count-target)+' over</span>':''}</td>
          <td>${hit?'<span class="flag-hit">✓ At goal</span>':'<span class="flag-miss">In progress</span>'}</td>
        </tr>`;
        bodyRows += `<tr class="rep-sub" id="${rowId}"><td colspan="3">${lineTablePlacements(r.lines)}</td></tr>`;
      });
      table.innerHTML = `<thead><tr><th>Rep</th><th class="num">Placements</th><th>Status</th></tr></thead><tbody>${bodyRows}</tbody>`;
      inner.appendChild(table);
      table.querySelectorAll('.rep-row').forEach(row=>{
        row.addEventListener('click',()=>{
          document.getElementById(row.dataset.target).classList.toggle('open');
          row.classList.toggle('expanded');
        });
      });
    }

    body.appendChild(inner);
    card.appendChild(body);
    container.appendChild(card);
  });

  document.querySelectorAll('.obj-card')[0]?.classList.add('open');
}

function renderMain(){
  document.querySelectorAll('.repchip').forEach(c=>c.classList.toggle('active', c.dataset.rep===activeRep));
  if(activeRep) renderRepView(); else renderObjectiveView();
}
boot();
</script>
</body>
</html>
