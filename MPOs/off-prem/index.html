<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off-Prem MPO Tracker | July 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#0E1014; --card:#181B22; --card-alt:#14171D; --border:#2A2E38;
    --text:#E9ECF1; --text-dim:#9AA1AD; --accent:#3FB68B; --accent-soft:rgba(63,182,139,0.12);
    --amber:#E0A93E; --red:#E0603E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;}
  a{color:var(--accent);}
  .topbar{padding:24px 32px 0;max-width:1200px;margin:0 auto;}
  .crumb{font-size:13px;color:var(--text-dim);margin-bottom:18px;}
  .crumb a{color:var(--text-dim);text-decoration:none;}
  .crumb a:hover{color:var(--accent);}
  header{max-width:1200px;margin:0 auto;padding:0 32px 28px;border-bottom:1px solid var(--border);}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4vw,38px);margin-bottom:8px;}
  .sub{color:var(--text-dim);font-size:14.5px;}

  .kpi-strip{max-width:1200px;margin:28px auto 0;padding:0 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media(max-width:900px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .kpi-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .kpi-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
  .kpi-val.warn{color:var(--amber);}
  .kpi-val.good{color:var(--accent);}
  .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

  main{max-width:1200px;margin:36px auto;padding:0 32px;display:flex;flex-direction:column;gap:20px;}

  .obj-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .obj-head{padding:22px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .obj-head:hover{background:var(--card-alt);}
  .obj-left{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .obj-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .obj-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;}
  .weight-tag{font-size:11px;color:var(--text-dim);background:#20242D;border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .goal-tag{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(63,182,139,0.3);padding:2px 8px;border-radius:20px;}
  .obj-bar-track{width:100%;max-width:420px;height:7px;background:#252932;border-radius:4px;overflow:hidden;margin-top:2px;}
  .obj-bar-fill{height:100%;border-radius:4px;background:var(--accent);}
  .obj-right{display:flex;align-items:center;gap:18px;flex-shrink:0;}
  .obj-progress-txt{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;text-align:right;}
  .obj-progress-sub{font-size:11.5px;color:var(--text-dim);text-align:right;}
  .chev{transition:transform .18s;color:var(--text-dim);font-size:14px;}
  .obj-card.open .chev{transform:rotate(90deg);}
  .obj-body{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid transparent;}
  .obj-card.open .obj-body{max-height:4200px;border-top:1px solid var(--border);}
  .obj-body-inner{padding:20px 24px 26px;}

  .tabbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tabbtn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:8px;font-size:12.5px;font-family:'Inter',sans-serif;cursor:pointer;font-weight:600;}
  .tabbtn.active{background:var(--accent-soft);border-color:rgba(63,182,139,0.4);color:var(--accent);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;}
  th:hover{color:var(--text);}
  td{padding:9px 12px;border-bottom:1px solid #1E222B;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .flag-hit{color:var(--accent);font-weight:600;}
  .flag-miss{color:var(--text-dim);}
  .mini-bar-track{display:inline-block;width:80px;height:6px;background:#252932;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px;}
  .mini-bar-fill{height:100%;background:var(--accent);}
  .table-scroll{max-height:480px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .table-scroll table thead th{position:sticky;top:0;background:var(--card);z-index:1;}

  .empty-obj{padding:22px 24px;color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:space-between;}
  .empty-tag{font-size:11px;background:#20242D;border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--text-dim);}

  .sub-obj-label{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text-dim);margin:18px 0 10px;text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;gap:8px;}
  .sub-obj-label:first-child{margin-top:0;}

  .rep-drill-row{cursor:pointer;}
  .rep-drill-row:hover{background:#1C202A;}
  .line-sub{display:none;}
  .line-sub.open{display:table-row;}
  .line-sub td{background:var(--card-alt);padding:0;}
  .line-sub-inner{padding:10px 24px 14px 40px;}
  .line-sub table{font-size:12.5px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#2A2E38;border-radius:4px;}
</style>
</head>

function repGoalPct(d){ return d.reps_total ? (d.reps_at_goal/d.reps_total)*100 : 0; }

function pctOf(o){
  if(!o.hasData) return 0;
  if(o.key==='new_belgium') return Math.min(DATA.new_belgium.company_pct,100);
  if(o.key==='sapporo_famosa'){
    return (repGoalPct(DATA.sapporo_light) + repGoalPct(DATA.famosa)) / 2;
  }
  return 0;
}

function renderKPIs(){
  const strip = document.getElementById('kpi-strip');
  const weighted = OBJECTIVES.reduce((s,o)=>s+o.weight*pctOf(o),0);
  const kpis = [
    {label:'Weighted MPO Complete', val: weighted.toFixed(0)+'%', cls: weighted>=90?'good':(weighted>=50?'':'warn'), sub:'across all 4 objectives'},
    {label:'New Belgium Dist. Goal', val: DATA.new_belgium.company_pct.toFixed(1)+'%', cls: DATA.new_belgium.company_pct>=90?'good':'warn', sub: DATA.new_belgium.reps_hit90+' / '+DATA.new_belgium.reps_total+' reps at 90%+'},
    {label:'Sapporo Light – Reps at Goal', val: DATA.sapporo_light.reps_at_goal+' / '+DATA.sapporo_light.reps_total, cls:'warn', sub:'5 placements each'},
    {label:'Famosa 7oz – Reps at Goal', val: DATA.famosa.reps_at_goal+' / '+DATA.famosa.reps_total, cls: DATA.famosa.reps_at_goal>0?'good':'warn', sub:'5 placements each'},
  ];
  kpis.forEach(k=>{
    const el = document.createElement('div');
    el.className='kpi';
    el.innerHTML = `<div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div><div class="kpi-sub">${k.sub}</div>`;
    strip.appendChild(el);
  });
}
renderKPIs();

function makeSortable(table){
  const ths = table.querySelectorAll('th[data-key]');
  ths.forEach(th=>{
    th.addEventListener('click',(e)=>{
      e.stopPropagation();
      const key = th.dataset.key;
      const type = th.dataset.type || 'string';
      const tbody = table.querySelector('tbody');
      const rows = Array.from(tbody.querySelectorAll('tr')).filter(r=>!r.classList.contains('line-sub'));
      const asc = th.dataset.asc !== 'true';
      ths.forEach(t=>t.dataset.asc='');
      th.dataset.asc = asc;
      rows.sort((a,b)=>{
        let av = a.dataset[key], bv = b.dataset[key];
        if(type==='num'){ av=parseFloat(av)||0; bv=parseFloat(bv)||0; return asc? av-bv : bv-av; }
        return asc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
      });
      rows.forEach(r=>{
        tbody.appendChild(r);
        const sub = r.nextElementSibling;
        if(sub && sub.classList.contains('line-sub')) tbody.appendChild(sub);
      });
    });
  });
}

    makeSortable(slTable);

    const fmLabel = document.createElement('div');
    fmLabel.className='sub-obj-label';
    fmLabel.innerHTML = `Famosa 7oz Urban Market <span class="goal-tag">${target_fm} per rep</span> — ${DATA.famosa.reps_at_goal} / ${DATA.famosa.reps_total} reps at goal`;
    inner.appendChild(fmLabel);
    const fmRows = DATA.famosa.reps.map(r=>{
      const rp = Math.min(r.count/target_fm,1)*100;
      const hit = r.count>=target_fm;
      return `<tr data-rep="${r.rep}" data-count="${r.count}"><td>${r.rep}</td><td class="num"><span class="mini-bar-track"><span class="mini-bar-fill" style="width:${rp}%"></span></span>${r.count} / ${target_fm}</td><td>${hit?'<span class="flag-hit">✓ At goal</span>':'<span class="flag-miss">In progress</span>'}</td></tr>`;
    }).join('');
    const fmTable = document.createElement('table');
    fmTable.innerHTML = `<thead><tr><th data-key="rep">Rep</th><th data-key="count" data-type="num">Placements</th><th>Status</th></tr></thead><tbody>${fmRows}</tbody>`;
    inner.appendChild(fmTable);
    makeSortable(fmTable);

    const lineLabel = document.createElement('div');
    lineLabel.className='sub-obj-label';
    lineLabel.textContent = 'Line Items — Sapporo Light';
    inner.appendChild(lineLabel);
    const slLineRows = DATA.sapporo_light.lines.map(l=>`<tr data-rep="${l.rep}" data-customer="${l.customer}" data-date="${l.date}" data-count="${l.count}"><td>${l.rep}</td><td>${l.customer}</td><td>${l.product}</td><td>${l.date}</td><td class="num">${l.count}</td></tr>`).join('');
    const slLineTable = document.createElement('table');
    slLineTable.innerHTML = `<thead><tr><th data-key="rep">Rep</th><th data-key="customer">Customer</th><th>Product</th><th data-key="date">Date</th><th data-key="count" data-type="num">Count</th></tr></thead><tbody>${slLineRows}</tbody>`;
    inner.appendChild(slLineTable);
    makeSortable(slLineTable);

    const lineLabel2 = document.createElement('div');
    lineLabel2.className='sub-obj-label';
    lineLabel2.textContent = 'Line Items — Famosa 7oz';
    inner.appendChild(lineLabel2);
    const fmLineRows = DATA.famosa.lines.map(l=>`<tr data-rep="${l.rep}" data-customer="${l.customer}" data-date="${l.date}" data-count="${l.count}"><td>${l.rep}</td><td>${l.customer}</td><td>${l.product}</td><td>${l.date}</td><td class="num">${l.count}</td></tr>`).join('');
    const fmLineTable = document.createElement('table');
    fmLineTable.innerHTML = `<thead><tr><th data-key="rep">Rep</th><th data-key="customer">Customer</th><th>Product</th><th data-key="date">Date</th><th data-key="count" data-type="num">Count</th></tr></thead><tbody>${fmLineRows}</tbody>`;
    inner.appendChild(fmLineTable);
    makeSortable(fmLineTable);
  }

  body.appendChild(inner);
  card.appendChild(body);
  container.appendChild(card);
});

document.querySelectorAll('.obj-card')[0]?.classList.add('open');
</script>
</body>
</html>
