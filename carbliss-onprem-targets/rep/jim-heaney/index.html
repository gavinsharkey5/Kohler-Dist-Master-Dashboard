<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbliss On-Premise Targets</title>
<!-- Home-screen install (iPad / iPhone "Add to Home Screen", Android/Chrome "Install"): the
     app opens full-screen at /rep/ with the Kohler icon. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dist Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --canvas:#0C0D11; --card:#15171E; --card2:#1B1E27; --ink:#F4F5F7; --ink-soft:#9097A6;
  --line:#262A35; --line-soft:#1F222B;
  --accent:#E5197D; --accent2:#B0125F;      /* Carbliss pink */
  --gold:#E8C45A; --gold-soft:#332B12;
  --amber:#E6B23C; --amber-soft:#332711;
  --green:#37C46B; --green-soft:#15301E;
  --red:#E0603E; --red-soft:#33170F;
  --gray:#7C8394; --gray-soft:#1D2029;
  --sc:#F2A900; --wc:#2FC9C2;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);min-height:100vh;
  font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
.num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
a{color:inherit;text-decoration:none}

.gx-head{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.gx-head::before{content:"";position:absolute;inset:-40% -10% auto;height:260px;
  background:radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);pointer-events:none}
.gx-head .wrap{position:relative;padding:24px 16px 18px}
.eyebrow{font-family:"Space Grotesk";letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:600;
  color:var(--accent);margin:0 0 9px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);margin:0 0 8px}
.lede{color:var(--ink-soft);font-size:14.5px;max-width:760px;margin:0}
.updated{color:var(--ink-soft);font-size:12px;margin-top:12px}

.stats{max-width:1200px;margin:20px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,240px));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-val{font-family:"Space Grotesk";font-size:22px;font-weight:700}
.stat-val.down{color:var(--red)}
.stat-val.up{color:var(--green)}
.stat-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.goalbar{max-width:1200px;margin:12px auto 0;padding:0 16px}
.goalbar-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.goalbar-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px}
.goalbar-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.goalbar-count{font-family:"Space Grotesk";font-size:15px;font-weight:700}
.goalbar-count .of{font-size:12px;font-weight:600;color:var(--ink-soft)}
.goalbar-track{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.goalbar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px}
/* Rep leaderboard (2026-09-30): rank · rep · accounts carrying Carbliss of their target accounts */
.lb-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;margin-bottom:6px}
.lb-when{font-size:12.5px;color:var(--ink-soft)}
.lb-rows{margin:6px -6px 0}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line-soft)}
.lb-row:first-child{border-top:0}
.lb-rank{flex:none;width:26px;text-align:center;font-family:"Space Grotesk";font-weight:700;font-size:13px;color:var(--ink-soft)}
.lb-rank small{font-size:10px;font-weight:500;margin-left:1px}
.lb-who{flex:1;min-width:0}
.lb-who b{font-size:14.5px}
.lb-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.lb-track{height:5px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.lb-track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green))}
.lb-val{flex:none;text-align:right;font-family:"Space Grotesk";font-weight:700;font-size:16px;white-space:nowrap}
.lb-val small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:500}
.lb-row.me{background:color-mix(in srgb,var(--gold) 12%,transparent);box-shadow:inset 3px 0 0 var(--gold);border-radius:6px}
.lb-you{display:inline-block;font-size:10.5px;font-weight:600;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.lb-note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:10px 0 0}
.lb-note b{color:var(--ink)}
details.lb-fold summary{cursor:pointer;font-size:13px;color:var(--ink-soft);margin-top:8px;list-style:none;min-height:36px;display:flex;align-items:center}
details.lb-fold summary::-webkit-details-marker{display:none}

main{max-width:1200px;margin:20px auto 60px;padding:0 16px}

.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:20px}
.badge.new{background:var(--green-soft);color:var(--green)}
.badge.lapsed{background:var(--red-soft);color:var(--red)}
.badge.hascarb{background:var(--gold-soft);color:var(--gold)}
.badge.fell{background:var(--red-soft);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 35%,transparent)}
.badge.l90{background:var(--green-soft);color:var(--green)}
/* Pitch is the first column (2026-09-30, per Gavin): narrow, the button only */
.col-pitch{width:64px;white-space:nowrap}
/* sell-sheet picker in the pitch panel */
.pitch-hint{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-soft)}
.sheets{display:flex;flex-wrap:wrap;gap:8px}
.sheet{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;text-decoration:none;line-height:1.2}
.sheet small{font-size:10.5px;font-weight:500;color:var(--ink-soft)}
.sheet.rec{border-color:var(--gold);background:var(--gold-soft)} .sheet.rec small{color:var(--gold)}
.sheet.on{border-style:dashed} .sheet.on small{color:var(--green)}
.sheet.off{opacity:.55;cursor:default}
a.sheet:hover{border-color:var(--accent);color:var(--accent)}
/* YTD vs rolling-90 buyers card */
.btiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.btile{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btile.alert{border-color:color-mix(in srgb,var(--red) 45%,var(--line))} .btile.alert .stat-val{color:var(--red)}
.fell-list{margin-top:6px}
.fell-row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.fell-row:first-child{border-top:0}
.fell-name{flex:1 1 200px;font-weight:600}
.fell-note{font-weight:400;color:var(--ink-soft);font-size:11.5px}
.fell-rep{color:var(--ink-soft)}
.fell-when{color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:620px){ .btiles{grid-template-columns:1fr 1fr} .btiles .btile.alert{grid-column:1 / -1} }

/* ---- filter toolbar ---- */
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;box-shadow:var(--shadow)}
.tgroup{display:flex;flex-direction:column;gap:5px}
.tgroup label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
.tgroup input[type=number], .tgroup select, .tgroup input[type=search], .tgroup input[type=text]{
  background:var(--canvas);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:16px;
  font-family:"Inter";min-width:110px;min-height:44px}
.tgroup input[type=search], .tgroup input[type=text]{min-width:220px}
.tgroup input:focus, .tgroup select:focus{outline:2px solid var(--accent);outline-offset:1px}
.toolbar .divider{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none;
  min-height:44px;padding:6px 4px}
.check input{accent-color:var(--accent);width:17px;height:17px}
.result-count{margin-left:auto;font-size:12.5px;color:var(--ink-soft);align-self:center}

/* ---- table ---- */
.table-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.table-scroll{overflow-x:auto}
/* a signed-in rep's page: every row is theirs, so the Rep column says nothing (2026-09-30) */
html.kdh-rep .col-rep{display:none}
table{width:100%;min-width:820px;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#191B23;text-align:left;padding:9px 10px;font-size:10px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-soft);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;z-index:2}
thead th:hover{color:var(--accent)}
thead th.sorted::after{content:" \25BE";color:var(--accent)}
thead th.sorted-asc::after{content:" \25B4";color:var(--accent)}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody td:first-child{white-space:normal;word-break:break-word;min-width:160px}
tbody tr:hover{background:var(--card-h)}
tbody tr.is-open td{background:var(--card2)}
tbody tr.is-open .pitch-btn{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.num-cell{text-align:right;font-variant-numeric:tabular-nums}
.status-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.status-badge.yes{background:var(--gold-soft);color:var(--gold)}
.status-badge.no{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.gap-pill{font-family:"Space Grotesk";font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);white-space:nowrap}
.rtd-bar{display:flex;height:7px;width:56px;border-radius:4px;overflow:hidden;background:var(--line-soft)}
.rtd-bar i{display:block;height:100%}
.rtd-bar .b-sc{background:var(--sc)}
.rtd-bar .b-wc{background:var(--wc)}
.pitch-btn{font-family:"Inter";font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:7px;padding:7px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
.pitch-btn:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.pitch-row td{background:var(--card2);white-space:normal!important;padding:16px 18px;border-top:0}
.pitch-box{display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;gap:20px;flex-wrap:wrap}
.brandcell{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}
.brandcell .bl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.brandcell .bv{font-family:"Space Grotesk";font-size:15px;font-weight:700}
.brandcell .bv .arrow{color:var(--ink-soft);font-weight:400;margin:0 4px}
.pitch-label{font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.pitch-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.pitch-list>li{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;
  font-size:13.5px;color:var(--ink);line-height:1.45;display:flex;gap:8px}
.pitch-list .plabel{flex-shrink:0;font-weight:700;color:var(--accent);white-space:nowrap}
.sub-list{list-style:disc;margin:2px 0 0 18px;padding:0;display:flex;flex-direction:column;gap:4px;flex:1}
.sub-list li{display:list-item}
.flavors{display:flex;gap:6px;flex-wrap:wrap}
.ftag{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(232,196,90,.25)}
.copy-btn{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--card2);border:1px solid var(--line);
  border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap;align-self:flex-start;min-height:36px}
.copy-btn:hover{color:var(--ink);border-color:var(--accent)}
.copy-btn.copied{color:var(--good);border-color:var(--good)}
.empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 16px;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line-soft)}

footer{max-width:1200px;margin:0 auto 60px;padding:0 16px;color:var(--ink-soft);font-size:12.5px;line-height:1.6}
footer p{margin:0 0 8px}
footer b{color:var(--ink)}

::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

@media(max-width:620px){
  .toolbar{padding:12px}
  /* phones (2026-09-30): tiles two-up across the full width, filters full width */
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats > .stat:nth-child(3):last-child{grid-column:1 / -1}
  .tgroup{flex:1 1 100%;width:100%}
  .tgroup input[type=search], .tgroup input[type=text], .tgroup select, .tgroup input[type=number]{min-width:0;width:100%}
  .pitch-row td{padding:14px}
  /* the account name stays put while the numbers scroll sideways */
  .table-scroll th:first-child,.table-scroll td:first-child{position:sticky;left:0;z-index:1;background:var(--card);min-width:64px;width:64px}
  .table-scroll th:nth-child(2),.table-scroll td:nth-child(2){position:sticky;left:64px;z-index:1;background:var(--card);min-width:150px;max-width:190px;box-shadow:2px 0 0 var(--line);white-space:normal}
  .table-scroll td:nth-child(2) .badge{display:inline-block;margin-top:3px}
  .table-scroll thead th:first-child,.table-scroll thead th:nth-child(2){z-index:2}
  .pitch-row td:first-child{position:static;min-width:0;max-width:none;box-shadow:none}
}

/* ---- LEADERBOARD CLEANUP (2026-10-06, Gavin): everything centered, evenly spaced and legible; the
   accounts table fits a phone with no sideways scroll (one labelled block per account under 900px). ---- */
.gx-head .wrap{text-align:center;max-width:960px;padding:26px 16px 22px}
.eyebrow{justify-content:center;font-size:13px;letter-spacing:.04em;text-transform:none}
h1{font-size:clamp(26px,5vw,34px)}
.lede{margin:0 auto;font-size:16px;line-height:1.5;max-width:640px}
.updated{font-size:14px;margin-top:10px}
.stats{max-width:960px;margin:22px auto 0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{text-align:center;padding:16px 14px}
.stat-label{font-size:14px;text-transform:none;letter-spacing:0;font-weight:600;margin-bottom:4px}
.stat-val{font-size:30px;line-height:1.15}
.stat-sub{font-size:14px;line-height:1.4;margin-top:4px}
.goalbar{max-width:960px;margin:14px auto 0}
.goalbar-card{text-align:center;padding:18px 16px}
.goalbar-head{justify-content:center;text-align:center;gap:4px 14px;margin-bottom:10px}
.goalbar-label{font-size:14px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink)}
.goalbar-count{font-size:17px}
.goalbar-count .of{font-size:14px}
.lb-head{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;margin-bottom:12px}
.lb-when{font-size:14px}
.lb-rows{margin:8px 0 0}
.lb-row{gap:12px;padding:12px 8px}
.lb-rank{width:40px;font-size:16px}
.lb-who{text-align:center}
.lb-who b{font-size:16px}
.lb-sub{font-size:14px;margin-top:2px}
.lb-track{height:6px;margin:8px auto 0;max-width:420px}
.lb-val{width:84px;text-align:center;font-size:20px}
.lb-val small{font-size:12.5px;margin-top:1px}
.lb-you{font-size:12.5px}
.lb-note{font-size:14px;line-height:1.6;margin-top:14px;text-align:center}
details.lb-fold summary{justify-content:center;font-size:15px;color:var(--ink)}
.btiles{gap:12px;margin-top:10px}
.btile{text-align:center;padding:14px 12px}
.fell-list{margin-top:8px}
.fell-row{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 0;font-size:15px}
.fell-name{flex:none;font-size:16px}
.fell-note{font-size:13px}
.fell-rep,.fell-when{font-size:14px}
.toolbar{max-width:none;margin:0 0 16px;justify-content:center;align-items:flex-end;gap:14px 16px;text-align:center}
.tgroup{align-items:center}
.tgroup label{font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.tgroup select,.tgroup input[type=search],.tgroup input[type=text],.tgroup input[type=number]{text-align:center;text-align-last:center}
.toolbar .divider{display:none}
.check{justify-content:center;font-size:15px;color:var(--ink)}
.result-count{margin:0 auto;flex:1 1 100%;text-align:center;font-size:14px}
.sort-mobile{display:none}
main{max-width:1200px}
.table-scroll{overflow-x:visible}
table{min-width:0;table-layout:auto;font-size:15px}
thead th{position:static;text-align:center;text-transform:none;letter-spacing:0;font-size:13.5px;line-height:1.3;white-space:normal;padding:12px 8px;color:var(--ink)}
tbody td{text-align:center;vertical-align:middle;white-space:normal;padding:12px 8px}
tbody td:first-child{min-width:0}
tbody td:nth-child(2){min-width:150px}
.num-cell{text-align:center}
.num-cell > div{justify-content:center!important}
.badge{display:inline-block;margin:4px 2px 0;font-size:12px;text-transform:none;letter-spacing:0;white-space:normal}
.status-badge,.gap-pill{font-size:13px}
.pitch-btn,.copy-btn{font-size:14px;min-height:40px}
.legend{justify-content:center;text-align:center;font-size:14px;gap:8px 18px;padding:14px 16px}
footer{max-width:960px;text-align:center;font-size:14px}
.pitch-row td{text-align:left}
.pitch-label{justify-content:center}
.rtd-bar{width:44px}
@media(max-width:899px){
  html.kdh-rep #acctTable .col-rep{display:none!important}
  .sort-mobile{display:flex}
  .table-panel{overflow:visible}
  #acctTable,#acctTable tbody{display:block;width:100%;min-width:0}
  #acctTable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #acctTable tbody tr:not(.pitch-row){display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:18px 16px;border-bottom:1px solid var(--line);text-align:center;align-items:start}
  #acctTable tbody tr:not(.pitch-row) td{display:block;border:0;padding:0;min-width:0!important;max-width:none!important;width:auto!important;position:static!important;box-shadow:none!important;background:transparent!important;white-space:normal}
  #acctTable tbody tr.is-open{background:var(--card2)}
  #acctTable td:nth-child(2){grid-column:1/-1;order:-3;font-size:17px;font-weight:700;line-height:1.3}
  #acctTable td:nth-child(4){grid-column:1/-1;order:-2;font-size:15px;color:var(--ink-soft);margin-top:-6px}
  #acctTable td:nth-child(3){grid-column:1/-1;order:-1;font-size:14px;color:var(--ink-soft)}
  #acctTable td:nth-child(3)::before{content:"Rep: "}
  #acctTable td:nth-child(n+5):nth-child(-n+9){background:var(--card2)!important;border-radius:10px;padding:10px 6px!important}

<script>
const DATA = JSON.parse(document.getElementById('tg-data').textContent);
const fmt = n => Math.round(n).toLocaleString();
const pct = (a,b) => b>0 ? ((a-b)/b*100) : (a>0?100:0);

const DEFAULT_THRESH = 10;

const state = {
  search:'', rep:'', city:'', gapOnly:false, fellOnly:false,
  threshOn: DEFAULT_THRESH,
  sortKey:'total26', sortDir:-1,
  openPitch:null
};

function isGap(a){ return !a.existingCarbliss.length && a.total26 >= state.threshOn; }
const shortDate = iso => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+d); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
// Company-wide on-premise Carbliss goal (matches the /carbliss/ tracker's
// fixed target of 331 on-premise accounts carrying Carbliss). withCarbliss
// here counts accounts with real 2026 Carbliss volume within this file's
// Sun Cruiser/White Claw-evaluated account set, not every on-premise
// account company-wide -- so this progress bar is a lower bound on true
// company-wide progress toward 331, not the authoritative count.
const ONPREM_CARBLISS_GOAL = 331;

function renderGoal(){
  const count = DATA.meta.withCarbliss;
  const goal = ONPREM_CARBLISS_GOAL;
  const pct = Math.min(100, (count/goal*100));
  document.getElementById('goalbar').innerHTML = `
    <div class="goalbar-card">
      <div class="goalbar-head">
        <div class="goalbar-label">On-Premise Carbliss Goal</div>
        <div class="goalbar-count">${fmt(count)}<span class="of"> of ${goal} Accounts</span></div>
      </div>
      <div class="goalbar-track"><div class="goalbar-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="stat-sub">Accounts carrying Carbliss</div>
    </div>`;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function populateSelects(reps){
  const repSel = document.getElementById('repFilter');
  reps.forEach(r=>{ const opt = document.createElement('option'); opt.value=r; opt.textContent=r; repSel.appendChild(opt); });
}

// The data date is the build stamp generate.py writes into the data (the exports carry no report date).
const DATA_DATE = DATA.meta.generatedAt ? new Date(DATA.meta.generatedAt+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
document.getElementById('updated').textContent = DATA.meta.buyers && DATA.meta.buyers.asOf ? 'Data through ' + new Date(DATA.meta.buyers.asOf+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';

// Signed-in rep lock (kohlerdisthub.com, 2026-09-25): a rep sees only
// their own accounts -- the rep filter is pinned and hidden, and the
// stats and goal bar describe their book instead of the company. A rep
// with no accounts in this file gets a note. Managers: unchanged.
const LOCK_REP=(()=>{try{const u=window.kdhUser?window.kdhUser():null; if(!(u&&u.role!=='manager'&&u.name)) return null;
  // the allow list may spell the rep differently from the export: match forgivingly against the reps in the data
  const reps=[...new Set(DATA.accounts.map(a=>a.rep).filter(Boolean))];
  return (window.kdhMatchName ? window.kdhMatchName(u.name, reps) : null) || u.name;}catch(e){return null;}})();
if(LOCK_REP){
  state.rep = LOCK_REP;
  const grp = document.getElementById('repFilter').closest('.tgroup'); if(grp) grp.style.display='none';
  const mine = DATA.accounts.filter(a=>a.rep===LOCK_REP);
  renderGoal = function(){
    const count = mine.filter(a=>a.existingCarbliss.length).length, total = mine.length;
    const pct = total ? Math.min(100, count/total*100) : 0;
    document.getElementById('goalbar').innerHTML = total ? `
    <div class="goalbar-card">
      <div class="goalbar-head">
        <div class="goalbar-label">Your Accounts With Carbliss</div>
        <div class="goalbar-count">${fmt(count)}<span class="of"> of ${fmt(total)} Accounts</span></div>
      </div>
      <div class="goalbar-track"><div class="goalbar-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="stat-sub">Your Sun Cruiser / White Claw accounts</div>
    </div>` : `<div class="goalbar-card"><div class="goalbar-label">Your Accounts With Carbliss</div><div class="stat-sub">No Sun Cruiser or White Claw accounts on your route.</div></div>`;
  };
}
// District manager (2026-09-29, per Gavin): only their team's accounts,
// the rep filter offers only their reps, and the stats + goal bar describe
// the team's book. The rep -> DM map is shared/dm-groups.js; Carbliss may
// spell a rep differently from the trackers, so each name is matched the
// forgiving way against the reps in this file.
const LOCK_TEAM=(()=>{try{
  if(LOCK_REP || !window.kdhTeam || !window.KDH_DM_GROUPS) return null;
  const T = window.kdhTeam(window.KDH_DM_GROUPS); if(!T) return null;
  const reps=[...new Set(DATA.accounts.map(a=>a.rep).filter(Boolean))];
  const mine=new Set(); T.reps.forEach(n=>{ const m = window.kdhMatchName ? window.kdhMatchName(n, reps) : (reps.includes(n) ? n : null); if(m) mine.add(m); });
  return {dm:T.dm, reps:mine};
}catch(e){return null;}})();
if(LOCK_TEAM){
  const book = DATA.accounts.filter(a=>LOCK_TEAM.reps.has(a.rep));
  renderGoal = function(){
    const count = book.filter(a=>a.existingCarbliss.length).length, total = book.length;
    const pct = total ? Math.min(100, count/total*100) : 0;
    document.getElementById('goalbar').innerHTML = total ? `
    <div class="goalbar-card">
      <div class="goalbar-head">
        <div class="goalbar-label">Your Team's Accounts With Carbliss</div>
        <div class="goalbar-count">${fmt(count)}<span class="of"> of ${fmt(total)} Accounts</span></div>
      </div>
      <div class="goalbar-track"><div class="goalbar-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="stat-sub">Your team's Sun Cruiser / White Claw accounts</div>
    </div>` : `<div class="goalbar-card"><div class="goalbar-label">Your Team's Accounts With Carbliss</div><div class="stat-sub">No Sun Cruiser or White Claw accounts on your team's routes.</div></div>`;
  };
}
// REP LEADERBOARD (2026-10-06, Gavin): every participating rep ranked by ROLLING-90 buyers -- the accounts
// in their own on-premise account base (the same base as the October MPO card) with a Carbliss load sheet
// the RDE flags as rolling 90. Ties on the count break on the share of their own base, then on name; reps
// still level share a rank (1, 2, 2, 4). The numbers come from carbliss-mpo/data/program.json's `board`
// (counts per rep, no account names), so a rep's copy carries every rep's row; the signed-in rep's own row
// is marked.
function renderBoard(P){
  const el = document.getElementById('leaderboard'); if(!el) return;
  const names = P.board.map(b=>b.rep);
  const me = LOCK_REP ? (window.kdhMatchName ? window.kdhMatchName(LOCK_REP, names) : (names.includes(LOCK_REP)?LOCK_REP:null)) : null;
  const rows = P.board.filter(b=>(!window.kdhIsRep || window.kdhIsRep(b.rep)) && b.base>0)
    .map(b=>({rep:b.rep, count:b.l90, total:b.base, share:b.l90/b.base}))
    .sort((a,b)=>b.count-a.count || b.share-a.share || a.rep.localeCompare(b.rep));
  let rank=0; rows.forEach((r,i)=>{ if(!i || r.count!==rows[i-1].count || r.share!==rows[i-1].share) rank=i+1; r.rank=rank; });
  rows.forEach((r,i)=>{ r.tied = (i>0 && rows[i-1].rank===r.rank) || (i<rows.length-1 && rows[i+1].rank===r.rank); });
  const mine = me ? rows.find(r=>r.rep===me) : null;
  const M = DATA.meta.buyers || {};
  const rowHtml = r=>`<div class="lb-row${r.rep===me?' me':''}"${r.rep===me?' aria-current="true"':''}><span class="lb-rank">${r.rank}${r.tied?'<small>=</small>':''}</span>
      <span class="lb-who"><b>${esc(r.rep)}${r.rep===me?' <span class="lb-you">you</span>':''}</b><div class="lb-sub">${fmt(r.count)} of ${fmt(r.total)} Accounts · ${Math.round(r.share*100)}%</div><div class="lb-track"><i style="width:${Math.min(100,r.share*100).toFixed(1)}%"></i></div></span>
      <span class="lb-val">${fmt(r.count)}<small>L90 Buyers</small></span></div>`;
  const top = rows.slice(0, 10), rest = rows.slice(10);
  el.innerHTML = `<div class="goalbar-card">
      <div class="lb-head"><div class="goalbar-label">Rep Leaderboard</div><div class="lb-when">L90 Buyers · ${esc(shortDate(M.windowStart))} – ${esc(shortDate(M.asOf))}</div></div>
      ${mine ? `<div class="stat-sub">You are <b>#${mine.rank}${mine.tied?' (tied)':''}</b> of ${rows.length}</div>` : ''}
      <div class="lb-rows">${top.map(rowHtml).join('')}</div>
      ${rest.length ? `<details class="lb-fold"${mine && mine.rank>10 ? ' open' : ''}><summary>Show ${rest.length} More Reps</summary><div class="lb-rows">${rest.map(rowHtml).join('')}</div></details>` : ''}
      <p class="lb-note">Ranked by L90 buyers. Ties go to the higher share of accounts.</p>
    </div>`;
}
// CARBLISS BUYERS: YTD vs ROLLING 90 (2026-09-30, per Gavin -- "Carbliss is
// tracking a rolling 90 day customer tracker"). From carbliss_buyers_l90.csv:
// an account is a YTD buyer when it has any Carbliss load sheet this year and
// a rolling-90 buyer when one falls inside the last 90 days; YTD without a
// rolling-90 load sheet = "fell off rolling 90", the alert reps act on. Scope
// follows the page: a rep sees their own, a DM their team, a manager everyone
// or the rep picked in the filter. Buyers outside the Sun Cruiser / White
// Claw target list are counted here (they are Carbliss buyers all the same)
// and flagged as not in the table below.
function renderBuyers(){
  const el = document.getElementById('buyers'); if(!el) return;
  const M = DATA.meta.buyers || {}; const all = DATA.buyers || [];
  if(!all.length && !M.rows){ el.innerHTML=''; return; }   // a rep's copy holds only their buyers: zero is still a result
  const scopeRep = LOCK_REP || state.rep || '';
  const inScope = b => scopeRep ? b.rep===scopeRep : (LOCK_TEAM ? LOCK_TEAM.reps.has(b.rep) : true);
  const rows = all.filter(inScope);
  const ytd = rows.filter(b=>b.ytd).length, l90 = rows.filter(b=>b.l90).length, fell = rows.filter(b=>b.fell);
  const who = scopeRep ? (LOCK_REP ? 'Your' : scopeRep+'’s') : (LOCK_TEAM ? 'Your Team’s' : 'Company');
  fell.sort((a,b)=>(b.last||'').localeCompare(a.last||'') || a.name.localeCompare(b.name));
  const list = fell.map(b=>`<div class="fell-row"><span class="fell-name">${esc(b.name)}</span>${!LOCK_REP?`<span class="fell-rep">${esc(b.rep)}</span>`:''}<span class="fell-when">Last ${esc(shortDate(b.last))}</span></div>`).join('');
  el.innerHTML = `<div class="goalbar-card buyers-card">
      <div class="lb-head"><div class="goalbar-label">${who} Carbliss Buyers</div><div class="lb-when">L90: ${esc(shortDate(M.windowStart))} – ${esc(shortDate(M.asOf))}</div></div>
      <div class="btiles">
        <div class="btile"><div class="stat-label">YTD Buyers</div><div class="stat-val">${fmt(ytd)}</div><div class="stat-sub">Since launch</div></div>
        <div class="btile"><div class="stat-label">L90 Buyers</div><div class="stat-val">${fmt(l90)}</div><div class="stat-sub">${ytd ? Math.round(l90/ytd*100) : 0}% of YTD</div></div>
        <div class="btile alert"><div class="stat-label">Fell Off L90</div><div class="stat-val">${fmt(fell.length)}</div><div class="stat-sub">No buy in 90 days</div></div>
      </div>
      ${fell.length ? `<details class="lb-fold"${LOCK_REP || scopeRep ? ' open' : ''}><summary>${fell.length===1 ? '1 Account' : fell.length+' Accounts'} to Win Back</summary><div class="fell-list">${list}</div></details>` : `<p class="lb-note">No accounts fell off.</p>`}
    </div>`;
}
renderGoal();
renderBuyers();

// ---- ROSTER (2026-10-06, Gavin): sales rep -> their accounts, with L90 buyer, YTD buyer and last purchase.
// Rows are the rep's whole on-premise account base from carbliss-mpo/data/program.json (a rep is served only
// their own copy; a manager gets everyone, a DM only their team in the filter). YTD = bought since launch.
let PROG = null;
const rs = {q:'', rep:'', l90:'', ytd:'', open:new Set()};
const yn = (ok, yes, no) => ok ? `<span class="yn y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${yes}</span>`
                         : `<span class="yn n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>${no}</span>`;
const longDate = iso => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+d)+', '+y; };
function rosterScope(P){
  const names = P.board.map(b=>b.rep).filter(r=>!window.kdhIsRep || window.kdhIsRep(r));
  if(LOCK_REP){ const me = window.kdhMatchName ? window.kdhMatchName(LOCK_REP, names) : (names.includes(LOCK_REP)?LOCK_REP:null); return me ? [me] : []; }
  if(LOCK_TEAM) return names.filter(n=>[...LOCK_TEAM.reps].some(t=>window.kdhMatchName ? window.kdhMatchName(t,[n]) : t===n));
  return names;
}
function acctHref(a, rep){
  const mgr = !LOCK_REP && window.kdhUser && (window.kdhUser()||{}).role==='manager' && !(window.kdhUser()||{}).preview;
  return '../accounts/#acct='+encodeURIComponent(a.n)+(mgr?'&rep='+encodeURIComponent(rep):'')+'&from='+encodeURIComponent(location.pathname+location.hash)+'&fl='+encodeURIComponent('Carbliss Leaderboard');
}
function rosterRows(P, rep){
  const q = rs.q.trim().toLowerCase();
  return P.accounts.filter(a=>a.rep===rep).filter(a=>{
    const ytd = a.since==='yes';
    if(rs.l90==='yes' && !a.l90) return false;
    if(rs.l90==='no' && a.l90) return false;
    if(rs.ytd==='yes' && !ytd) return false;
    if(rs.ytd==='no' && ytd) return false;
    if(q && !(a.name.toLowerCase().includes(q) || (a.town||'').toLowerCase().includes(q) || String(a.n).includes(q))) return false;
    return true;
  });
}
function rosterTable(rows, rep){
  return `<table class="rt"><thead><tr><th scope="col">Customer</th><th scope="col">L90 Buyer</th><th scope="col">YTD Buyer</th><th scope="col">Last Purchase</th></tr></thead><tbody>`+
    rows.map(a=>{
      const nm = a.page ? `<a class="rt-name" href="${esc(acctHref(a, rep))}">${esc(a.name)}</a>` : `<span class="rt-name">${esc(a.name)}</span>`;
      return `<tr><td class="rt-acct">${nm}<span class="rt-town">${esc(a.town||'')}</span></td>
        <td data-l="L90 Buyer">${yn(a.l90, 'Yes', 'No')}</td>
        <td data-l="YTD Buyer">${a.since==='unknown' ? '<span class="yn u">Unknown</span>' : yn(a.since==='yes', 'Yes', 'No')}</td>
        <td data-l="Last Purchase">${a.last ? `<span class="rt-date">${esc(longDate(a.last))}</span>` : '<span class="rt-none">None</span>'}</td></tr>`;
    }).join('')+`</tbody></table>`;
}
function renderRoster(){
  const P = PROG, el = document.getElementById('roster'); if(!P || !el) return;
  const scope = rosterScope(P);
  const reps = rs.rep && scope.includes(rs.rep) ? [rs.rep] : scope;
  const q = rs.q.trim();
  let shown = 0;
  const groups = reps.map(rep=>{
    const all = P.accounts.filter(a=>a.rep===rep), rows = rosterRows(P, rep);
    if((q || rs.l90 || rs.ytd) && !rows.length) return '';
    shown += rows.length;
    const l90 = all.filter(a=>a.l90).length, ytd = all.filter(a=>a.since==='yes').length;
    const open = reps.length===1 || !!q || !!rs.l90 || !!rs.ytd || rs.open.has(rep);
    return `<section class="rg${open?' open':''}"><button type="button" class="rg-h" data-rep="${esc(rep)}" aria-expanded="${open}">
        <b>${esc(rep)}</b><span class="rg-s"><b>${fmt(l90)}</b> L90 · <b>${fmt(ytd)}</b> YTD · ${fmt(all.length)} Accounts<i class="rg-chev"></i></span></button>
        ${open ? (rows.length ? `<div class="rt-wrap">${rosterTable(rows, rep)}</div>` : '<div class="empty slim">No accounts match.</div>') : ''}</section>`;
  }).join('');
  document.getElementById('count').textContent = `${shown.toLocaleString()} ${shown===1?'Account':'Accounts'}`;
  el.innerHTML = groups || '<div class="empty">No accounts match.</div>';
  const M = DATA.meta.buyers || {};
  document.getElementById('rosterNote').textContent = `L90 = bought in the last 90 days. YTD = bought since ${longDate(P.meta.launch)}.`;
}
document.getElementById('search').addEventListener('input', e=>{ rs.q=e.target.value; renderRoster(); });
document.getElementById('repFilter').addEventListener('change', e=>{ rs.rep=e.target.value; state.rep=e.target.value; renderBuyers(); renderRoster(); });
document.getElementById('l90Filter').addEventListener('change', e=>{ rs.l90=e.target.value; renderRoster(); });
document.getElementById('ytdFilter').addEventListener('change', e=>{ rs.ytd=e.target.value; renderRoster(); });
document.getElementById('roster').addEventListener('click', e=>{
  const h = e.target.closest('.rg-h'); if(!h) return;
  const rep = h.getAttribute('data-rep'); if(rs.open.has(rep)) rs.open.delete(rep); else rs.open.add(rep);
  renderRoster();
});
fetch('../carbliss-mpo/data/program.json', {cache:'no-cache', credentials:'same-origin'})
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(P=>{
    PROG = P;
    const scope = rosterScope(P);
    populateSelects(LOCK_REP ? [] : scope);
    renderBoard(P);
    if(LOCK_REP && !scope.length){ document.getElementById('roster').innerHTML = '<div class="empty">No accounts on file.</div>'; return; }
    renderRoster();
  })
  .catch(err=>{
    const m = '<div class="empty">Could not load. Reload to try again.</div>';
    document.getElementById('roster').innerHTML = m; const lb = document.getElementById('leaderboard'); if(lb) lb.innerHTML = '';
  });
</script>
</body>
</html>
