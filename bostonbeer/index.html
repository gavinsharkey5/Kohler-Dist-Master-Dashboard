<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boston Beer — Conversion & Sun Cruiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#0C0D11; --card:#15171E; --card2:#1B1E27; --ink:#F6F7F9; --ink-soft:#ABB2C2;
    --line:#262A35; --line-soft:#1F222B;
    --accent:#C8472E; --accent2:#9A2E1C;        /* Sam Adams red */
    --good:#37C46B; --good-soft:#15301E;
    --lock:#565E72;
    --gold:#E6B23C; --silver:#C3CAD6; --bronze:#C07B43;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);min-height:100vh;
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16.5px;line-height:1.52;
    padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}

  /* header */
  .gx-head{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .gx-head::before{content:"";position:absolute;inset:-40% -10% auto;height:240px;
    background:radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%);pointer-events:none}
  .gx-head .wrap{position:relative;padding:30px 18px 24px}
  .eyebrow{font-family:"Space Grotesk";letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:600;
    color:var(--accent);margin:0 0 9px;display:flex;align-items:center;gap:8px}
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:p 2.4s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
  h1{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.015em;font-size:clamp(30px,8vw,46px);line-height:.96;margin:0}
  .lede{margin:13px 0 0;max-width:60ch;color:var(--ink-soft);font-size:14px}
  .lede b{color:var(--accent)}
  .updated{margin:10px 0 0;font-size:11px;color:#6B7280;font-family:"Space Grotesk";letter-spacing:.04em}

  .note{margin:14px 0 0}
  .note .inner{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));
    border-radius:12px;padding:10px 13px;font-size:12.5px;color:color-mix(in srgb,var(--accent) 55%,var(--ink))}

  /* stat tiles */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:18px 0 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow)}
  .stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0}
  .stat .v{font-family:"Space Grotesk";font-weight:700;font-size:23px;margin:6px 0 0;line-height:1}
  .stat .v small{font-size:13px;color:var(--ink-soft);font-weight:500}
  .stat .v.accent{color:var(--accent)}

  /* chips */
  .seg{margin:22px 0 0}
  .seg .lbl{font-family:"Space Grotesk";font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:"Space Grotesk";font-weight:500;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#15140C;font-weight:600}
  .chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* section head */
  .shead{display:flex;align-items:center;gap:9px;margin:26px 0 12px}
  .shead h2{font-family:"Space Grotesk";font-weight:600;font-size:17px;margin:0}
  .shead .tr{color:var(--accent)}
  .shead .meta{margin-left:auto;font-size:12px;color:var(--ink-soft)}

  /* leaderboard */
  .board{display:flex;flex-direction:column;gap:9px}
  .lrow{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:13px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer;transition:.13s;position:relative;overflow:hidden}
  .lrow:hover{transform:translateY(-2px);border-color:#39404F}
  .lrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .lrow.top::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc)}
  .medal{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;
    font-size:16px;background:var(--card2);color:var(--ink-soft);border:1px solid var(--line)}
  .medal.m1{background:linear-gradient(160deg,#F4D06A,#C7892A);color:#1a1407;border:none}
  .medal.m2{background:linear-gradient(160deg,#E2E7EF,#A7AFBE);color:#1a1d24;border:none}
  .medal.m3{background:linear-gradient(160deg,#D79A63,#9B5E32);color:#1a1107;border:none}
  .who b{font-weight:600;font-size:15px}
  .who .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .who .track{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
  .who .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
  .win{font-family:"Space Grotesk";font-weight:700;font-size:18px;text-align:right;white-space:nowrap;color:var(--accent)}
  .win small{display:block;font-size:10px;color:var(--ink-soft);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

  /* hero (your standing) */
  .hero{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;
    padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:16px}
  .hero::before{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;
    background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
  .hero .top{display:flex;align-items:center;gap:16px;position:relative}
  .hero .rankbox{text-align:center}
  .hero .rankbox .big{font-family:"Space Grotesk";font-weight:700;font-size:38px;line-height:1;color:var(--accent)}
  .hero .rankbox .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:2px}
  .hero .nm{font-family:"Space Grotesk";font-weight:700;font-size:21px}
  .hero .nm small{display:block;font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px;font-family:"Inter"}
  .hero .win2{margin-left:auto;text-align:right}
  .hero .win2 .b{font-family:"Space Grotesk";font-weight:700;font-size:26px;color:var(--accent)}
  .hero .win2 .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
  .pips{display:flex;gap:6px;margin:16px 0 0;position:relative;flex-wrap:wrap}
  .pip{flex:1;min-width:28px;height:8px;border-radius:5px;background:var(--line)}
  .pip.on{background:linear-gradient(90deg,var(--good),#2aa657)}
  .hero .pl{font-size:11px;color:var(--ink-soft);margin:9px 0 0;position:relative;letter-spacing:.02em}

  /* quest cards */
  .quest{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:0 0 11px;box-shadow:var(--shadow)}
  .quest .sup{font-family:"Space Grotesk";font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .badge{font-family:"Space Grotesk";font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .badge.ok{background:var(--good-soft);color:#5fdc8c;border:1px solid #245834}
  .badge.prog{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .badge svg{width:11px;height:11px}
  .qline{font-size:12.5px;color:var(--ink-soft);margin:13px 0 7px;display:flex;justify-content:space-between}
  .qline .num{color:var(--ink);font-weight:600}
  .bar{height:11px;border-radius:7px;background:var(--line);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2));position:relative}
  .bar.done i{background:linear-gradient(90deg,#3FD074,var(--good));box-shadow:0 0 12px color-mix(in srgb,var(--good) 60%,transparent)}
  .brk{margin:11px 0 2px;border-top:1px solid var(--line-soft);padding-top:10px}
  .brk .cap{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;font-family:"Space Grotesk"}
  .brow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-soft);padding:4px 0}
  .brow .num{color:var(--ink);font-weight:600;white-space:nowrap}
  .brow small{color:var(--ink-soft);font-weight:500}
  .amp{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .amp .l{color:var(--ink-soft);font-size:12.5px}
  .amp .v{font-family:"Space Grotesk";font-weight:700;font-size:17px}
  .amp .v.earn{color:var(--accent)}
  .amp .v.locked{color:var(--lock);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .amp .v.locked svg{width:13px;height:13px}

  .empty{max-width:540px;margin:70px auto;text-align:center;color:var(--ink-soft)}
  .empty h2{font-family:"Space Grotesk";color:var(--ink)}
  .empty code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  footer{margin:26px 0 46px;color:var(--ink-soft);font-size:12px}
  footer hr{border:none;border-top:1px solid var(--line);margin:0 0 13px}
  footer b{color:var(--ink)}
  @media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.hero .win2{margin-left:0;width:100%;text-align:left;margin-top:6px}.hero .top{flex-wrap:wrap}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ===== Cold Snap -> Summer Ale (table/KPI rebuild) ===== */
  .cx-kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:18px 0 0}
  @media(max-width:900px){.cx-kpi-strip{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.cx-kpi-strip{grid-template-columns:repeat(2,1fr)}}
  .cx-kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow)}
  .cx-kpi-label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0}
  .cx-kpi-val{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:23px;margin:6px 0 0;line-height:1}
  .cx-kpi-val.good{color:var(--good)}
  .cx-kpi-val.risk{color:var(--accent)}
  .cx-kpi-val.info{color:#9CC4EE}
  .cx-kpi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px}

  .cx-card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-top:22px;box-shadow:var(--shadow)}
  .cx-table-scroll{max-height:640px;overflow-y:auto}
  .cx-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .cx-table th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
  .cx-table td{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
  .cx-table tr:last-child td{border-bottom:none}
  .cx-num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Space Grotesk",sans-serif}
  .cx-mini-track{display:inline-block;width:64px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
  .cx-mini-fill{height:100%;background:var(--good)}
  .cx-mini-fill.warn{background:var(--gold)}
  .cx-mini-fill.risk{background:var(--accent)}
  .cx-rep-row{cursor:pointer}
  .cx-rep-row:hover{background:var(--card2)}
  .cx-rep-row td:first-child{display:flex;align-items:center;gap:8px}
  .cx-chev{font-size:10px;color:var(--ink-soft);transition:transform .15s;display:inline-block}
  .cx-rep-row.expanded .cx-chev{transform:rotate(90deg)}
  .cx-sub{display:none}
  .cx-sub.open{display:table-row}
  .cx-sub td{background:var(--card2);padding:0}
  .cx-sub-inner{padding:12px 24px 16px 38px}
  .cx-sub-inner table{font-size:12.5px;width:100%;border-collapse:collapse}
  .cx-sub-inner th{padding:6px 10px;text-align:left;color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  .cx-sub-inner td{padding:6px 10px;border-bottom:1px solid var(--line-soft)}
  .cx-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
  .cx-status-converted{color:var(--good);background:var(--good-soft)}
  .cx-status-gained{color:#9CC4EE;background:#1B3A5B}
  .cx-status-opportunity{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .cx-rate.good{color:var(--good);font-weight:600}
  .cx-rate.warn{color:var(--gold);font-weight:600}
  .cx-rate.risk{color:var(--accent);font-weight:600}
  .cx-rate.na{color:var(--ink-soft)}
  .cx-hero-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .cx-hero-stat{font-family:"Space Grotesk",sans-serif;font-size:13.5px;color:var(--ink-soft)}
  .cx-hero-stat b{color:var(--ink)}
</style></head><body>
<div class="gx-head"><div class="wrap">
  <p class="eyebrow"><span class="pulse"></span> Kohler Distributing · Boston Beer · Summer 2026</p>
  <h1>Boston Beer Programs</h1>
  <p class="lede">Two plays this summer: convert <b>Cold Snap → Summer Ale</b> draft lines, and grow <b>Sun Cruiser</b> volume over last year. Switch programs below, then tap your name.</p>
  <p class="updated" id="updated"></p>
</div></div>
<div id="app"><div class="wrap">
  <div class="seg"><p class="lbl">Program</p><div class="chips" id="progTabs"></div></div>
  <div class="seg"><p class="lbl">Pick a rep</p><div class="chips" id="chips"></div></div>
  <div id="body"></div>
  <footer><hr><p id="foot"></p></footer>
</div></div>
<script>

const REPS=new Set(["Alex Rodriguez","Alisa Acciardi","Allison Scott","Andrew Lundy","Anthony Palmisano","Brian Sengebush","Chris Payton","Chris Politano","Dan Lagala","Dave Ehlers","Default","Derrick Laws","Dylan Rubino","Hakan Sadik","Jaime Colonna","Javier Melo","Jayson Romine","Jim Heaney","John Neukum","John O'Donoghue","Klejdi Lamo","Matt Powierski","Michael Harboy","Mike Ast","Nick Melissari","Office Tell Sell","Pablo Lopez","Paul Mclaughlin","Phil Ernst","Robin Feldman","Shane Barreca"]);
let CONV=[], SC={}, activeProgram="conv", activeRep="ALL", uid=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ce0=n=>Math.round(n).toLocaleString();
function parseCSV(t){const R=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch==='"')q=true;else if(ch===','){row.push(c);c="";}else if(ch==='\n'){row.push(c);R.push(row);row=[];c="";}else if(ch==='\r'){}else c+=ch;}}if(c.length||row.length){row.push(c);R.push(row);}return R.filter(r=>r.some(x=>x.trim()!==""));}
function col(H,...n){const h=H.map(x=>x.toLowerCase().trim());for(const k of n){const i=h.findIndex(x=>x.includes(k));if(i>=0)return i;}return -1;}
const num=x=>{const v=parseFloat(String(x).replace(/[^0-9.\-]/g,""));return isNaN(v)?0:v;};
function statTile(k,v,s){return `<div class="stat"><p class="k">${k}</p><p class="v num">${v}${s||""}</p></div>`;}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>';
const TROPHY='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v3a6 6 0 0 1-12 0V4z"/><path d="M6 5H4a2 2 0 0 0 2 2M18 5h2a2 2 0 0 1-2 2M9 20h6M12 13v7"/></svg>';
const medalColor=r=>r===1?"var(--gold)":r===2?"var(--silver)":"var(--bronze)";

/* ============ CONVERSION (Cold Snap -> Summer Ale) ============ */
function ingestConv(text){const rows=parseCSV(text);if(rows.length<2)return;const H=rows[0];
  const ci={rep:col(H,"sales rep","rep"),name:col(H,"customer name","customer"),cold:col(H,"cold snap"),summer:col(H,"summer ale"),ind:col(H,"conversion indicator","indicator")};
  for(let i=1;i<rows.length;i++){const r=rows[i];const rep=(r[ci.rep]||"").trim();if(!rep)continue;
    const cold=(r[ci.cold]||"").trim()==="1", summer=(r[ci.summer]||"").trim()==="1", ind=(r[ci.ind]||"").trim();
    let cat=cold&&summer?"Converted":(cold&&!summer?"Opportunity":(!cold&&summer?"Gained":(/opportun/i.test(ind)?"Opportunity":(/gain/i.test(ind)?"Gained":"Converted"))));
    CONV.push({rep,name:(r[ci.name]||"").trim(),cold,summer,cat});}}
function convScope(){return activeRep==="ALL"?CONV:CONV.filter(r=>r.rep===activeRep);}
function convMetrics(rows){const conv=rows.filter(r=>r.cat==="Converted").length,opp=rows.filter(r=>r.cat==="Opportunity").length,gained=rows.filter(r=>r.cat==="Gained").length;const base=conv+opp;return {conv,opp,gained,base,rate:base?conv/base*100:0};}
function cxStatusTag(cat){
  if(cat==="Converted") return '<span class="cx-status cx-status-converted">✓ Converted</span>';
  if(cat==="Gained") return '<span class="cx-status cx-status-gained">+ Gained</span>';
  if(cat==="Opportunity") return '<span class="cx-status cx-status-opportunity">⚠ Opportunity</span>';
  return cat;
}
function cxRateClass(rate){
  if(rate===null) return 'na';
  if(rate>=90) return 'good';
  if(rate>=70) return 'warn';
  return 'risk';
}
function cxRepAgg(){
  const by={};
  CONV.forEach(r=>{
    const R=by[r.rep]||(by[r.rep]={rep:r.rep,converted:0,opportunity:0,gained:0});
    if(r.cat==="Converted")R.converted++;else if(r.cat==="Opportunity")R.opportunity++;else if(r.cat==="Gained")R.gained++;
  });
  return Object.values(by).map(R=>{
    const base=R.converted+R.opportunity;
    return {...R,cold_snap_base:base,summer_total:R.converted+R.gained,conv_rate:base?Math.round(R.converted/base*1000)/10:null};
  });
}
function cxAcctTable(accounts){
  if(!accounts||accounts.length===0) return '<div class="cx-sub-inner">No accounts recorded.</div>';
  const order={Opportunity:0,Gained:1,Converted:2};
  const sorted=accounts.slice().sort((a,b)=>order[a.cat]-order[b.cat]);
  const rows=sorted.map(a=>`<tr>
    <td>${esc(a.name)}</td>
    <td class="cx-num">${a.cold?'✓':'—'}</td>
    <td class="cx-num">${a.summer?'✓':'—'}</td>
    <td>${cxStatusTag(a.cat)}</td>
  </tr>`).join("");
  return `<div class="cx-sub-inner"><table><thead><tr><th>Customer</th><th class="cx-num">Cold Snap</th><th class="cx-num">Summer Ale</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function bindCxRows(app){
  app.querySelectorAll('.cx-rep-row').forEach(row=>{
    row.addEventListener('click',()=>{
      document.getElementById(row.dataset.target).classList.toggle('open');
      row.classList.toggle('expanded');
    });
  });
}
function renderConv(app){
  const t=convMetrics(CONV);

  if(activeRep==="ALL"){
    const kpis=[
      {label:'Overall Conversion Rate', val:t.rate.toFixed(1)+'%', cls:cxRateClass(t.rate)==='good'?'good':(cxRateClass(t.rate)==='warn'?'':'risk'), sub:t.conv+' / '+t.base+' Cold Snap accounts converted'},
      {label:'Cold Snap Base (Jan–Mar)', val:t.base, cls:'', sub:'accounts with a Cold Snap line'},
      {label:'Converted', val:t.conv, cls:'good', sub:'held both seasonal lines'},
      {label:'Opportunities', val:t.opp, cls:'risk', sub:'Cold Snap, no Summer Ale — follow up'},
      {label:'Gained Not from Conversion', val:t.gained, cls:'info', sub:'net-new Summer Ale placements'},
    ];
    const stripHtml=kpis.map(k=>`<div class="cx-kpi"><div class="cx-kpi-label">${k.label}</div><div class="cx-kpi-val ${k.cls}">${k.val}</div><div class="cx-kpi-sub">${k.sub}</div></div>`).join("");

    const reps=cxRepAgg().sort((a,b)=>{
      const ra=a.conv_rate===null?-1:a.conv_rate, rb=b.conv_rate===null?-1:b.conv_rate;
      return ra-rb;
    });
    const rows=reps.map(R=>{
      const rowId='cxrow'+(uid++);
      const rateTxt=R.conv_rate===null?'—':R.conv_rate.toFixed(1)+'%';
      const barW=R.conv_rate===null?0:R.conv_rate;
      const barCls=cxRateClass(R.conv_rate)==='good'?'':cxRateClass(R.conv_rate);
      const accounts=CONV.filter(r=>r.rep===R.rep);
      return `<tr class="cx-rep-row" data-target="${rowId}">
        <td><span class="cx-chev">▶</span>${esc(R.rep)}</td>
        <td class="cx-num">${R.cold_snap_base}</td>
        <td class="cx-num">${R.converted}</td>
        <td class="cx-num"><span class="cx-mini-track"><span class="cx-mini-fill ${barCls}" style="width:${barW}%"></span></span><span class="cx-rate ${cxRateClass(R.conv_rate)}">${rateTxt}</span></td>
        <td class="cx-num">${R.opportunity}</td>
        <td class="cx-num">${R.gained}</td>
        <td class="cx-num">${R.summer_total}</td>
      </tr>
      <tr class="cx-sub" id="${rowId}"><td colspan="7">${cxAcctTable(accounts)}</td></tr>`;
    }).join("");

    app.innerHTML=`<div class="cx-kpi-strip">${stripHtml}</div>
      <div class="cx-card"><div class="cx-table-scroll"><table class="cx-table">
        <thead><tr><th>Rep</th><th class="cx-num">Cold Snap Base</th><th class="cx-num">Converted</th><th class="cx-num">Conversion Rate</th><th class="cx-num">Opportunities</th><th class="cx-num">Gained</th><th class="cx-num">Summer Ale Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>`;
    bindCxRows(app);
  } else {
    const rows=convScope();
    const m=convMetrics(rows);
    const rateTxt=m.base?m.rate.toFixed(1)+'%':'—';
    app.innerHTML=`<div class="hero"><div class="nm">${esc(activeRep)}</div>
      <div class="cx-hero-stats">
        <div class="cx-hero-stat">Cold Snap base: <b>${m.base}</b></div>
        <div class="cx-hero-stat">Converted: <b>${m.conv}</b></div>
        <div class="cx-hero-stat">Conversion rate: <b class="cx-rate ${cxRateClass(m.base?m.rate:null)}">${rateTxt}</b></div>
        <div class="cx-hero-stat">Opportunities: <b>${m.opp}</b></div>
        <div class="cx-hero-stat">Gained: <b>${m.gained}</b></div>
        <div class="cx-hero-stat">Summer Ale total: <b>${m.conv+m.gained}</b></div>
      </div></div>
      <div class="cx-card">${cxAcctTable(rows)}</div>`;
  }
}

/* ============ SUN CRUISER (YoY volume) ============ */
function ingestSC(text){const rows=parseCSV(text);if(rows.length<2)return;const H=rows[0];
  const ri=col(H,"sales rep","rep"), pri=col(H,"product name","product"), pki=col(H,"package"), li=col(H,"2025"), ti=col(H,"2026");
  if(pri>=0 && ri>=0 && pri!==ri){
    // FLAT layout: one row per rep / package / product
    for(let i=1;i<rows.length;i++){const r=rows[i];const rep=(r[ri]||"").trim();if(!rep||rep==="Total")continue;
      SC[rep]=SC[rep]||{ly:0,ty:0,skus:[]};const ly=num(r[li]),ty=num(r[ti]);
      SC[rep].ly+=ly;SC[rep].ty+=ty;SC[rep].skus.push({name:(r[pri]||"").trim(),pkg:(pki>=0?r[pki]:"").trim(),ly,ty});}
  } else {
    // NESTED fallback: rep -> package group -> SKU (package id in col B)
    let cur=null;
    for(let i=1;i<rows.length;i++){const r=rows[i];const a=(r[0]||"").trim(),b=(r[1]||"").trim();
      if(a==="Total"||a==="")continue;
      if(b){ if(cur){SC[cur].ly+=num(r[2]);SC[cur].ty+=num(r[3]);SC[cur].skus.push({name:a,pkg:b,ly:num(r[2]),ty:num(r[3])});} }
      else if(REPS.has(a)){cur=a;SC[cur]=SC[cur]||{ly:0,ty:0,skus:[]};}}
  }}
function renderSC(app){
  const reps=Object.entries(SC).map(([n,v])=>({name:n,ly:v.ly,ty:v.ty,skus:v.skus})).filter(r=>r.ty>0||r.ly>0);
  if(activeRep==="ALL"){
    const ty=reps.reduce((s,r)=>s+r.ty,0),ly=reps.reduce((s,r)=>s+r.ly,0);
    const yoy=ly?((ty-ly)/ly*100):0;
    const stats=`<div class="stats">${statTile("Reps",reps.length,"")}${statTile("2026 cases",ce0(ty),"")}${statTile("2025 cases",ce0(ly),"")}${statTile("vs 2025",(yoy>=0?"+":"")+yoy.toFixed(0)+"%","")}</div>`;
    const ranked=reps.slice().sort((a,b)=>b.ty-a.ty).map((R,i)=>({...R,rank:i+1}));
    const max=ranked[0]?ranked[0].ty:1;
    const rows=ranked.map(R=>{const d=R.ty-R.ly;return `<div class="lrow${R.rank<=3?' top':''}" style="--mc:${medalColor(R.rank)}" role="button" tabindex="0" data-rep="${esc(R.name)}"><span class="medal ${R.rank<=3?'m'+R.rank:''}">${R.rank}</span><span class="who"><b>${esc(R.name)}</b><div class="sub">2025 ${ce0(R.ly)} → 2026 ${ce0(R.ty)} · ${d>=0?'+':''}${ce0(d)}</div><div class="track"><i style="width:${(R.ty/max*100).toFixed(1)}%"></i></div></span><span class="win">${ce0(R.ty)}<small>2026 cases</small></span></div>`;}).join("");
    app.innerHTML=stats+`<div class="shead"><span class="tr">${TROPHY}</span><h2>Volume leaderboard</h2><span class="meta">${ranked.length} reps · by 2026 cases (May–Aug)</span></div><div class="board">${rows}</div>`;
    bindRows(app);
  } else {
    const R=SC[activeRep]||{ly:0,ty:0,skus:[]};
    const ranked=reps.slice().sort((a,b)=>b.ty-a.ty).map(x=>x.name);const rank=ranked.indexOf(activeRep)+1;
    const d=R.ty-R.ly, yoy=R.ly?((R.ty-R.ly)/R.ly*100):0;
    const pct=R.ly?Math.min(R.ty/R.ly*100,100):0;
    const hero=`<div class="hero"><div class="top"><div class="rankbox"><div class="big num">${rank||"–"}</div><div class="lab">Rank</div></div><div class="nm">${esc(activeRep)}<small>${ce0(R.ty)} cases in 2026 · ${d>=0?'+':''}${ce0(d)} vs 2025 (${yoy>=0?'+':''}${yoy.toFixed(0)}%)</small></div><div class="win2"><div class="b num">${ce0(R.ty)}</div><div class="l">2026 cases</div></div></div>
      <div class="qline" style="margin-top:14px"><span>2026 pace vs 2025 total</span><span class="num">${ce0(R.ty)} / ${ce0(R.ly)}</span></div>
      <div class="bar ${R.ty>=R.ly?'done':''}"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="pl" style="margin-top:9px">2026 is still filling in (May–Aug). Bar turns green once you pass last year's full total.</div></div>`;
    const groups={};
    R.skus.forEach(s=>{const g=groups[s.pkg]||(groups[s.pkg]={pkg:s.pkg,ly:0,ty:0,items:[]});g.ly+=s.ly;g.ty+=s.ty;g.items.push(s);});
    const gArr=Object.values(groups).sort((a,b)=>b.ty-a.ty);
    const cards=gArr.map(g=>{
      const items=g.items.slice().sort((a,b)=>b.ty-a.ty).map(s=>`<div class="brow"><span>${esc(s.name)}</span><span class="num">${ce0(s.ty)}<small> / ${ce0(s.ly)} '25</small></span></div>`).join("");
      return `<div class="quest"><div class="sup">${esc(g.pkg||"Other")}<span class="badge prog">${ce0(g.ty)} / ${ce0(g.ly)} '25</span></div><div class="brk" style="border-top:none;padding-top:4px"><div class="cap">2026 cases / 2025 cases</div>${items}</div></div>`;
    }).join("");
    app.innerHTML=hero+`<div class="shead"><h2>By package</h2><span class="meta">${gArr.length} package groups</span></div>`+cards;
  }
}

/* ============ shell ============ */
function bindRows(app){app.querySelectorAll(".lrow[data-rep]").forEach(el=>{const go=()=>setRep(el.dataset.rep);el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});}
/* ============ BASE DISTRIBUTION (placements vs brand goals) ============ */
const BASE_COLORS=["#C8472E","#F2A900","#2BB7B3","#8E2DE2","#2F6FB0","#E0457B","#5BA84A","#E07B39"];
let GPB={},GPB_BRANDS=[];
function ingestBase(text){const rows=parseCSV(text);if(rows.length<2)return;const H=rows[0];
  const ri=col(H,"sales rep","rep"), bi=col(H,"brand family","brand");
  let pi=H.findIndex(h=>h.trim().toLowerCase()==="placements"); if(pi<0)pi=H.findIndex(h=>/placement/i.test(h)&&!h.includes("(")&&!/goal/i.test(h));
  const gi=H.findIndex(h=>/goal/i.test(h)&&!/%/.test(h)),brands=new Set();
  for(let i=1;i<rows.length;i++){const r=rows[i];const rep=(r[ri]||"").trim(),brand=(r[bi]||"").trim();if(!rep||!brand)continue;
    GPB[rep]=GPB[rep]||{};GPB[rep][brand]=GPB[rep][brand]||{p:0,g:0};
    GPB[rep][brand].p+=num(r[pi]);GPB[rep][brand].g+=(gi>=0?num(r[gi]):0);brands.add(brand);}
  GPB_BRANDS=[...brands].sort((a,b)=>baseTot(b).p-baseTot(a).p);}
function baseTot(b){let p=0,g=0;Object.values(GPB).forEach(d=>{if(d[b]){p+=d[b].p;g+=d[b].g;}});return{p,g};}
function baseAgg(rep){const d=GPB[rep]||{};let p=0,gp=0,g=0;GPB_BRANDS.forEach(b=>{if(d[b]){p+=d[b].p;if(d[b].g>0){gp+=d[b].p;g+=d[b].g;}}});return{p,gp,g,pct:g?gp/g*100:null};}
const bcolorB=b=>BASE_COLORS[GPB_BRANDS.indexOf(b)%BASE_COLORS.length];
function renderBase(app){
  const reps=Object.keys(GPB);
  if(activeRep==="ALL"){
    let tp=0,tgp=0,tg=0;reps.forEach(r=>{const a=baseAgg(r);tp+=a.p;tgp+=a.gp;tg+=a.g;});
    const opct=tg?(tgp/tg*100):0;
    const stats=`<div class="stats">${statTile("Reps",reps.length,"")}${statTile("Placements",tp.toLocaleString(),"")}${statTile("Goal",tg.toLocaleString(),"")}${statTile("% of goal",opct.toFixed(0)+"%","")}</div>`;
    const ranked=reps.map(r=>({rep:r,...baseAgg(r)})).sort((a,b)=>{if(a.pct===null&&b.pct===null)return b.p-a.p;if(a.pct===null)return 1;if(b.pct===null)return -1;return b.pct-a.pct||b.p-a.p;}).map((r,i)=>({...r,rank:i+1}));
    const rows=ranked.map(R=>{const hit=R.pct!==null&&R.pct>=100;const win=R.pct===null?`${R.p}<small>placed</small>`:`${R.pct.toFixed(0)}%<small>of goal</small>`;
      const sub=R.pct===null?`${R.p} placed · no goal set`:`${R.gp} / ${R.g} goal`;
      return `<div class="lrow${R.rank<=3?' top':''}" style="--mc:${medalColor(R.rank)}" role="button" tabindex="0" data-rep="${esc(R.rep)}"><span class="medal ${R.rank<=3?'m'+R.rank:''}">${R.rank}</span><span class="who"><b>${esc(R.rep)}</b><div class="sub">${sub}</div><div class="track"><i style="width:${Math.min(R.pct||0,100).toFixed(1)}%"></i></div></span><span class="win" style="${hit?'color:var(--good)':''}">${win}</span></div>`;}).join("");
    app.innerHTML=stats+`<div class="shead"><span class="tr">${TROPHY}</span><h2>Distro goal leaderboard</h2><span class="meta">${ranked.length} reps · by % of goal</span></div><div class="board">${rows}</div>`;
    bindRows(app);
  } else {
    const a=baseAgg(activeRep),d=GPB[activeRep]||{};
    const rank=reps.map(r=>({rep:r,...baseAgg(r)})).sort((x,y)=>{if(x.pct===null&&y.pct===null)return y.p-x.p;if(x.pct===null)return 1;if(y.pct===null)return -1;return y.pct-x.pct;}).map(x=>x.rep).indexOf(activeRep)+1;
    const hero=`<div class="hero"><div class="top"><div class="rankbox"><div class="big num">${rank||"–"}</div><div class="lab">Rank</div></div><div class="nm">${esc(activeRep)}<small>${a.p} placements${a.g?` · ${a.gp} of ${a.g} toward goal`:''}</small></div><div class="win2"><div class="b num">${a.pct===null?a.p:a.pct.toFixed(0)+'%'}</div><div class="l">${a.pct===null?'Placed':'of goal'}</div></div></div></div>`;
    const items=GPB_BRANDS.filter(b=>d[b]).map(b=>({b,p:d[b].p,g:d[b].g})).sort((x,y)=>(y.g?y.p/Math.max(y.g,1):0)-(x.g?x.p/Math.max(x.g,1):0)||y.p-x.p);
    const rows=items.map(x=>{const pct=x.g?Math.min(x.p/x.g*100,100):0;const hit=x.g&&x.p>=x.g;
      const right=x.g?`${x.p} / ${x.g} <small>${(x.p/x.g*100).toFixed(0)}%</small>`:`${x.p} <small>no goal</small>`;
      return `<div class="brow" style="flex-direction:column;align-items:stretch;gap:5px"><div style="display:flex;justify-content:space-between"><span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${bcolorB(x.b)};margin-right:8px"></span>${esc(x.b)}${hit?` <span style="color:var(--good)">${CHECK}</span>`:''}</span><span class="num">${right}</span></div><div class="bar ${hit?'done':''}" style="height:7px"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;}).join("");
    app.innerHTML=hero+`<div class="quest"><div class="sup">Placements vs goal by brand</div><div class="brk" style="border-top:none;padding-top:6px">${rows}</div></div>`;
  }
}

function currentReps(){if(activeProgram==="conv")return [...new Set(CONV.map(r=>r.rep))].sort();if(activeProgram==="sc")return Object.keys(SC).filter(n=>SC[n].ty>0||SC[n].ly>0).sort();return Object.keys(GPB).filter(r=>baseAgg(r).p>0).sort();}
function render(){const app=document.getElementById("body");(activeProgram==="conv"?renderConv:activeProgram==="sc"?renderSC:renderBase)(app);}
function setRep(v){activeRep=v;document.querySelectorAll("#chips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===activeRep));render();window.scrollTo({top:0,behavior:"smooth"});}
function setProgram(p){if(p===activeProgram)return;activeProgram=p;activeRep="ALL";renderTabs();renderChips();render();window.scrollTo({top:0,behavior:"smooth"});}
function renderTabs(){const t=[["conv","Cold Snap → Summer Ale"],["sc","Sun Cruiser Volume"],["base","Base Distro"]];
  document.getElementById("progTabs").innerHTML=t.map(([v,l])=>`<button class="chip" aria-pressed="${v===activeProgram}" data-v="${v}">${l}</button>`).join("");
  document.querySelectorAll("#progTabs .chip").forEach(b=>b.addEventListener("click",()=>setProgram(b.dataset.v)));}
function renderChips(){const reps=currentReps();
  document.getElementById("chips").innerHTML=["ALL",...reps].map(v=>`<button class="chip" aria-pressed="${v===activeRep}" data-v="${esc(v)}">${v==="ALL"?"All reps":esc(v)}</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(b=>b.addEventListener("click",()=>setRep(b.dataset.v)));}
function showEmpty(m){document.getElementById("app").innerHTML=`<div class="empty"><h2>No data yet</h2><p>${m}</p></div>`;}
async function boot(){
  let convText=null,scText=null,lastMod=null;
  try{const r=await fetch("data.csv",{cache:"no-store"});if(r.ok){lastMod=r.headers.get("last-modified");convText=await r.text();}}catch(e){}
  try{const r=await fetch("suncruiser.csv",{cache:"no-store"});if(r.ok){scText=await r.text();}}catch(e){}
  let baseText=null;
  try{const r=await fetch("base_distro.csv",{cache:"no-store"});if(r.ok){baseText=await r.text();}}catch(e){}
  if(convText)ingestConv(convText);
  if(scText)ingestSC(scText);
  if(baseText)ingestBase(baseText);
  if(!CONV.length&&!Object.keys(SC).length&&!Object.keys(GPB).length){showEmpty("Upload <code>data.csv</code> (Cold Snap → Summer Ale conversion), <code>suncruiser.csv</code> (Sun Cruiser volume) and <code>base_distro.csv</code> (base distribution) next to this page.");return;}
  if(!CONV.length)activeProgram=Object.keys(SC).length?"sc":"base";
  renderTabs();renderChips();render();
  document.getElementById("updated").textContent=lastMod?"Updated "+new Date(lastMod).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):"";
  document.getElementById("foot").innerHTML="<b>Cold Snap → Summer Ale:</b> Converted = had Cold Snap (Jan–Mar) and now has Summer Ale (Apr–Jun); Opportunity = had Cold Snap, no Summer Ale yet; Gained = new Summer Ale. <b>Sun Cruiser Volume:</b> cases this year (5/1–8/31/2026, in progress) vs last year's full window. <b>Base Distro:</b> placements vs each brand's goal — % of goal drives the board. Re-export each report as data.csv / suncruiser.csv / base_distro.csv to refresh.";
}
boot();

</script></body></html>
